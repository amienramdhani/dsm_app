<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Mockup · Mint Beranda + Peringkat atas + Peringkat ASM</title><style>
*{box-sizing:border-box}body{margin:0;font:12px/1.3 Inter,system-ui,Arial,sans-serif;background:#DDE4F5;color:#15232E}
.top{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #DDE3EA;padding:8px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:#CBD5E0;border-radius:99px;padding:3px}.seg button{border:0;background:none;padding:5px 12px;border-radius:99px;font:700 11px Inter,sans-serif;cursor:pointer;color:#15303F}.seg button.on{background:#fff}
.note{margin:12px 14px 0;background:#fff;border-left:4px solid #F0A400;border-radius:8px;padding:9px 12px}
.wrap{margin:12px 14px}.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px #0001;overflow:hidden;margin-bottom:10px}
.lab{font:800 10px Inter;color:#6B7785;letter-spacing:.4px;margin:12px 2px 6px}
/* kartu */
.ks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ks.m{grid-template-columns:repeat(2,1fr);max-width:390px}
.k0{background:#fff;border-radius:12px;box-shadow:0 1px 4px #0001;padding:10px 12px;display:flex;gap:10px;align-items:center;border-left:4px solid var(--c)}
.k0 .ic{width:30px;height:30px;border-radius:9px;background:var(--l);color:var(--c);display:grid;place-items:center;font-weight:800}
.k0 small{display:block;color:#6B7785;font-size:9.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}.k0 b{font-size:20px;color:var(--c)}.k0 em{display:block;font-style:normal;color:#6B7785;font-size:10px}
.k1{background:#E8F7EF;border:1px solid #CFEBDC;border-radius:12px;padding:9px 14px}
.k1 small{display:block;font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:#3F6F58}.k1 b{display:block;font-size:20px;color:#0F4F3B;margin:1px 0}.k1 em{display:block;font-style:normal;font-size:10.5px;color:#4E7A66}
.k1 .pg{height:4px;border-radius:3px;background:#CFEBDC;margin-top:5px}.k1 .pg i{display:block;height:100%;border-radius:3px;background:#12866A}
.k1 .gr{display:inline-block;margin-left:6px;border-radius:99px;padding:0 6px;font-size:9.5px;font-weight:800;background:#fff;color:#0F6B4A}.k1 .gr.n{color:#B0332E}
.ks.m .k1{padding:7px 10px}.ks.m .k1 b{font-size:17px}.ks.m .k1 em{font-size:9.5px}
/* peringkat atas */
.ban{background:#0B5BAE;color:#fff;border-radius:14px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.ban b{font-size:22px}
.blk{background:#fff;border-radius:14px;padding:12px 18px;margin-top:8px;font-weight:800}.in{border:1px solid #D5DCE4;border-radius:8px;padding:8px;color:#8A94A0;font-size:10px;font-weight:400;margin-top:8px}
.hd2{display:flex;align-items:center;gap:14px;padding:10px 14px}.hd2 h1{margin:0;font-size:16px;color:#10394E}.hd2 small{color:#6B7785}.per{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:11px}.per span{background:#E6EBF1;border-radius:99px;padding:4px 10px;font-weight:700;color:#15303F}
.fl{display:flex;gap:8px;align-items:center;padding:0 14px 12px}.fl .sr{flex:1;height:32px;border:1px solid #CBD5E0;border-radius:8px;padding:0 10px;display:flex;align-items:center;color:#8A94A0}.fl .dd{height:32px;border:1px solid #CBD5E0;border-radius:8px;padding:0 10px;display:flex;align-items:center;gap:6px;white-space:nowrap}.dd i{font-style:normal;color:#6B7785;font-size:10px;font-weight:700}
.ib{width:20px;height:20px;border-radius:50%;border:1.5px solid #6B7785;color:#6B7785;font:700 11px/17px Inter;text-align:center;cursor:help}
.tabs{display:flex;gap:10px;align-items:center;padding:0 14px 10px}
/* tabel */
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th{background:#E6EBF1;font-size:11px;padding:6px 9px;text-align:left;border-top:3px solid #15303F;border-bottom:2px solid #15303F;border-right:1px solid #D5DCE4;white-space:nowrap}th.ki{background:#E3EEFB;color:#1E5FB8;border-top-color:#1E5FB8}th.mp{background:#FCEBE2;color:#B33D0B;border-top-color:#B33D0B}th.ak{background:#E3F6EC;color:#0F6B4A;border-top-color:#12866A}
td{padding:0 9px;height:25px;border-bottom:1px solid #E6EBF1;border-right:1px solid #EEF1F5;font-size:11px;white-space:nowrap}td.r{text-align:right}td.c{text-align:center}td.nm{font-weight:700;color:#10394E}
tr.t1 td:first-child{box-shadow:inset 4px 0 #E0A800}tr.t2 td:first-child{box-shadow:inset 4px 0 #9AA5B1}tr.t3 td:first-child{box-shadow:inset 4px 0 #B87333}tr.t1 td,tr.t2 td,tr.t3 td{background:#FFFCF0}tr.bt td{background:#FFF6F5}tr.bt td:first-child{box-shadow:inset 4px 0 #D2453F}
.bar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle;margin-right:6px}.fs{background:#EEF1F5;color:#455A64;font-size:9.5px;font-weight:700;border-radius:99px;padding:2px 8px}
.ph{padding:10px 14px;border-top:1px solid #EEF1F5;display:flex;align-items:baseline;gap:10px}.ph b{font-size:13px;color:#10394E}.ph small{color:#6B7785}
</style></head><body>
<div class="top"><b>Lanjutan · desktop</b><div class="seg" id="tb"><button data-t="a" class="on">A · KARTU MINT BERANDA</button><button data-t="b">B · FILTER REGION PERINGKAT</button><button data-t="c">C · PERINGKAT MODE ASM</button></div><div class="seg" id="m"><button data-m="now">SEKARANG</button><button data-m="new" class="on">USULAN</button></div></div>
<div class="note" id="note"></div><div class="wrap" id="out"></div>
<script>
const f=v=>v.toFixed(1).replace('.',',')+'%';
const KS=[['OMZET','Rp 48,72 M','Termasuk aksesori Rp 2,1 M','#9A6400','#FFF0C7','Rp',72,'+8,2%'],['KPI AKHIR','64,0%','2 kelompok · Sementara','#1E5FB8','#E3EEFB','%',64,''],['DEALER AKTIF','1.188','Target 1.350 · Produktif 1.327','#0E7C6B','#E2F4F1','◉',88,'-3,1%'],['SELLTHRU','30.072','Unit device · bulan pilihan','#1E5FB8','#E3EEFB','↑',82,'+12,4%']];
const k0=a=>`<div class="k0" style="--c:${a[3]};--l:${a[4]}"><div class="ic">${a[5]}</div><div><small>${a[0]}</small><b>${a[1]}</b><em>${a[2]}</em></div></div>`;
const k1=a=>`<div class="k1"><small>${a[0]}</small><b>${a[1]}</b><em>${a[2]}${a[7]?`<span class="gr ${a[7][0]=='-'?'n':''}">${a[7]}</span>`:''}</em><div class="pg"><i style="width:${a[6]}%"></i></div></div>`;
function A(n){return n?`<div class="lab">DESKTOP · USULAN (mint, tanpa ikon; progress tipis ke target dan chip growth tetap ada)</div><div class="ks">${KS.map(k1).join('')}</div><div class="lab">HP · USULAN (2 kolom slim, mint, tanpa ikon)</div><div class="ks m">${KS.map(k1).join('')}</div>`:`<div class="lab">DESKTOP · SEKARANG (putih, ikon, garis kiri + angka berwarna indikator)</div><div class="ks">${KS.map(k0).join('')}</div>`}
const D=[['IMAM FAISAL','ASM Contoh A','JABODEBEK','BOGOR-DEPOK',101.3,56.0,2,78.7],['MOHAMMAD NOVRIAN','ASM Contoh B','JABODEBEK','JAKARTA',67.2,86.6,2,76.9],['FENDI ERYANTORO','ASM Contoh C','JAWA TIMUR','JAWA TIMUR 1',87.2,66.4,2,76.8],['THEO FALCHEN S','ASM Contoh B','JABODEBEK','JAKARTA',69,59,2,64],['REFKY WIJAYA','ASM Contoh B','JABODEBEK','JAKARTA',31.8,41,2,36.4],['ABDURACHIM NR','ASM Contoh D','JAWA TIMUR','JAWA TIMUR 2',46.1,0,2,23.1]];
const col=v=>v>=90?'#12866A':v>=60?'#C28A00':'#D2453F';
function Bn(n){const dd=(l,v,hi)=>`<div class="dd" style="${hi?'border-color:#1E5FB8;box-shadow:0 0 0 2px #1E5FB822':''};font-weight:700"><i>${l}</i> ${v} <span style="color:#6B7785">▾</span></div>`;
return `<div class="ban"><div><b>PERINGKAT</b><br><small>Papan peringkat KPI Sales dan ASM</small></div><div>MTD 1–28 Sep vs LMTD 1–28 Agu</div></div><div class="blk">CARI &amp; KROSCEK KPI ⓘ<div class="in">Cari nama atau NIK, mis. fendi / 2024.12</div></div><div class="blk" style="font-weight:400;font-size:10px;background:#EAF0FB">Peringkat individu tersedia untuk Sales dan ASM. Pilih cakupan Sales atau ASM untuk melihat posisinya.</div><div class="blk" style="padding:10px 14px"><div class="fl" style="padding:0;gap:8px"><div class="seg"><button class="on">DALAM CAKUPAN SAYA</button><button>NASIONAL</button></div><span style="width:1px;height:22px;background:#D5DCE4"></span>${dd('PERINGKAT','Sales')}${dd('DASAR','KPI Akhir (semua kelompok)')}${n?dd('REGION','Semua',true):''}${n?'<button style="height:32px;border:1px solid #CBD5E0;border-radius:8px;background:#fff;font:800 10.5px Inter;padding:0 12px;color:#4A5663">RESET</button>':''}<span class="ib" style="margin-left:auto" title="Peringkat individu tersedia untuk Sales dan ASM.">i</span></div></div>`}
function C(n){const asm=n;return `<div class="card"><div class="ph" style="border-top:0"><b>PAPAN PERINGKAT · ${asm?'ASM':'SALES'}</b><small>Urut KPI Akhir tertinggi</small></div><table><thead><tr><th style="width:46px;text-align:center">#</th><th>NAMA</th>${asm?'<th>JML SALES</th>':'<th>ASM</th>'}<th>BIG REGION</th><th>REGION</th><th class="ki" style="text-align:right">KPI ALL BRAND</th><th class="mp" style="text-align:right">KPI MOTOPAD</th><th>Σ GRUP KPI</th><th class="ak" style="min-width:170px">KPI AKHIR</th><th>STATUS</th></tr></thead><tbody>${D.map((r,i)=>`<tr class="${i<3?'t'+(i+1):i>=D.length-3?'bt':''}"><td class="c"><b>${['🥇','🥈','🥉'][i]||i+1}</b></td><td class="nm">${asm?'ASM Contoh '+'ABCDEF'[i]:r[0]}</td><td>${asm?[8,12,9,7,10,6][i]+' sales':r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="r">${f(r[4])}</td><td class="r">${f(r[5])}</td><td class="c">${r[6]}</td><td><span class="bar" style="width:${r[7]*.9}px;background:${col(r[7])}"></span><b style="color:${col(r[7])}">${f(r[7])}</b></td><td><span class="fs">SEMENTARA · S.D. 28 SEP 2026</span></td></tr>`).join('')}</tbody></table></div>`}
let T='a',M='new';
function render(){const n=M==='new';
const notes={a:n?'<b>USULAN A</b>: kartu KPI di Beranda desktop jadi mint (tanpa ikon, tanpa garis kiri) seperti Brand/DOS/Transaksi. Yang tetap: <b>progress tipis ke target</b> dan <b>chip growth</b> (biar info target/growth tidak hilang). Angka seragam hijau tua, warna indikator hanya lewat chip. Halaman KPI dan Tim tidak punya kartu KPI di atas, jadi tidak ada yang diubah di sana. HP: 2 kolom slim mint tanpa ikon (menggantikan gaya B2). Angka = contoh.':'<b>SEKARANG</b>: kartu putih berikon, garis kiri dan angka berwarna per indikator.',b:n?'<b>USULAN B</b>: bagian atas halaman Peringkat <b>tidak diubah</b> (banner, Cari &amp; Kroscek, info, pemilih tetap seperti sekarang). Yang ditambah hanya filter <b>REGION</b>, dan baris pemilih dirapikan: satu baris (tab cakupan, PERINGKAT, DASAR, REGION, RESET), kotak seragam 32px, label kecil di dalam kotak, ⓘ di kanan (daftar region sesuai cakupan akun; pilihan SEMUA = seperti sekarang). Filter menyaring papan peringkat; peringkat tetap dihitung dari seluruh peserta cakupan.':'<b>SEKARANG</b>: banner, Cari &amp; Kroscek, info, dan pemilih tanpa filter Region.',c:n?'<b>USULAN C</b>: mode ASM memakai tabel yang sama, kolom ASM diganti <b>JML SALES</b> (jumlah Sales di tim ASM itu); BIG REGION dan REGION tetap. Mode Telemarketing belum dimockup (perlu cek datanya dulu).':'<b>SEKARANG</b> (mode ASM): tabel lama tanpa Big Region.'};
document.getElementById('note').innerHTML=notes[T];
const body={a:A(n),b:Bn(n),c:n?C(true):'<div class="card" style="padding:14px">Mode ASM sekarang memakai tabel lama (gaya biru, tanpa BIG REGION). Lihat USULAN.</div>'}[T];
document.getElementById('out').innerHTML=body}
document.getElementById('tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;T=b.dataset.t;document.querySelectorAll('#tb button').forEach(x=>x.classList.toggle('on',x===b));render()};
document.getElementById('m').onclick=e=>{const b=e.target.closest('button');if(!b)return;M=b.dataset.m;document.querySelectorAll('#m button').forEach(x=>x.classList.toggle('on',x===b));render()};render();
</script></body></html>
