<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Mockup · Kalender Sell Thru + Pola Hari (ringkas)</title><style>
*{box-sizing:border-box}body{margin:0;font:12px/1.3 Inter,system-ui,Arial,sans-serif;background:#DDE4F5;color:#15232E}
.top{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #DDE3EA;padding:8px 14px;display:flex;gap:12px;align-items:center}
.seg{display:inline-flex;background:#CBD5E0;border-radius:99px;padding:3px}.seg button{border:0;background:none;padding:5px 12px;border-radius:99px;font:700 11px Inter,sans-serif;cursor:pointer}.seg button.on{background:#fff}
.note{margin:12px 14px 0;background:#fff;border-left:4px solid #F0A400;border-radius:8px;padding:9px 12px}
.wrap{margin:12px 14px}
.panel{background:#fff;border-radius:14px;box-shadow:0 1px 4px #0001;overflow:hidden}
.ph{padding:9px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #EEF1F5;flex-wrap:wrap}.ph b{font-size:13px;color:#10394E;letter-spacing:.3px}.ph small{color:#6B7785;font-size:11px}
.ib{width:17px;height:17px;border-radius:50%;border:1.5px solid #6B7785;color:#6B7785;font:700 10px/14px Inter,sans-serif;text-align:center;cursor:help}
.lg{margin-left:auto;display:flex;gap:10px;font-size:10px;color:#4A5663;align-items:center}.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pb{padding:10px 12px 12px}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:10px;align-items:stretch}.grid>.panel{display:flex;flex-direction:column}.grid>.panel>.pb{flex:1;display:flex;flex-direction:column}.grid>.panel .cal{flex:1;grid-template-rows:auto repeat(5,1fr)}.grid>.panel .cal .d{height:auto;min-height:0;display:flex;flex-direction:column;justify-content:center}.col{display:flex;flex-direction:column;gap:10px}
/* kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{font-size:9.5px;font-weight:800;color:#6B7785;text-align:center;padding-bottom:1px}.cal .h.m{color:#D2453F}
.d{border-radius:7px;padding:3px 6px;border:1px solid transparent;position:relative;overflow:hidden}.d b{font-size:9px;color:#6B7785;display:block;font-weight:700}.d span{font-size:11.5px;font-weight:800;display:block;font-variant-numeric:tabular-nums}
.d.g{background:#E3F6EC;color:#0F6B4A;border-color:#BFE6D1}.d.y{background:#FFF3C9;color:#8A6200;border-color:#F2E0A0}.d.r{background:#FFE0DE;color:#B0332E;border-color:#F5C4C1}.d.off{background:repeating-linear-gradient(135deg,#F4F6F9 0 5px,#E9EDF2 5px 6px);color:#9AA6B6}.d.fu{background:#F7F9FC;border:1px dashed #D5DCE4;color:#9AA6B6}.d.td{box-shadow:0 0 0 2px #1E5FB8 inset}
.d i{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.55}
.cal.big .d{padding:6px 8px;min-height:52px}.cal.big .d span{font-size:12.5px}.cal.big .d small{display:block;font-size:9.5px;opacity:.7}
.cal.cmp .d{height:38px}
/* pola */
.bars{display:flex;align-items:flex-end;gap:8px;height:92px;padding:0 4px}.bars>div{flex:1;text-align:center;font-size:9.5px;color:#4A5663}.bars .b{background:linear-gradient(#2E7DD6,#0B5CAD);border-radius:4px 4px 0 0;margin:2px auto 3px;width:70%}.bars .b.lo{background:#E8727A}.bars .b.off{background:repeating-linear-gradient(135deg,#E9EDF2 0 4px,#D5DCE4 4px 5px)}.bars strong{display:block;font-size:10px;color:#15232E}
.bars.big{height:190px}
.pct{font-size:9px;font-weight:800;color:#0F6B4A}.pct.n{color:#B0332E}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th{background:#E6EBF1;font-size:10px;padding:5px 8px;text-align:center;border-top:3px solid #15303F;border-bottom:2px solid #15303F;white-space:nowrap}th:first-child{text-align:left}
td{height:23px;padding:0 6px;font-size:11px;border-bottom:1px solid #E7EBF0;text-align:center}td:first-child{text-align:left;font-weight:700;color:#10394E}
.ix{display:inline-block;min-width:28px;border-radius:6px;padding:1px 5px;font-weight:800;font-size:10.5px}.ix.a{background:#CFE0F7;color:#0F2D55}.ix.b{background:#FFE0DE;color:#B0332E}.ix.c{background:#E3F6EC;color:#0F6B4A}.ix.z{background:#EEF1F5;color:#6B7785}
.ins{margin-top:8px;background:#E8F0FB;border-left:4px solid #1E5FB8;border-radius:6px;padding:7px 10px;font-size:11px;color:#15303F}
.fn{font-size:10px;color:#6B7785;margin-top:6px}
.nowtall .panel{margin-bottom:10px}
</style></head><body>
<div class="top"><b>Transaksi · Kalender Sell Thru + Pola Hari (desktop)</b><div class="seg" id="m"><button data-v="now">SEKARANG</button><button data-v="new" class="on">USULAN</button></div></div>
<div class="note" id="note"></div><div class="wrap" id="out"></div>
<script>
const U={1:1721,2:827,3:691,4:1067,5:646,7:3266,8:1570,9:712,10:949,11:1204,12:653,13:15,14:1397,15:954,16:1705,17:1810,18:2066,19:819,20:36,21:1597,22:1575,23:1209,24:941,25:892,26:698,28:1052},DL={1:192,2:96,3:89,4:97,5:85,7:187,8:110,9:77,10:102,11:130,12:103,13:4,14:122,15:116,16:148,17:159,18:134,19:90,20:2,21:144,22:133,23:109,24:89,25:89,26:76,28:142};
const T=2137,f=n=>n.toLocaleString('id-ID');
function cell(d,big){if([6,27].includes(d))return `<div class="d off"><b>${d}</b><span>Libur</span></div>`;if(d===13||d===20)return `<div class="d off"><b>${d}</b><span>${f(U[d])} unit</span>${big?`<small>${DL[d]} dealer</small>`:''}</div>`;if(d>28)return `<div class="d fu"><b>${d}</b><span>butuh</span>${big?'<small>12.744 unit</small>':''}</div>`;const u=U[d],r=u/T,c=r>=1?'g':r>=.6?'y':'r';return `<div class="d ${c} ${d===28?'td':''}" title="${d} Sep · ${f(u)} unit · ${DL[d]} dealer"><b>${d}</b><span>${f(u)} unit</span>${big?`<small>${DL[d]} dealer</small>`:''}<i style="width:${Math.min(100,r*100)}%"></i></div>`}
function calendar(big){let h=['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map((x,i)=>`<div class="h ${i==6?'m':''}">${x}</div>`).join('');h+='<div></div>'.repeat(0);const cells=[];for(let d=1;d<=30;d++)cells.push(cell(d,big));/* 1 Sep 2026 = Selasa */cells.unshift('<div></div>');return `<div class="cal ${big?'big':'cmp'}">${h}${cells.join('')}</div>`}
const legend=`<div class="lg"><span><i style="background:#9ED8B8"></i>≥ target harian (2.137)</span><span><i style="background:#F2D77A"></i>60–99%</span><span><i style="background:#EE9A9A"></i>&lt; 60%</span><span><i style="background:#E9EDF2"></i>Minggu/libur</span></div>`;
const H=['Sen','Sel','Rab','Kam','Jum','Sab','Min'],V=[1828,1455,1113,1098,1307,704,13],P=['+46%','+16%','-11%','-12%','+5%','-44%','Libur'];
function bars(big){return `<div class="bars ${big?'big':''}">${V.map((v,i)=>`<div><strong>${f(v)}</strong><div class="b ${i==5?'lo':i==6?'off':''}" style="height:${Math.max(6,v/1828*(big?150:62))}px"></div>${H[i]}<br><span class="pct ${P[i].startsWith('-')?'n':''}">${P[i]}</span></div>`).join('')}</div>`}
const R=[['ITEL',[114,118,97,85,124,62,11]],['MOTOPAD',[132,119,66,132,109,42,0]],['MOTOROLA',[139,79,105,60,83,135,0]],['VILLAON',[200,114,84,79,74,49,2]]];
function ptab(){return `<table><thead><tr><th>BRAND</th>${H.map(x=>`<th>${x.toUpperCase()}</th>`).join('')}</tr></thead><tbody>${R.map(r=>`<tr><td>${r[0]}</td>${r[1].map((v,i)=>`<td><span class="ix ${i==6?'z':v>=100?'a':v>=80?'c':'b'}">${v}</span></td>`).join('')}</tr>`).join('')}</tbody></table>`}
const ins='<b>Senin</b> jadi hari order terbesar (+46,1% dari rata-rata hari kerja), <b>Sabtu</b> paling rendah (-43,7%). Minggu libur, tidak dianalisa. Indeks 100 = rata-rata hari kerja brand itu sendiri.';
const fn='Ada 51 unit transaksi di hari Minggu / libur (2 hari), tidak ikut dianalisa.';
function nowV(){return `<div class="nowtall"><div class="panel"><div class="ph"><b>KALENDER SELL THRU HARIAN</b><span class="ib">i</span><small>Unit per hari · bulan pilihan</small></div><div class="pb">${legend}<div style="height:8px"></div>${calendar(true)}</div></div><div class="panel"><div class="ph"><b>POLA HARI PENJUALAN</b><span class="ib">i</span><small>Rata-rata unit per hari · pembanding Senin–Sabtu</small></div><div class="pb" style="display:grid;grid-template-columns:1fr 1.4fr;gap:20px;align-items:end">${bars(true)}<div>${ptab()}<div class="ins" style="background:#0B4D96;color:#fff;border:0;border-radius:8px;margin-top:10px;padding:10px">${ins}</div></div></div></div></div>`}
function newV(){return `<div class="grid"><div class="panel"><div class="ph"><b>KALENDER SELL THRU HARIAN</b><span class="ib" title="Unit per hari · bulan pilihan. Hijau = capai target harian; kuning 60–99%; merah &lt;60%; garis bawah = % terhadap target. Arahkan kursor ke tanggal untuk jumlah dealer.">i</span><small>Unit per hari</small>${legend}</div><div class="pb">${calendar(true)}</div></div><div class="col"><div class="panel"><div class="ph"><b>POLA HARI PENJUALAN</b><span class="ib" title="Rata-rata unit per hari, dibanding rata-rata hari kerja">i</span><small>Rata-rata unit per hari</small></div><div class="pb">${bars(false)}<div class="fn">${fn}</div></div></div><div class="panel"><div class="ph"><b>INDEKS HARI PER BRAND</b><span class="ib" title="Indeks 100 = rata-rata hari kerja brand itu sendiri">i</span></div><div class="pb">${ptab()}<div class="ins">${ins}</div></div></div></div></div>`}
function render(){const n=document.getElementById('m').querySelector('.on').dataset.v==='new';document.getElementById('note').innerHTML=n?'<b>USULAN</b>: kalender dan pola hari jadi <b>2 kolom</b> (sesuai sketsa): kiri Kalender <b>memanjang ke bawah mengikuti tinggi kolom kanan</b> (proporsional, baris tanggal membagi rata tinggi; isi sel tetap seperti sekarang: unit + jumlah dealer + garis % target), kanan atas Pola Hari Penjualan (grafik batang pendek ±92px, catatan Minggu di bawahnya), kanan bawah tabel indeks hari per brand + ringkasan. Legenda masuk ke judul kalender, keterangan panjang jadi ⓘ. Total tinggi ±420px (sekarang ±720px). Isi/angka tidak berubah. Desktop saja.':'<b>SEKARANG</b>: kalender sel ±58px dengan 3 baris teks, lalu Pola Hari di panel terpisah di bawahnya dengan grafik tinggi 190px; total ±720px sehalaman.';document.getElementById('out').innerHTML=n?newV():nowV()}
document.getElementById('m').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#m button').forEach(x=>x.classList.toggle('on',x===b));render()};render();
</script></body></html>
