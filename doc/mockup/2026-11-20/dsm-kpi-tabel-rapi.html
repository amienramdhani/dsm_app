<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>DSM · KPI: tabel Perbandingan KPI ASM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#F3F6FA;color:#15232E;font-size:12px}
.top{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #DDE3EA;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:#CBD5E0;border-radius:999px;padding:3px}.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font:700 11px Inter,sans-serif;cursor:pointer;color:#33414D}.seg button.on{background:#fff;color:#10394E;box-shadow:0 1px 3px #0002}
.note{margin:10px auto;max-width:1500px;background:#fff;border-left:4px solid #F0A400;padding:9px 12px;border-radius:8px;line-height:1.55}
.wrap{max-width:1500px;margin:0 auto;padding:0 14px 30px}
.panel{background:#fff;border-radius:12px;box-shadow:0 1px 4px #0001;padding:10px 12px;overflow:auto}
.ph{font-weight:800;color:#10394E;font-size:13px;margin:0 0 8px}.ph small{font-weight:500;color:#6B7785;margin-left:8px;font-size:11px}
table{border-collapse:separate;border-spacing:0;width:100%}
.n{text-align:right}.c{text-align:center}
.ach{display:inline-block;min-width:46px;text-align:center;border-radius:999px;padding:1px 7px;font-weight:800;font-size:10.5px}
.r{background:#FCE4E4;color:#B02A2A}.y{background:#FFF1C9;color:#8A6200}.g{background:#DDF3E7;color:#14663F}
.pn{font-weight:800;color:#1E5FB8}.dim{color:#7A8794}
/* SEKARANG */
.now th{background:#0E5A63;color:#fff;font-size:10.5px;font-weight:800;padding:6px 10px;text-align:right;white-space:nowrap}.now th.l{text-align:left}
.now td{padding:0 10px;height:46px;font-size:12px;border-bottom:1px solid #E9EEF3;white-space:nowrap;text-align:right}.now td.l{text-align:left}.now td small{display:block;color:#7A8794;font-size:11px}
.now td.gb{background:#F1F8F4}.now td.gs{background:#F3F6FB}.now tr.tot td{background:#E9F1FB;font-weight:800}
.now .bob{background:#ffffff33;border-radius:8px;padding:1px 7px;font-size:9px;margin-left:6px}
/* USULAN */
.new{border:1px solid #D5DCE4}
.new th{font-size:10.5px;font-weight:800;padding:4px 9px;white-space:nowrap;letter-spacing:.3px}
.new td{padding:3px 9px;height:24px;font-size:11px;border-bottom:1px solid #E7EBF0;border-right:1px solid #EEF1F4;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.new td.l{text-align:left}.new td.k{color:#6B7785;font-size:10px;text-align:left}
.new tbody tr:hover td{background:#F5F8FB}
.sq{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--b)}
.bob2{display:inline-block;background:#fff;color:var(--d);border:1px solid var(--d);border-radius:8px;padding:0 6px;font-size:9px;margin-left:6px}
/* A: header berwarna indikator */
.A thead th.gh{background:var(--l);color:var(--d);border-top:3px solid var(--d);border-bottom:0;text-align:center}
.A thead th.sh{background:var(--l);color:var(--d);border-bottom:2px solid var(--d);text-align:right;font-size:9.5px}
.A thead th.id{background:#E6EBF1;color:#15232E;border-bottom:2px solid #15303F;text-align:left;vertical-align:bottom}
.A thead th.sk{background:#10394E;color:#fff;border-bottom:2px solid #0A2230;text-align:center;vertical-align:bottom}
.A td.gc{background:var(--t)}
.A tr.tot td{background:#E6EBF1;font-weight:800;border-top:2px solid #15303F}.A tr.tot td.gc{background:var(--l);color:var(--d);border-top:3px solid var(--d)}
/* B: header abu muda, warna di garis & kotak brand */
.B thead th.gh{background:#E6EBF1;color:#15232E;border-top:3px solid var(--d);border-bottom:0;text-align:center}
.B thead th.sh{background:#E6EBF1;color:#4A5663;border-bottom:2px solid #15303F;text-align:right;font-size:9.5px}
.B thead th.id,.B thead th.sk{background:#E6EBF1;color:#15232E;border-bottom:2px solid #15303F;text-align:left;vertical-align:bottom}.B thead th.sk{text-align:center}
.B td.gc{background:#fff}.B tr.tot td{background:#E6EBF1;font-weight:800;border-top:2px solid #15303F}
.B tbody td.gc:first-of-type{}
.B td.edge{box-shadow:inset 3px 0 0 var(--d)}
.sc{display:inline-block;min-width:48px;text-align:center;border-radius:5px;padding:1px 8px;font-weight:800;font-size:10.5px}
.A th.edge,.A td.edge{border-left:3px solid var(--d)!important}.A th.sk{border-left:3px solid #10394E}.A tr.tot td.edge{border-left:3px solid var(--d)!important}
.new{table-layout:auto}
.new thead tr:first-child th:nth-child(1),.new tbody td:nth-child(1){position:sticky;left:0;z-index:4;min-width:190px;max-width:190px;overflow:hidden;text-overflow:ellipsis;background:#fff}
.new thead tr:first-child th:nth-child(2),.new tbody td:nth-child(2){position:sticky;left:190px;z-index:4;min-width:130px;max-width:130px;overflow:hidden;text-overflow:ellipsis;background:#fff;box-shadow:3px 0 4px -1px #0003}
.new thead tr:first-child th:nth-child(1),.new thead tr:first-child th:nth-child(2){background:#E6EBF1;z-index:5}
.new tbody tr.tot td:nth-child(1),.new tbody tr.tot td:nth-child(2){background:#E6EBF1}
.new tbody tr:hover td:nth-child(-n+2){background:#F5F8FB}
.wrap.narrow .panel{max-width:900px}
.new td.ctr{text-align:center}
.new thead th.gh1{border-bottom:2px solid var(--d)!important}
</style></head><body>
<div class="top"><b>KPI · Perbandingan KPI ASM (KPI ALL BRAND)</b><div class="seg" id="w"><button data-w="full" class="on">LAYAR LEBAR</button><button data-w="narrow">LAYAR SEMPIT (tes geser)</button></div><div class="seg" id="m"><button data-v="now">SEKARANG</button><button data-v="A" class="on">USULAN A</button><button data-v="B">USULAN B</button></div></div>
<div class="note" id="note"></div><div class="wrap"><div class="panel"><div class="ph">KPI ALL BRAND <small>19 orang · nama dan area tetap terlihat saat tabel digeser</small></div><div id="t"></div></div><div class="panel" id="p2" style="margin-top:14px"><div class="ph">RINGKASAN SKOR KPI <small>nama dan area tetap terlihat saat tabel digeser</small></div><div id="t2"></div></div></div>
<script>
const G=[{k:'ST ITEL',w:'40%',ind:'ST',b:'#0E6E64',d:'#1E5FB8',l:'#E3EEFB',t:'#F3F8FE'},{k:'DA ITEL',w:'20%',ind:'DA',b:'#0E6E64',d:'#0E7C6B',l:'#E2F4F1',t:'#F4FAF8'},{k:'ST VILLAON',w:'30%',ind:'ST',b:'#455A64',d:'#1E5FB8',l:'#E3EEFB',t:'#F3F8FE'},{k:'DA VILLAON',w:'10%',ind:'DA',b:'#455A64',d:'#0E7C6B',l:'#E2F4F1',t:'#F4FAF8'}];
const R=[['ARIFIN SORMANDANI','BOGOR-DEPOK',[[4066,753,18.5,7.4],[76,50,65.8,13.2],[160,127,79.4,23.8],[10,14,140,10]],54.4],['NIKO STANISLAUS','BEKASI',[[1600,463,28.9,11.6],[60,41,68.3,13.7],[160,155,96.9,29.1],[10,12,120,10]],64.3],['RIDHO ALFIAN','JAKARTA',[[10400,1982,19.1,7.6],[94,46,48.9,9.8],[315,259,82.2,24.7],[15,15,100,10]],52.1],['ACHMAD ROBBY','BIG BANDUNG',[0,0,0,0],null],['SUSILA SODIKIN','BIG CIREBON',[0,0,0,0],null],['DANIEL KURNIAWAN SUAWA','JAWA TIMUR 3',[[789,448,56.8,28.4],[60,33,55,16.5],[130,129,99.2,19.8],0],64.7],['RIDHO SETIAWAN','JAWA TIMUR 1',[[1364,714,52.3,26.2],[50,27,54,16.2],[140,199,142.1,24],0],66.4],['SURYO DANU KUSUMA','JAWA TIMUR 2',[[1791,1032,57.6,28.8],[105,58,55.2,16.6],[253,289,114.2,22.8],0],68.2],['EKO PRASETYO','BIG SEMARANG',[0,0,0,0],null],['LUQMAN IQBAL AL MUBARAK','BIG JOGJA',[0,0,0,0],null],['SEPTO ANDI PURNOMO','BIG PURWOKERTO',[0,0,0,0],null],['MUH RIDHA ADHARI','SULAWESI SELATAN',[0,0,0,0],null]];
const TOT=[[20010,5392,26.9,10.8],[445,255,57.3,11.5],[1158,1158,100,30],[35,41,117.1,10]];
let M='A';const $=s=>document.querySelector(s);const f=n=>n.toLocaleString('id-ID');const p=n=>n.toFixed(1).replace('.',',')+'%';
const ac=v=>v>=100?'g':v>=80?'y':'r';const sc=ac;
const NOTE={now:'<b>SEKARANG</b>: header teal tua polos, nama + area ditumpuk (baris ±46px), kolom indikator hanya dibedakan tint tipis.',A:'<b>USULAN A · Header berwarna indikator</b>: <b>TARGET dan AKTUAL dipisah jadi 2 kolom</b> (target abu, aktual tebal); <b>garis penegas 3px berwarna indikator di kiri tiap grup</b>, dari header sampai TOTAL; judul grup berwarna <b>indikator</b> (ST biru, DA tosca) dengan garis atas 3px, kotak kecil berwarna <b>brand</b> (ITEL, VILLAON) dan bobot sebagai lencana; sub-judul (TARGET / AKTUAL · % ACHV · POIN) satu warna dengan grupnya, <b>TOTAL TIM mengikuti warna header tiap kolom</b>. SKOR KPI header petrol. ASM dan AREA dipisah jadi 2 kolom → 1 baris per orang (±24px). <b>Kolom ASM + AREA dibekukan (freeze)</b> di kiri saat tabel digeser; klik "LAYAR SEMPIT" di atas untuk mencobanya.',B:'<b>USULAN B · Header abu muda</b> (gaya DOS/Analisa), <b>TARGET dan AKTUAL dipisah kolom</b>: header abu muda, warna hanya di garis atas grup (indikator) + kotak brand, garis tebal 3px di kiri tiap grup. Isi tabel putih, TOTAL abu. Lebih tenang, kurang berwarna dari A.'};
function now(){return `<table class="now"><thead><tr><th class="l" rowspan="2">ASM · AREA</th>${G.map(g=>`<th colspan="3" style="text-align:center">${g.k}<span class="bob">bobot ${g.w}</span></th>`).join('')}<th rowspan="2" style="text-align:center">SKOR KPI</th></tr><tr>${G.map(()=>'<th>TARGET / AKTUAL</th><th>% ACHV</th><th>POIN</th>').join('')}</tr></thead><tbody>${R.map(r=>`<tr><td class="l"><b>${r[0]}</b><small>${r[1]}</small></td>${r[2].map((c,i)=>c?`<td class="${i%2?'gb':'gs'}"><span class="dim">${f(c[0])}</span> / <b>${f(c[1])}</b></td><td class="${i%2?'gb':'gs'}"><span class="ach ${ac(c[2])}">${p(c[2])}</span></td><td class="${i%2?'gb':'gs'}"><span class="pn">${c[3].toFixed(1).replace('.',',')}</span></td>`:`<td class="${i%2?'gb':'gs'}">-</td><td class="${i%2?'gb':'gs'}">-</td><td class="${i%2?'gb':'gs'}">-</td>`).join('')}<td style="text-align:center">${r[3]?`<span class="ach ${sc(r[3])}">${p(r[3])}</span>`:'—'}</td></tr>`).join('')}<tr class="tot"><td class="l"><b>TOTAL TIM</b><small>19 orang</small></td>${TOT.map(c=>`<td><b>${f(c[0])} / ${f(c[1])}</b></td><td><span class="ach ${ac(c[2])}">${p(c[2])}</span></td><td><b>${c[3].toFixed(1).replace('.',',')}</b></td>`).join('')}<td style="text-align:center"><span class="ach r">62,2%</span></td></tr></tbody></table>`}
function nw(){const sty=g=>`style="--b:${g.b};--d:${g.d};--l:${g.l};--t:${g.t}"`;
 const head=`<thead><tr><th class="id" rowspan="2">ASM</th><th class="id" rowspan="2">AREA</th>${G.map(g=>`<th class="gh edge" colspan="4" ${sty(g)}><span class="sq" style="--b:${g.b}"></span>${g.k}<span class="bob2" ${sty(g)}>${g.w}</span></th>`).join('')}<th class="sk" rowspan="2">SKOR KPI</th></tr><tr>${G.map(g=>`<th class="sh edge" ${sty(g)}>TARGET</th><th class="sh" ${sty(g)}>AKTUAL</th><th class="sh" ${sty(g)}>% ACHV</th><th class="sh" ${sty(g)}>POIN</th>`).join('')}</tr></thead>`;
 const cells=(c,g,tot)=>{const s=sty(g);if(!c)return `<td class="gc edge" ${s}>-</td><td class="gc" ${s}>-</td><td class="gc" ${s}>-</td><td class="gc" ${s}>-</td>`;return `<td class="gc edge" ${s}><span class="dim">${f(c[0])}</span></td><td class="gc" ${s}><b>${f(c[1])}</b></td><td class="gc" ${s}><span class="ach ${ac(c[2])}">${p(c[2])}</span></td><td class="gc" ${s}><span class="pn">${c[3].toFixed(1).replace('.',',')}</span></td>`};
 const body=R.map(r=>`<tr><td class="l"><b>${r[0]}</b></td><td class="k">${r[1]}</td>${r[2].map((c,i)=>cells(c,G[i])).join('')}<td style="text-align:center">${r[3]?`<span class="sc ${sc(r[3])} ach">${p(r[3])}</span>`:'—'}</td></tr>`).join('');
 const tot=`<tr class="tot"><td class="l"><b>TOTAL TIM</b></td><td class="k">19 orang</td>${TOT.map((c,i)=>{const g=G[i],s=sty(g);return `<td class="gc edge" ${s}><b>${f(c[0])}</b></td><td class="gc" ${s}><b>${f(c[1])}</b></td><td class="gc" ${s}><span class="ach ${ac(c[2])}">${p(c[2])}</span></td><td class="gc" ${s}><b>${c[3].toFixed(1).replace('.',',')}</b></td>`}).join('')}<td style="text-align:center"><span class="ach r">62,2%</span></td></tr>`;
 return `<table class="new ${M}">${head}<tbody>${body}${tot}</tbody></table>`}

const SR=[['RIDHO SETIAWAN','JAWA TIMUR 1',66.4,65.2,65.8],['RIDHO ALFIAN','JAKARTA',52.1,67.7,59.9],['DANIEL KURNIAWAN SUAWA','JAWA TIMUR 3',64.7,54.9,59.8],['SURYO DANU KUSUMA','JAWA TIMUR 2',68.2,30.0,49.1],['NIKO STANISLAUS','BEKASI',64.3,32.0,48.2],['ARIFIN SORMANDANI','BOGOR-DEPOK',54.4,30.3,42.4],['ACHMAD ROBBY','BIG BANDUNG',null,null,null],['SUSILA SODIKIN','BIG CIREBON',null,null,null],['EKO PRASETYO','BIG SEMARANG',null,null,null],['LUQMAN IQBAL AL MUBARAK','BIG JOGJA',null,null,null],['SEPTO ANDI PURNOMO','BIG PURWOKERTO',null,null,null],['MUH RIDHA ADHARI','SULAWESI SELATAN',null,null,null],['RIVENJER BILLY KAPAHANG','SULAWESI UTARA',null,null,null]];
const SG=[{n:'KPI ALL BRAND',d:'#1E5FB8',l:'#E3EEFB',t:'#F3F8FE',i:2,tot:'61,7%'},{n:'KPI MOTOPAD',d:'#B33D0B',l:'#FCEEE4',t:'#FEF7F1',i:3,tot:'46,7%'}];
function sum(){const st=g=>`style="--d:${g.d};--l:${g.l};--t:${g.t}"`;const v=x=>x==null?'—':`<span class="ach ${ac(x)}">${p(x)}</span>`;
 const head=`<thead><tr><th class="id">ASM</th><th class="id">AREA</th>${SG.map(g=>`<th class="gh gh1 edge" ${st(g)}>${g.n}</th>`).join('')}<th class="sk edge2">SKOR AKHIR</th></tr></thead>`;
 const body=SR.map(r=>`<tr><td class="l"><b>${r[0]}</b></td><td class="k">${r[1]}</td>${SG.map(g=>`<td class="gc edge ctr" ${st(g)}>${r[g.i]==null?'—':'<b>'+p(r[g.i])+'</b>'}</td>`).join('')}<td style="text-align:center;border-left:3px solid #10394E">${v(r[4])}</td></tr>`).join('');
 const tot=`<tr class="tot"><td class="l"><b>RATA-RATA TIM</b></td><td class="k"></td>${SG.map(g=>`<td class="gc edge ctr" ${st(g)}><b>${g.tot}</b></td>`).join('')}<td style="text-align:center;border-left:3px solid #10394E"><span class="ach r">54,2%</span></td></tr>`;
 return `<table class="new ${M}">${head}<tbody>${body}${tot}</tbody></table>`}
function render(){$('#note').innerHTML=NOTE[M]+'<br><span style="color:#6B7785">Cakupan: hanya tabel KPI ALL BRAND (Perbandingan KPI ASM) di halaman KPI, desktop. Isi angka, urutan kolom, dan rumus tidak berubah. Data dari screenshot. <b>Tabel kedua di bawah = RINGKASAN SKOR KPI</b> (KPI ALL BRAND · KPI MOTOPAD · SKOR AKHIR) dengan gaya yang sama: ASM + AREA dipisah &amp; dibekukan, 1 baris, header per kolom berwarna (ALL BRAND biru, MOTOPAD warna brand Motopad), garis penegas, RATA-RATA TIM mengikuti warna kolom. Tabel detail per grup + versi Sales belum dibuat.</span>';$('#t').innerHTML=M==='now'?now():nw();$('#p2').style.display=M==='now'?'none':'block';$('#t2').innerHTML=M==='now'?'':sum();document.querySelectorAll('#m button').forEach(b=>b.classList.toggle('on',b.dataset.v===M))}
document.addEventListener('click',e=>{const w=e.target.closest('#w [data-w]');if(w){document.querySelector('.wrap').classList.toggle('narrow',w.dataset.w==='narrow');document.querySelectorAll('#w button').forEach(b=>b.classList.toggle('on',b===w));return}const b=e.target.closest('#m [data-v]');if(b){M=b.dataset.v;render()}});render();
</script></body></html>
