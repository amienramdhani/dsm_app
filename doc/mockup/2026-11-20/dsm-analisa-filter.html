<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>DSM · Filter Analisa + cari nama/kode</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#F3F6FA;color:#15232E;font-size:12px}
.top{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #DDE3EA;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:#CBD5E0;border-radius:999px;padding:3px}.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font:700 11px Inter,sans-serif;cursor:pointer;color:#33414D}
.seg button.on{background:#fff;color:#10394E;box-shadow:0 1px 3px #0002}
.note{margin:10px auto;max-width:1500px;background:#fff;border-left:4px solid #F0A400;padding:9px 12px;border-radius:8px;line-height:1.55}
.wrap{max-width:1500px;margin:0 auto;padding:0 14px 40px}
h2{margin:6px 0 10px;color:#10394E;font-size:20px}
.seg2{margin-bottom:10px}
select,input{font-family:inherit}
/* SEKARANG */
.fb{display:flex;gap:10px;flex-wrap:wrap;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;box-shadow:0 1px 4px #0001;align-items:flex-end}
.fb label{display:flex;flex-direction:column;font-size:10.5px;font-weight:700;color:#4A5663;gap:3px}.fb .s input{width:180px;height:34px}.fb.f0 select{min-width:0;width:128px}.fb select{height:34px;border:1px solid #CBD5E0;border-radius:8px;padding:0 8px;min-width:140px;background:#fff}
/* USULAN */
.ff{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:6px 10px;box-shadow:0 1px 3px #0001;position:relative;flex-wrap:wrap}
.ff .s{position:relative}.ff .s input{height:32px;width:250px;border:1px solid #CBD5E0;border-radius:8px;padding:0 26px 0 28px;font-size:12px}
.ff .s:before{content:"⌕";position:absolute;left:9px;top:5px;color:#6B7785;font-size:15px}
.ff .s .x{position:absolute;right:6px;top:7px;border:0;background:#E6EBF1;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;display:none}
.ff select{height:32px;border:1px solid #CBD5E0;border-radius:8px;padding:0 6px;font-size:12px;background:#fff}
.btn{height:32px;border:1px solid #CBD5E0;border-radius:8px;background:#fff;font-weight:800;font-size:10.5px;padding:0 12px;color:#4A5663;cursor:pointer;white-space:nowrap}
.btn.o{background:linear-gradient(180deg,#FFB020,#F07A0C);color:#fff;border-color:#F07A0C}.btn b{background:#fff;color:#C25A12;border-radius:9px;padding:0 6px;margin-left:5px}
.cnt{font-weight:700;color:#10394E;margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}.chips:empty{display:none}
.ch{background:#E6EBF1;border-radius:999px;padding:3px 6px 3px 10px;font-size:11px;font-weight:700;color:#10394E}.ch button{border:0;background:none;cursor:pointer;color:#6B7785;font-size:12px}
.pop{position:absolute;top:46px;left:10px;z-index:5;background:#fff;border-radius:12px;box-shadow:0 8px 28px #0003;padding:12px;width:420px;display:none}.pop.on{display:block}
.pop label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:800;color:#4A5663;margin-bottom:8px}.pop select{height:32px;width:100%}
.pop .ft{display:flex;gap:8px;justify-content:flex-end}
.bc{display:flex;align-items:center;gap:4px;font-size:11px;color:#6B7785;margin-top:8px;flex-wrap:wrap}.bc b{color:#10394E;background:#EAF3F4;border-radius:6px;padding:2px 8px;cursor:pointer}.bc i{font-style:normal}
.sc{margin-top:12px;background:#fff;border-radius:12px;box-shadow:0 1px 4px #0001;padding:10px 12px;overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;border:1px solid #D5DCE4}
th{background:#E6EBF1;font-size:10.5px;font-weight:800;padding:5px 9px;text-align:left;border-bottom:2px solid #15303F;border-right:1px solid #D5DCE4;letter-spacing:.3px}
td{padding:3px 9px;font-size:11px;height:24px;border-bottom:1px solid #E7EBF0;border-right:1px solid #EEF1F4;white-space:nowrap}
td.k{color:#6B7785;font-size:10px}.lnk{color:#1E5FB8;font-weight:700}mark{background:#FFE58F;border-radius:2px;padding:0 1px}.n{text-align:right}
.empty{padding:16px;text-align:center;color:#6B7785}
.f4{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:7px 10px;box-shadow:0 1px 3px #0001;flex-wrap:wrap}
.f4 .s input{width:230px}.f4 .sel{display:flex;align-items:center;gap:6px;height:32px;border:1px solid #CBD5E0;border-radius:8px;padding:0 4px 0 9px;background:#fff}
.f4 .sel span{font-size:9.5px;font-weight:800;letter-spacing:.3px;color:#6B7785;text-transform:uppercase;white-space:nowrap}
.f4 .sel select{border:0;height:28px;font-size:12px;background:transparent;width:96px;color:#15232E;outline:0}
.f4 .sep{width:1px;height:22px;background:#E1E6EC}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.kc{background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 1px 3px #0001;display:flex;gap:10px;align-items:center}
.kc .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px}.kc small{display:block;font-size:10px;font-weight:800;letter-spacing:.3px;color:#6B7785;text-transform:uppercase}.kc b{font-size:20px;color:#10394E}.kc i{display:block;font-style:normal;font-size:10.5px;color:#6B7785}.kc.hl{outline:2px solid #F0A400}
.f4 .s{position:relative}.f4 .s input{height:32px;border:1px solid #CBD5E0;border-radius:8px;padding:0 26px 0 28px;font-size:12px;width:230px}.f4 .s:before{content:"⌕";position:absolute;left:9px;top:5px;color:#6B7785;font-size:15px}.f4 .s .x{position:absolute;right:6px;top:7px;border:0;background:#E6EBF1;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;display:none}
.ipop{position:absolute;right:0;top:36px;z-index:6;width:460px;background:#fff;border-radius:12px;box-shadow:0 8px 28px #0003;padding:12px 14px;display:none;line-height:1.55}.ipop.on{display:block}.ipop h5{margin:0 0 6px;font-size:12px;color:#10394E}.ipop table{border:0}.ipop td{height:auto;white-space:normal;border:0;border-bottom:1px solid #EEF1F4;padding:5px 6px;font-size:11px;vertical-align:top}.ipop td:first-child{font-weight:800;color:#14664A;width:92px}
.kp .kc{background:#E8F7EF;box-shadow:none;border:1px solid #CFEBDC;display:block;padding:9px 14px}.kp .kc small{color:#3F6F58}.kp .kc b{color:#0F4F3B}.kp .kc i{color:#4E7A66}
</style></head><body>
<div class="top"><b>Analisa · filter + cari nama/kode</b><div class="seg" id="m"><button data-v="now">SEKARANG</button><button data-v="F0">F0 · SAMA + CARI</button><button data-v="F1" class="on">OPSI F1</button><button data-v="F2">OPSI F2</button><button data-v="F3">OPSI F3</button></div><span style="color:#6B7785">Nama kartu 2:</span><div class="seg" id="k2"><button data-k2="0" class="on">Brand belum diambil</button><button data-k2="1">Peluang cross-sell</button><button data-k2="2">Peluang tawar brand</button></div><span style="color:#6B7785">Coba ketik "agres", "RISM", atau "0320" di kolom cari.</span></div>
<div class="note" id="note"></div>
<div class="wrap"><h2>Analisa</h2><div style="display:flex;align-items:center;gap:10px;position:relative"><div class="seg seg2" style="margin-bottom:10px"><button style="border:0;border-radius:999px;padding:6px 12px;font:700 11px Inter;background:#fff">⊞ Cross-sell Brand</button><button style="border:0;background:none;padding:6px 12px;font:700 11px Inter">↻ Reaktivasi Dealer</button><button style="border:0;background:none;padding:6px 12px;font:700 11px Inter">★ Dealer Baru</button></div><span style="flex:1"></span><button id="ib" style="margin-bottom:10px;border:1px solid #BFE3D0;background:#E8F7EF;color:#14664A;border-radius:999px;padding:5px 12px;font:800 10.5px Inter;cursor:pointer">ⓘ BEDANYA DENGAN MENU DEALER?</button><div id="ip" class="ipop"></div></div>
<div id="fbar"></div><div class="sc" id="tb"></div></div>
<script>
const D=[['317.811','PT.AGRES INFO TEKNOLOGI','JAKARTA','RIDHO ALFIAN','Jabodetabek','Region 1'],['005.094','CV MANDIRI JAYA MAKMUR','JAKARTA','RIDHO ALFIAN','Jabodetabek','Region 1'],['RISM2','RISM JAYA BARU','PURWAKARTA','RIDWAN NOOR MARLIAWAN','Jawa Barat','Region 2'],['032.003','PT. SINAR ARTHA MAHAMAKMUR','JAKARTA PUSAT','RIDHO ALFIAN','Jabodetabek','Region 1'],['RISM4','RISM SINARMAS','SEMARANG','EKO PRASETYO','Jawa Tengah','Region 3'],['320.218','PT. CIPTA ARYA EKA SARANA','TANGERANG','ARIFIN SORMANDANI','Jabodetabek','Region 1'],['RISM1','RISM COMPLETE','JAKARTA','PURNAMA RUDIARTO','Jabodetabek','Region 1'],['319.047','PT. MANUNGGAL UTAMA MANDIRI','JAKARTA','RIDHO ALFIAN','Jabodetabek','Region 1'],['RISM3','RISM PERTEMUAN','PURWAKARTA','HASAN NURDIN','Jawa Barat','Region 2'],['008.110','PT. THRONE SUKSES MAKMUR','BOGOR','IMAM FAISAL','Jawa Barat','Region 2']];
const S={m:'F1',k2:0,info:false,q:'',big:'',reg:'',sales:'',pop:false};const $=s=>document.querySelector(s);
const NOTES={F1:'<b>F1 (DIPILIH)</b>: 1 baris, kolom cari + 5 dropdown + RESET + jumlah dealer, tinggi 32px.<br><b>Kartu</b>: tanpa ikon, semua warna hijau mint muda. Kartu 1 → <b>Dealer bertransaksi</b>. Kartu 2 (ex "Peluang terbuka") belum dinamai: pilih salah satu dari 3 di bar atas. Tombol <b>ⓘ BEDANYA DENGAN MENU DEALER?</b> di kanan tab membuka keterangan singkat.',
F4:'<b>F4 · Filter dirapikan, isi sama</b>: kolom cari + 5 dropdown (Big Region, Region, RGM, ASM, Sales) tetap lengkap tapi <b>tidak melar lagi</b>: label kecil di dalam kotak, lebar tetap, semua dalam <b>1 baris</b> (±48px, sekarang ±75px). Reset dan jumlah dealer di ujung. Tidak ada yang disembunyikan.',
now:'<b>SEKARANG</b>: 5 dropdown dengan label di atas (makan 2 baris), tidak ada pencarian.',
F0:'<b>F0 · Tampilan filter TETAP seperti sekarang</b> (5 dropdown berlabel, tombol Reset), hanya ditambah satu kolom <b>Cari dealer</b> di paling kiri. Tidak ada layout lain yang berubah.',
F2:'<b>F2 · Cari + FILTER LAIN</b> (sama pola Daftar Dealer yang sudah disetujui): kolom cari, Big Region, Region, tombol <b>FILTER LAIN</b> oranye (RGM · ASM · Sales di panel), RESET. Filter aktif tampil sebagai <b>chip</b> yang bisa dilepas satu-satu. Paling ringkas.',
F3:'<b>F3 · Cari + jalur bertingkat</b>: kolom cari + satu dropdown "Wilayah" lalu jalur klik <b>Big Region › Region › RGM › ASM › Sales</b> di bawahnya (pilih tingkat, tingkat bawahnya otomatis ikut). Cocok buat telusur turun dari atas.'};
const hl=(t)=>{if(!S.q)return t;const i=t.toLowerCase().indexOf(S.q.toLowerCase());return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+S.q.length)+'</mark>'+t.slice(i+S.q.length)};
function rows(){return D.filter(d=>(!S.q||(d[0]+' '+d[1]).toLowerCase().includes(S.q.toLowerCase()))&&(!S.big||d[4]===S.big)&&(!S.reg||d[5]===S.reg)&&(!S.sales||d[3]===S.sales))}
const opt=(arr,v,all)=>`<option value="">${all}</option>`+[...new Set(arr)].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('');
function search(){return `<div class="s"><input id="q" placeholder="Cari nama / kode dealer…" value="${S.q}"><button class="x" id="qx" style="${S.q?'display:block':''}">✕</button></div>`}
function bar(){const n=rows().length;
 if(S.m==='now')return `<div class="fb">${['Big Region','Region','RGM','ASM','Sales'].map(l=>`<label>${l}<select><option>Semua ${l}</option></select></label>`).join('')}<button class="btn" style="height:34px">Reset</button></div>`;
 if(S.m==='F4'){const so=(l,k,arr)=>`<label class="sel"><span>${l}</span><select ${k?'data-k="'+k+'"':''}>${opt(arr,S[k]||'','Semua')}</select></label>`;return `<div class="f4">${search()}<span class="sep"></span>${so('Big Region','big',D.map(d=>d[4]))}${so('Region','reg',D.map(d=>d[5]))}${so('RGM','',[])}${so('ASM','',[])}${so('Sales','sales',D.map(d=>d[3]))}<button class="btn" id="rs">RESET</button><span class="cnt">${n} dealer</span></div>`;}
 if(S.m==='F0')return `<div class="fb f0"><label>Cari dealer<span class="ff" style="padding:0;box-shadow:none">${search()}</span></label>${[['Big Region','big',D.map(d=>d[4])],['Region','reg',D.map(d=>d[5])],['RGM','',[]],['ASM','',[]],['Sales','sales',D.map(d=>d[3])]].map(x=>`<label>${x[0]}<select ${x[1]?'data-k="'+x[1]+'"':''}>${opt(x[2],S[x[1]]||'','Semua '+x[0])}</select></label>`).join('')}<button class="btn" id="rs" style="height:34px">Reset</button></div>`;
 const cnt=`<span class="cnt">${n} dealer</span>`;
 if(S.m==='F1')return `<div class="ff">${search()}<select data-k="big">${opt(D.map(d=>d[4]),S.big,'Semua Big Region')}</select><select data-k="reg">${opt(D.map(d=>d[5]),S.reg,'Semua Region')}</select><select><option>Semua RGM</option></select><select><option>Semua ASM</option></select><select data-k="sales">${opt(D.map(d=>d[3]),S.sales,'Semua Sales')}</select><button class="btn" id="rs">RESET</button>${cnt}</div>`;
 const act=[['q',S.q&&'Cari: '+S.q],['big',S.big],['reg',S.reg],['sales',S.sales&&'Sales: '+S.sales]].filter(x=>x[1]);const nx=['sales'].filter(k=>S[k]).length;
 if(S.m==='F2')return `<div class="ff">${search()}<select data-k="big">${opt(D.map(d=>d[4]),S.big,'Semua Big Region')}</select><select data-k="reg">${opt(D.map(d=>d[5]),S.reg,'Semua Region')}</select><button class="btn o" id="fl">FILTER LAIN${nx?'<b>'+nx+'</b>':''}</button><button class="btn" id="rs">RESET</button>${cnt}<div class="pop ${S.pop?'on':''}" id="pop"><label>RGM<select><option>Semua RGM</option></select></label><label>ASM<select><option>Semua ASM</option></select></label><label>Sales<select data-k="sales">${opt(D.map(d=>d[3]),S.sales,'Semua Sales')}</select></label><div class="ft"><button class="btn" id="rs2">RESET</button><button class="btn o" id="ok">TAMPILKAN ${n} DEALER</button></div></div></div><div class="chips">${act.map(a=>`<span class="ch">${a[1]} <button data-x="${a[0]}">✕</button></span>`).join('')}</div>`;
 return `<div class="ff">${search()}<select data-k="big">${opt(D.map(d=>d[4]),S.big,'Semua wilayah')}</select><button class="btn" id="rs">RESET</button>${cnt}</div><div class="bc"><b data-x="all">Nasional</b>${S.big?`<i>›</i><b data-x="reg">${S.big}</b>`:''}${S.reg?`<i>›</i><b data-x="sales">${S.reg}</b>`:''}${S.sales?`<i>›</i><b>${S.sales}</b>`:''}<span style="margin-left:6px">· klik tingkat untuk naik</span></div>`}
function kpi(){const L2=[['Brand belum diambil','pasangan dealer × brand yang berpeluang'],['Peluang cross-sell','pasangan dealer × brand'],['Peluang tawar brand','dealer × brand yang bisa ditawarkan']][S.k2];const first=S.m==='now'?['Dealer aktif','order bulan ini / bulan lalu']:['Dealer bertransaksi','ada order bulan ini atau bulan lalu'];const K=[[first[0],'1.686',first[1]],[S.m==='now'?'Peluang terbuka':L2[0],'4.279',S.m==='now'?'pasangan dealer × brand':L2[1]],['Estimasi potensi','± 2.394 unit','per bulan jika 30% terkonversi'],['Rata-rata brand / dealer','1,5','dari 7 brand']];return `<div class="kp">${K.map(k=>`<div class="kc"><small>${k[0]}</small><b>${k[1]}</b><i>${k[2]}</i></div>`).join('')}</div>`}
function tbl(){const r=rows();$('#tb').innerHTML=r.length?`<table><tr><th>KODE</th><th>DEALER</th><th>KOTA</th><th>SALES</th><th class="n">UNIT/BLN</th></tr>${r.map((d,i)=>`<tr><td class="k">${hl(d[0])}</td><td><span class="lnk">${hl(d[1])}</span></td><td>${d[2]}</td><td>${d[3]}</td><td class="n"><b>${42-i*3}</b></td></tr>`).join('')}</table>`:'<div class="empty">Tidak ada dealer yang cocok. Coba kata lain atau RESET.</div>'}
function render(keep){$('#note').innerHTML=NOTES[S.m]+'<br><span style="color:#6B7785">Mockup desktop. Pencarian: nama atau kode dealer, mencari di dalam hasil filter wilayah. Dipakai di tab Cross-sell &amp; Reaktivasi (Dealer Baru dihitung per sales, jadi cari dealer tidak dipakai di sana kecuali lu mau lain). HP tetap pakai tombol FILTER yang ada. Data contoh.</span>';
 $('#fbar').innerHTML=bar()+kpi();$('#ip').className='ipop'+(S.info?' on':'');$('#ip').innerHTML='<h5>Cross-sell Brand vs menu Dealer</h5><table><tr><td>Menu Dealer</td><td>Daftar <b>semua</b> dealer (master) beserta status, riwayat, stok, dan transaksi.</td></tr><tr><td>Di sini</td><td>Hanya dealer yang <b>ada order bulan ini atau bulan lalu</b>, dipakai untuk mencari <b>brand yang belum mereka ambil</b> beserta estimasi potensinya. Dealer yang lama tidak order ada di tab Reaktivasi.</td></tr><tr><td>Jumlah</td><td>Jadi angkanya lebih kecil dari total di menu Dealer, dan itu wajar.</td></tr></table>';tbl();document.querySelectorAll('#m button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.m));
 const q=$('#q');if(q){q.oninput=()=>{S.q=q.value;const p=q.selectionStart;render(1);const q2=$('#q');q2.focus();q2.setSelectionRange(p,p)}}if($('#qx'))$('#qx').onclick=()=>{S.q='';render()};}
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){S[k]=e.target.value;if(k==='big')S.reg='';render()}});
document.addEventListener('click',e=>{const t=e.target;if(t.id==='ib'){S.info=!S.info;render();return}if(t.dataset&&t.dataset.k2!=null&&t.closest('#k2')){S.k2=+t.dataset.k2;document.querySelectorAll('#k2 button').forEach(b=>b.classList.toggle('on',b===t));render();return}if(S.info&&!t.closest('#ip')){S.info=false}if(t.closest('#m')&&t.dataset.v){S.m=t.dataset.v;S.pop=false;render()}
 if(t.id==='rs'||t.id==='rs2'){S.q=S.big=S.reg=S.sales='';S.pop=false;render()}
 if(t.id==='fl'){S.pop=!S.pop;render()}if(t.id==='ok'){S.pop=false;render()}
 if(t.dataset.x){const k=t.dataset.x;if(k==='all')S.big=S.reg=S.sales='';else if(k==='q')S.q='';else if(k==='big'){S.big='';S.reg=''}else if(k==='reg')S.reg='';else S.sales='';render()}});
render();
</script></body></html>
