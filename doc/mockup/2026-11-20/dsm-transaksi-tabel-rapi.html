<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>DSM · Transaksi: tabel dirapikan (desktop)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#DCE6F8;color:#15232E;font-size:12px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #DDE3EA;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:#CBD5E0;border-radius:999px;padding:3px}.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font:700 11px Inter,sans-serif;cursor:pointer;color:#33414D}.seg button.on{background:#fff;color:#10394E;box-shadow:0 1px 3px #0002}
.note{margin:10px auto;max-width:1500px;background:#fff;border-left:4px solid #F0A400;padding:9px 12px;border-radius:8px;line-height:1.55}
.wrap{max-width:1500px;margin:0 auto;padding:0 14px 30px}
.panel{background:#fff;border-radius:14px;box-shadow:0 1px 4px #0001;margin-bottom:14px;overflow:hidden}
.ph{padding:10px 16px;border-bottom:1px solid #EEF0F5}.ph h3{margin:0;font-size:14px;color:#10394E;letter-spacing:.3px}.ph small{color:#6B7785;font-size:11px}
.pb{padding:12px 14px}.sc{overflow:auto;max-height:560px;border:1px solid #D5DCE4;border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%}.n{text-align:right}.c{text-align:center}
.lnk{color:#1E5FB8;font-weight:700}
/* SEKARANG */
.now th{background:linear-gradient(90deg,#0B5FC4,#3F4FD6);color:#fff;font-size:11px;font-weight:800;padding:0 12px;height:34px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:3}
.now td{padding:0 12px;height:31px;font-size:12px;border-bottom:1px solid #EEF0F5;white-space:nowrap}
.now td.h{text-align:center}.pill{display:inline-block;min-width:42px;text-align:center;border-radius:8px;padding:2px 8px;font-weight:800;font-size:11px;background:#B9D0EE;color:#0F2D55}
.now tr.tot td{background:#EEF2FB;color:#2B3FBF;font-weight:800}
.now .fl{display:flex;gap:10px;align-items:center;margin-bottom:10px}.now .fl .bx{border:1px solid #DDE3EA;border-radius:8px;padding:8px 12px;font-weight:700;font-size:11px}
/* USULAN */
.new th{background:#E6EBF1;color:#15232E;font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:5px 9px;text-align:left;white-space:nowrap;border-bottom:2px solid #15303F;border-right:1px solid #D5DCE4;position:sticky;top:0;z-index:3}
.new th.bh{background:var(--l);color:var(--d);border-top:3px solid var(--d);text-align:center;border-bottom:2px solid var(--d)}
.new td{padding:3px 9px;height:24px;font-size:11px;border-bottom:1px solid #E7EBF0;border-right:1px solid #EEF1F4;white-space:nowrap;font-variant-numeric:tabular-nums}
.new td.k{color:#6B7785;font-size:10px}.new td.hm{text-align:center;font-weight:700;padding:0}
.new tbody tr:hover td{filter:brightness(.97)}
.new tr.off td{color:#B0413E;position:relative}.new tr.off td::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,#0000 0 5px,#D2453F40 5px 6px)}.new tr.off td.k{color:#B0413E}
.new tr.tot td{position:sticky;bottom:0;z-index:2;background:#E6EBF1;font-weight:800;border-top:2px solid #15303F}
.new tr.tot td.bt{background:var(--l);color:var(--d);border-top:3px solid var(--d)}
.bs{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--d);margin-right:5px}
.bc{font-weight:800;color:var(--d)}
.new .ql{background:#F3F8FE;color:#1E5FB8;font-weight:800}.new .om{background:#FFFAEC;color:#7A5200;font-weight:700}
.ff{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ff .f{display:flex;align-items:center;gap:6px;height:32px;border:1px solid #CBD5E0;border-radius:8px;padding:0 10px;background:#fff;font-size:11.5px}.ff .f span{font-size:9.5px;font-weight:800;color:#6B7785;letter-spacing:.3px}
.ff .btn{height:32px;border:1px solid #CBD5E0;border-radius:8px;background:#fff;font-weight:800;font-size:10.5px;padding:0 12px;color:#4A5663;cursor:pointer}
.ff .sg{display:inline-flex;background:#CBD5E0;border-radius:999px;padding:2px}.ff .sg b{padding:6px 12px;border-radius:999px;font-size:10.5px;color:#33414D}.ff .sg b.on{background:#0B5CAD;color:#fff}
.ff .dl{margin-left:auto;border-color:#0B5CAD;color:#0B5CAD}
.lg{font-size:10.5px;color:#4A5663;margin-bottom:6px;display:flex;gap:14px;align-items:center}.lg i{display:inline-block;width:46px;height:9px;border-radius:2px;background:linear-gradient(90deg,#0E6E6422,#0E6E64);vertical-align:-1px;margin-right:4px}
table.new.hd{table-layout:fixed}table.new.hd th:nth-child(1){width:104px}table.new.hd th:nth-child(2){width:74px}table.new.hd th:nth-child(3){width:150px}
table.new.rd{table-layout:fixed}table.new.rd th:nth-child(1){width:104px}table.new.rd th:nth-child(2){width:170px}table.new.rd th:nth-child(3){width:70px}table.new.rd th:nth-child(4){width:230px}table.new.rd th:nth-child(5){width:110px}table.new.rd th:nth-child(7){width:70px}table.new.rd th:nth-child(8){width:140px}
table.new.rd td,table.new.hd td{overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div class="top"><b>Transaksi · tabel (desktop)</b><span style="font-size:11px;color:#6B7785">Gaya Transaksi Harian (tanpa heatmap):</span><div class="seg" id="hs"><button data-h="h1" class="on">H1 · POLOS + TINT KOLOM</button><button data-h="h2">H2 · BAR TIPIS</button><button data-h="h3">H3 · PUNCAK DITANDAI</button><button data-h="h4">H4 · H1 + H3</button></div><div class="seg" id="m"><button data-v="now">SEKARANG</button><button data-v="new" class="on">USULAN</button></div></div>
<div class="note" id="note"></div><div class="wrap" id="out"></div>
<script>
const B=[['ITEL','#0E6E64','#E2F4F1'],['MOTOPAD','#B33D0B','#FCEEE4'],['MOTOROLA','#1E5FB8','#E3EEFB'],['VILLAON','#455A64','#E9EEF1']];
const H=[['1 Sep 2026','Selasa',192,[1205,15,6,495],1721],['2 Sep 2026','Rabu',96,[553,5,8,261],827],['3 Sep 2026','Kamis',89,[377,108,11,195],691],['4 Sep 2026','Jumat',97,[747,16,30,274],1067],['5 Sep 2026','Sabtu',85,[360,2,16,268],646],['7 Sep 2026','Senin',187,[1248,70,40,1908],3266],['8 Sep 2026','Selasa',110,[516,33,19,1002],1570],['9 Sep 2026','Rabu',77,[203,30,45,434],712],['10 Sep 2026','Kamis',102,[206,73,5,665],949],['11 Sep 2026','Jumat',130,[367,468,8,361],1204],['12 Sep 2026','Sabtu',103,[363,85,6,199],653],['13 Sep 2026','Minggu',4,[7,0,0,8],15],['14 Sep 2026','Senin',122,[429,506,17,445],1397],['15 Sep 2026','Selasa',116,[557,99,7,291],954],['16 Sep 2026','Rabu',148,[1327,110,1,267],1705],['17 Sep 2026','Kamis',159,[1355,228,10,217],1810],['18 Sep 2026','Jumat',134,[1735,16,6,309],2066],['19 Sep 2026','Sabtu',90,[604,37,1,177],819],['20 Sep 2026','Minggu',2,[36,0,0,0],36]];
const T=[['28 Sep 2026','2609023664','319.857','CV. OLALA','VILLAON','VILLAON VPAD 2 4GB 64GB',1,1747000],['28 Sep 2026','2609023938','010.355','BEYOND GADGET','MOTOPAD','MOTOPAD 60 NEO 4GB 128GB',3,8505000],['28 Sep 2026','2609023939','010.355','BEYOND GADGET','MOTOPAD','KEYBOARD - IDEA TAB',3,1110000],['28 Sep 2026','2609024164','319.937','NADHIFA CELL','VILLAON','VILLAON V50S 4GB 64GB',7,10381000],['28 Sep 2026','2609024165','319.841','INTER SELULER','MOTOROLA','MOTOROLA G86 POWER 8GB 256GB',1,4570734],['28 Sep 2026','2609024167','319.841','INTER SELULER','VILLAON','VILLAON HYPER 100 6GB 128GB',10,17160000],['28 Sep 2026','2609024167','319.841','INTER SELULER','VILLAON','VILLAON VPAD 2 4GB 128GB',10,19200000],['28 Sep 2026','2609024168','320.357','IAN CELL LIMBUNG','VILLAON','VILLAON V50S 3GB 32GB',5,6015000],['28 Sep 2026','2609024168','320.357','IAN CELL LIMBUNG','VILLAON','VILLAON VPAD 2 4GB 128GB',1,1920000],['28 Sep 2026','2609024168','320.357','IAN CELL LIMBUNG','VILLAON','VILLAON VPAD 2 4GB 64GB',1,1747000],['28 Sep 2026','2609024169','321.093','PANAIKANG CELL','VILLAON','VILLAON V50S 3GB 32GB',5,6015000],['28 Sep 2026','2609024169','321.093','PANAIKANG CELL','VILLAON','VILLAON VPAD 2 4GB 128GB',1,1920000],['28 Sep 2026','2609024170','320.150','MHP CELL','VILLAON','VILLAON V50S 3GB 32GB',5,6015000]];
const f=n=>n.toLocaleString('id-ID'),rp=n=>'Rp '+f(n);const BC={};B.forEach(b=>BC[b[0]]=b);
const mx=B.map((_,i)=>Math.max(...H.map(r=>r[3][i])));
let M='new',HS='h1';
function hNow(){return `<div class="sc"><table class="now"><thead><tr><th>TANGGAL</th><th>HARI</th><th class="n">DEALER PRODUKTIF</th>${B.map(b=>`<th class="h" style="text-align:center">${b[0]}</th>`).join('')}<th class="n">TOTAL SELLTHRU</th></tr></thead><tbody>${H.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td>${r[3].map((v,i)=>`<td class="h" style="background:${B[i][2]}55"><span class="pill" style="opacity:${.45+.55*v/mx[i]}">${f(v)}</span></td>`).join('')}<td class="n">${f(r[4])}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td>Sebulan · dealer unik</td><td class="n">1.327</td><td class="n">16.212</td><td class="n">3.179</td><td class="n">320</td><td class="n">10.361</td><td class="n">30.072</td></tr></tbody></table></div>`}
function hNew(){const st=b=>`style="--d:${b[1]};--l:${b[2]}"`;
 return `<div class="lg"><span>${{h1:"Angka polos, kolom brand diberi tint tipis seragam (tanpa gradasi intensitas). ",h2:"Batang tipis di dalam sel menunjukkan besar relatif terhadap hari tertinggi brand itu (bukan heatmap warna). ",h4:"Gabungan: kolom brand diberi tint tipis (H1) + hari TERTINGGI tiap brand ditandai ▲ dengan sel warna brand pekat (H3). ",h3:"Angka polos; hanya hari TERTINGGI tiap brand yang ditandai ▲ dan diberi warna brand. "}[HS]}Baris Minggu/libur diarsir merah.</span></div><div class="sc"><table class="new hd"><thead><tr><th>TANGGAL</th><th>HARI</th><th class="n" style="background:#E2F4F1;color:#0E7C6B;border-top:3px solid #0E7C6B;text-align:right">DEALER PRODUKTIF</th>${B.map(b=>`<th class="bh" ${st(b)}><span class="bs" ${st(b)}></span>${b[0]}</th>`).join('')}<th class="n" style="background:#E3EEFB;color:#1E5FB8;border-top:3px solid #1E5FB8;text-align:right">TOTAL SELLTHRU</th></tr></thead><tbody>${H.map(r=>{const off=r[1]==='Minggu';return `<tr class="${off?'off':''}"><td>${r[0]}</td><td class="k">${r[1]}</td><td class="n">${r[2]}</td>${r[3].map((v,i)=>{const col=B[i][1],rgb=[1,3,5].map(k=>parseInt(col.slice(k,k+2),16)),z=v===0,pk=v===mx[i];
 if(HS==='h1')return `<td class="n" style="background:${B[i][2]}99;color:${z?'#A7B0BA':'#15232E'}">${f(v)}</td>`;
 if(HS==='h2'){const w=Math.round(v/mx[i]*100);return `<td class="n" style="background:linear-gradient(90deg,rgba(${rgb},.30) ${w}%,transparent ${w}%);color:${z?'#A7B0BA':'#15232E'}">${f(v)}</td>`}
 if(HS==='h4')return `<td class="n" style="${pk?'background:'+col+';color:#fff;font-weight:800':'background:'+B[i][2]+'99;color:'+(z?'#A7B0BA':'#15232E')}">${pk?'▲ ':''}${f(v)}</td>`
 return `<td class="n" style="${pk?'background:'+B[i][2]+';color:'+col+';font-weight:800':'color:'+(z?'#A7B0BA':'#15232E')}">${pk?'▲ ':''}${f(v)}</td>`}).join('')}<td class="n"><b>${f(r[4])}</b></td></tr>`}).join('')}<tr class="tot"><td>TOTAL</td><td class="k" title="Sebulan · dealer unik">sebulan</td><td class="n bt" style="--d:#0E7C6B;--l:#E2F4F1">1.327</td>${[16212,3179,320,10361].map((v,i)=>`<td class="n bt" ${st(B[i])}>${f(v)}</td>`).join('')}<td class="n bt" style="--d:#1E5FB8;--l:#E3EEFB">30.072</td></tr></tbody></table></div>`}
function rNow(){return `<div class="fl"><span class="bx">DARI TANGGAL 01/09/2026</span><span class="bx">SAMPAI TANGGAL 28/09/2026</span><span class="seg"><button>HARI INI</button><button>7 HARI</button><button class="on" style="background:#0B5CAD;color:#fff">BULAN INI</button></span><span class="bx">RESET</span><span style="flex:1"></span><span class="bx" style="color:#0B5CAD">DOWNLOAD RAW</span></div><div class="sc"><table class="now"><thead><tr><th>TANGGAL</th><th>NOMOR SJ</th><th>DEALER</th><th>BRAND</th><th>TYPE</th><th class="n">QTY</th><th class="n">OMZET</th></tr></thead><tbody>${T.map(r=>`<tr><td>${r[0]}</td><td>${r[1]} – PT. MSI</td><td><small>${r[2]}</small> – ${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td class="n">${r[6]}</td><td class="n">${rp(r[7])}</td></tr>`).join('')}</tbody></table></div>`}
function rNew(){const q=T.reduce((a,r)=>a+r[6],0),o=T.reduce((a,r)=>a+r[7],0);
 return `<div class="ff"><div class="f"><span>DARI</span>01/09/2026</div><div class="f"><span>SAMPAI</span>28/09/2026</div><div class="sg"><b>HARI INI</b><b>7 HARI</b><b class="on">BULAN INI</b></div><button class="btn">RESET</button><button class="btn dl">DOWNLOAD RAW</button></div><div class="sc"><table class="new rd"><thead><tr><th>TANGGAL</th><th>NOMOR SJ</th><th>KODE</th><th>DEALER</th><th>BRAND</th><th>TYPE</th><th class="n" style="background:#E3EEFB;color:#1E5FB8;border-top:3px solid #1E5FB8;text-align:right">QTY</th><th class="n" style="background:#FFF4D6;color:#7A5200;border-top:3px solid #9A6400;text-align:right">OMZET</th></tr></thead><tbody>${T.map(r=>{const b=BC[r[4]];return `<tr><td>${r[0]}</td><td>${r[1]}<span style="color:#8A94A0;font-size:9.5px"> · PT. MSI</span></td><td class="k">${r[2]}</td><td><span class="lnk">${r[3]}</span></td><td><span class="bc" style="--d:${b[1]}"><span class="bs" style="--d:${b[1]}"></span>${r[4]}</span></td><td>${r[5]}</td><td class="n ql">${r[6]}</td><td class="n om">${rp(r[7])}</td></tr>`}).join('')}<tr class="tot"><td colspan="6">TOTAL · ${T.length} baris ditampilkan</td><td class="n bt" style="--d:#1E5FB8;--l:#E3EEFB">${q}</td><td class="n bt" style="--d:#7A5200;--l:#FFF4D6">${rp(o)}</td></tr></tbody></table></div>`}
function render(){document.getElementById('note').innerHTML=M==='now'?'<b>SEKARANG</b>: header gradasi biru, kolom melebar (tanggal &amp; hari makan separuh layar), sel brand berbentuk pil, baris ±31px; filter Rincian terdiri dari beberapa kotak besar.':'<b>USULAN</b> (bahasa visual DOS/Analisa/popup yang sudah disetujui): <br><b>Transaksi Harian</b>: kolom Tanggal/Hari dikunci sempit (tidak melebar lagi), baris ±24px, header per brand berwarna brand, <b>TANPA heatmap</b> (3 gaya angka, pilih di bar atas: H1 polos + tint kolom · H2 bar tipis dalam sel · H3 puncak ditandai · H4 gabungan H1+H3), baris Minggu/libur diarsir, <b>baris TOTAL menempel di bawah</b> dengan warna sama seperti header kolom. <br><b>Rincian Transaksi</b>: filter jadi 1 baris 32px, KODE dealer dipisah dari nama, brand jadi kotak berwarna, QTY &amp; OMZET berwarna indikator, <b>baris TOTAL baru</b> (jumlah dari baris yang tampil). <br><span style="color:#6B7785">Isi angka, kolom, dan urutan tidak berubah. Desktop saja, HP tetap. Data dari screenshot.</span>';
 document.getElementById('out').innerHTML=`<div class="panel"><div class="ph"><h3>TRANSAKSI HARIAN</h3><small>Harian per brand · tanggal ke bawah, brand ke samping · warna = intensitas unit</small></div><div class="pb">${M==='now'?hNow():hNew()}</div></div><div class="panel"><div class="ph"><h3>RINCIAN TRANSAKSI ⓘ</h3></div><div class="pb">${M==='now'?rNow():rNew()}</div></div>`;
 document.querySelectorAll('#m button').forEach(b=>b.classList.toggle('on',b.dataset.v===M))}
document.addEventListener('click',e=>{const hh=e.target.closest('#hs [data-h]');if(hh){HS=hh.dataset.h;document.querySelectorAll('#hs button').forEach(b=>b.classList.toggle('on',b===hh));render();return}const b=e.target.closest('#m [data-v]');if(b){M=b.dataset.v;render()}});render();
</script></body></html>
