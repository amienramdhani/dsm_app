<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Menu TIM · opsi rombak</title><style>
*{box-sizing:border-box}body{margin:0;font:12px Inter,system-ui,sans-serif;background:#F3F6F9;color:#10394E}

.fb label{font-size:9px;font-weight:800;color:#6B7785;letter-spacing:.4px;display:flex;flex-direction:column;gap:2px}.fb .sel{height:30px;min-width:120px;border:1px solid #CBD5E0;border-radius:8px;padding:7px 9px;font-size:11.5px;font-weight:600;color:#10394E;background:#fff}

.mint{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.mint div{background:#E8F7EF;border:1px solid #CFEBDC;border-radius:12px;padding:9px 14px}.mint small{display:block;font-size:10px;font-weight:800;letter-spacing:.3px;color:#3F6F58;text-transform:uppercase}.mint b{font-size:20px;color:#0F4F3B}.mint em{display:block;font-style:normal;font-size:10.5px;color:#4E7A66}

.tabs{display:flex;gap:4px;border-bottom:2px solid #E3E9EF;margin:0 0 10px}.tabs>span{padding:8px 16px;font-weight:800;font-size:11.5px;color:#7C8899;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}.tabs>span.on{color:#10394E;border-color:#1E5FB8}
table{border-collapse:collapse;width:100%}th{background:#E6EBF1;color:#10394E;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-align:left;padding:5px 8px;border-bottom:2px solid #15303F;border-right:1px solid #D5DDE6;white-space:nowrap}
td{padding:3px 8px;border-top:1px solid #E3E9EF;border-right:1px solid #EEF1F5;font-size:11.5px;white-space:nowrap}tr:nth-child(even) td{background:#FAFBFD}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td small{color:#6B7785;font-size:10px;margin-left:5px}tfoot td{background:#E6EBF1!important;font-weight:800;border-top:2px solid #15303F}
.bad,.warn,.ok{display:inline-block;border-radius:99px;padding:0 8px;font-size:10px;font-weight:800}.bad{background:#FCE9E8;color:#B43138}.warn{background:#FFF3D6;color:#925c00}.ok{background:#E5F6EE;color:#176d48}
.pb{display:inline-block;width:80px;height:6px;background:#E3E9EF;border-radius:3px;position:relative;vertical-align:middle;margin-right:6px}.pb i{display:block;height:100%;border-radius:3px}.pb em{position:absolute;top:-2px;width:2px;height:10px;background:#10394E;opacity:.6}
.bg{font-size:9.5px;font-weight:800;color:#fff;text-align:center;border-bottom:0}th.b1{background:#0E7C6B;color:#fff}th.b2{background:#B33D0B;color:#fff}th.b3{background:#1E5FB8;color:#fff}th.b4{background:#455A64;color:#fff}
.md{display:grid;grid-template-columns:420px 1fr;gap:12px}.list>div:not(.ph){display:grid;grid-template-columns:24px 1fr 56px 70px;gap:6px;padding:6px 12px;border-top:1px solid #EEF1F5;align-items:center;cursor:pointer;font-size:11.5px}.list>div.on{background:#EAF2FB;box-shadow:inset 4px 0 0 #1E5FB8}
.dt{padding:14px 16px;min-width:0}.hsc{overflow-x:auto;border:1px solid #D5DDE6;border-radius:8px;max-width:100%}.hsc table{min-width:1700px}.hsc th:first-child,.hsc td:first-child{position:sticky;left:0;z-index:3;vertical-align:middle;background:#E6EBF1;box-shadow:2px 0 3px rgba(0,0,0,.08)}.hsc td:first-child{background:#fff}.hsc thead tr+tr th:first-child{position:static;box-shadow:none;background:#E6EBF1}.hint2{font-size:10px;color:#6B7785;margin:4px 0 0}.dt h3{margin:0 0 2px;font-size:15px}.kc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.kc div{border:1px solid #E3E9EF;border-radius:10px;padding:8px 10px}.kc small{display:block;font-size:9px;font-weight:800;color:#6B7785}.kc b{font-size:16px}
.acc .ph{cursor:pointer;background:#EFEDFD;box-shadow:inset 5px 0 0 #6663c4}.acc .ph i{width:18px;height:18px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;color:#6663c4}
.cur{opacity:.9}.cur .blue{background:#0D5BA8;color:#fff;border-radius:14px;padding:14px 18px;margin-bottom:10px}.cur .blue b{font-size:20px}.cur .ph{background:linear-gradient(#EEF3FA,#fff)}
tr.cl{cursor:pointer}tr.cl:hover td{background:#EAF2FB!important}tr.cl.sel td{background:#DCE9F8!important}.lk{color:#10394E}tr.cl:hover .lk{color:#1E5FB8;text-decoration:underline;text-underline-offset:2px}tr.cl:hover .lk::after{content:' ›';color:#1E5FB8}.dt{animation:fl .5s}@keyframes fl{from{box-shadow:0 0 0 3px #9DBCE6}to{box-shadow:0 1px 4px rgba(16,57,78,.08)}}.gc{display:inline-flex;align-items:center;gap:5px}.gch{border-radius:99px;padding:0 7px;font-size:10px;font-weight:800}.gch.u{background:#E5F6EE;color:#176d48}.gch.d{background:#FCE9E8;color:#b43138}.dbtn{border:1px solid #1E5FB8;color:#1E5FB8;background:#fff;border-radius:7px;padding:2px 9px;font-size:9.5px;font-weight:800;white-space:nowrap;cursor:pointer}.dbtn:hover{background:#1E5FB8;color:#fff}.bsep{border-left:1px solid #7F93A6!important}tfoot td.bsep{border-left:1px solid #7F93A6!important}</style></head><body>
<div class="top"><b>Menu TIM · opsi rombak</b><span id="bt" style="display:flex;gap:6px;flex-wrap:wrap"></span><span style="margin-left:14px;font-size:10px;font-weight:800;color:#6B7785">ISTILAH STATUS:</span><span id="wd" style="display:flex;gap:6px"></span></div>
<div class="note" id="n"></div><div class="wrap" id="o"></div>
<script>
const P=[['VACANT MADURA','ASM RIDHO SETIAWAN','JAWA TIMUR 1',120,0,0,0,'Bahaya'],['ARIFIN SORMANDANI','RGM TOYO','BOGOR-DEPOK',3266,30,0.9,1.0,'Bahaya'],['RIDHO ALFIAN','RGM TOYO','JAKARTA',8500,1334,15.7,17.0,'Bahaya'],['DEDE PUJI IMAN FAUZI','ASM EKO PRASETYO','BIG SEMARANG',1011,225,22.3,24.1,'Bahaya'],['KHOIRUR ROZIQIN','ASM EKO PRASETYO','BIG SEMARANG',526,169,32.1,34.8,'Bahaya'],['RIZKY ADE SAPUTRA','SEPTO ANDI PURNOMO','BIG PURWOKERTO',1021,415,40.6,44.0,'Bahaya'],['PURNAMA RUDIARTO','ASM SUSILA SODIKIN','BIG CIREBON',1551,731,47.1,51.1,'Bahaya'],['TEDY BRAMASTA A.','ASM RIDHO SETIAWAN','JAWA TIMUR 1',1039,539,51.9,56.2,'Waspada']];
const f=n=>n.toLocaleString('id-ID'),pc=n=>n.toFixed(1).replace('.',',')+'%';
window.WD=window.WD??2;const WS=[['Bahaya','Waspada','Aman'],['Kritis','Waspada','Aman'],['Tertinggal','Mengejar','Tembus'],['Jauh dari target','Perlu dikejar','Di jalur']];const st=s=>{const k=s==='Bahaya'?0:s==='Waspada'?1:2;return `<span class="${['bad','warn','ok'][k]}">${WS[WD][k]}</span>`};
const pb=a=>`<span class="pb"><i style="width:${Math.min(100,a)}%;background:${a>=90?'#12866A':a>=60?'#C28A00':'#D2453F'}"></i><em style="left:92%"></em></span>`;
const FILT='<div class="fb"><label>TINGKAT<span class="sel">Sales ⌄</span></label><label>BRAND<span class="sel">ITEL ⌄</span></label><label>REGION<span class="sel">Semua Region ⌄</span></label><label>SUB REGION<span class="sel">Semua Sub Region ⌄</span></label><span class="sp"></span><span class="btn">FILTER LAIN</span></div>';
const MINT=()=>'<div class="mint"><div><small>Diproyeksikan tembus</small><b>5 / 89</b><em>proyeksi ≥ 100% target</em></div><div class="r"><small>'+WS[WD][0]+'</small><b>34</b><em>proyeksi &lt; 80% target</em></div><div class="y"><small>'+WS[WD][1]+'</small><b>3</b><em>proyeksi 80–99%</em></div><div><small>Gap tim</small><b>21.156 unit</b><em>butuh 10.578 unit/hari kerja · sisa 2 hari</em></div></div>';
const EW=`<table><thead><tr><th>#</th><th>SALES</th><th>ASM</th><th>SUB REGION</th><th class="n">TARGET</th><th class="n">AKTUAL</th><th>ACH VS TIME GONE</th><th class="n">PROYEKSI</th><th class="n">RUN RATE</th><th class="n">BUTUH / HARI</th><th>STATUS</th><th></th></tr></thead><tbody>${P.map((r,i)=>`<tr><td>${i+1}</td><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td class="n">${f(r[3])}</td><td class="n"><b>${f(r[4])}</b></td><td>${pb(r[5])}${pc(r[5])}</td><td class="n">${pc(r[6])}</td><td class="n">${(r[4]/12).toFixed(1).replace(".",",")}</td><td class="n">${f(Math.round(r[3]*(1-r[5]/100)/2))}</td><td>${st(r[7])}</td><td><span class="dbtn">LIHAT DETAIL KPI</span></td></tr>`).join('')}</tbody><tfoot><tr><td></td><td>Total · 89 Sales</td><td></td><td></td><td class="n">35.351</td><td class="n">16.206</td><td>42,3%</td><td class="n">45,8%</td><td class="n">1.350,5</td><td class="n">9.573</td><td></td><td></td></tr></tfoot></table>`;
const gr=(a,l)=>{const d=a-l,p=l?d/l*100:0,up=d>=0;return `<span class="gc"><span class="gch ${up?'u':'d'}">${up?'▲':'▼'} ${pc(Math.abs(p))}</span></span>`};
const BR=['ITEL','MOTOPAD','MOTOROLA','VILLAON'];
const PT=`<table><thead><tr><th rowspan="2">NAMA</th><th rowspan="2">ASM</th><th rowspan="2">SUB REGION</th><th class="b1" colspan="5" style="text-align:center">SELL THRU</th><th class="b2 bsep" colspan="5" style="text-align:center">DEALER AKTIF</th><th class="b3 bsep" colspan="2" style="text-align:center">NOO</th><th class="b4 bsep" style="text-align:center">SELL OUT</th><th class="bsep" style="background:#9A6400;color:#fff;text-align:center">OMZET</th></tr><tr>${['TARGET','AKTUAL','%ACHV','LMTD','GROWTH','TARGET','AKTUAL','%ACHV','LMTD','GROWTH','TARGET','AKTUAL','AKTUAL','AKTUAL'].map((x,k)=>'<th class="'+(x==='GROWTH'?'':'n ')+([0,5,10,12,13].includes(k)?'bsep':'')+'">'+x+'</th>').join('')}</tr></thead><tbody>${P.slice(0,6).map((r,i)=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td class="n bsep">${f(r[3])}</td><td class="n"><b>${f(r[4])}</b></td><td class="n">${pc(r[5])}</td>${(()=>{const l=Math.round(r[4]*(i%2?0.9:1.12))+3;return `<td class="n">${f(l)}</td><td>${gr(r[4],l)}</td>`})()}<td class="n bsep">${20+i}</td><td class="n"><b>${14+i}</b></td><td class="n">${pc(60+i*6)}</td>${(()=>{const l=15+(i%3)*2;return `<td class="n">${l}</td><td>${gr(14+i,l)}</td>`})()}<td class="n bsep">0</td><td class="n">${i%3}</td><td class="n bsep">${100+i*40}</td><td class="n bsep">Rp ${f(200000000+i*140000000)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total · 89 Sales</td><td></td><td></td><td class="n bsep">35.351</td><td class="n">16.206</td><td class="n">45,8%</td><td class="n">16.702</td><td>${gr(16206,16702)}</td><td class="n bsep">1.080</td><td class="n">761</td><td class="n">70,5%</td><td class="n">643</td><td>${gr(761,643)}</td><td class="n bsep">0</td><td class="n">60</td><td class="n bsep">1</td><td class="n bsep">Rp 24.569.825.490</td></tr></tfoot></table>`;
const BIGR={'JAWA TIMUR 1':'JAWA TIMUR','BOGOR-DEPOK':'JABODEBEK','JAKARTA':'JABODEBEK','BIG SEMARANG':'JAWA TENGAH','BIG PURWOKERTO':'JAWA TENGAH','BIG CIREBON':'JAWA BARAT'};
const PI=`<table><thead><tr><th rowspan="2">SALES</th><th rowspan="2">ASM</th><th rowspan="2">SUB REGION</th>${BR.map((b,i)=>`<th class="b${i+1} bsep" colspan="5" style="text-align:center">${b}</th>`).join('')}</tr><tr>${BR.map(()=>'<th class="n bsep">TARGET</th><th class="n">AKTUAL</th><th class="n">%ACHV</th><th class="n">LMTD</th><th>GROWTH</th>').join('')}</tr></thead><tbody>${P.slice(0,6).map((r,i)=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td>${BR.map((b,j)=>{const t=50+i*9+j*8,a=20+i*7+j*5;return `<td class="n bsep">${t}</td><td class="n"><b>${a}</b></td><td class="n">${pc(a/t*100)}</td>${(()=>{const l=a+((i+j)%2?-4:5);return `<td class="n">${l}</td><td>${gr(a,l)}</td>`})()}`}).join('')}</tr>`).join('')}</tbody><tfoot><tr><td>Total · 89 Sales</td><td></td><td></td><td class="n bsep">35.351</td><td class="n">16.206</td><td class="n">45,8%</td><td class="n">16.702</td><td>${gr(16206,16702)}</td><td class="n bsep">5.429</td><td class="n">3.179</td><td class="n">58,6%</td><td class="n">1.342</td><td>${gr(3179,1342)}</td><td class="n bsep">1.252</td><td class="n">320</td><td class="n">25,6%</td><td class="n">641</td><td>${gr(320,641)}</td><td class="n bsep">13.527</td><td class="n">10.361</td><td class="n">76,6%</td><td class="n">6.490</td><td>${gr(10361,6490)}</td></tr></tfoot></table>`;
function TREN(seed,tot){const d=['Sen 9','Sel 10','Rab 11','Kam 12','Jum 13','Sab 14','Sen 16'],v=d.map((_,i)=>Math.max(0,Math.round(tot/22*(0.5+((seed*7+i*13)%10)/8))));const W=700,H=78,pad=50,x=i=>pad+i*(W-2*pad)/6,mx=Math.max(...v,1),y=n=>50-n/mx*30;
return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block"><polyline fill="none" stroke="#D2453F" stroke-width="1.6" points="${v.map((n,i)=>x(i)+','+y(n)).join(' ')}"/>${v.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="${i===6?3.6:2.6}" fill="${i===6?'#D2453F':'#fff'}" stroke="#D2453F" stroke-width="1.6"/><text x="${x(i)}" y="${y(n)-7}" text-anchor="middle" font-size="10" font-weight="700" fill="#10394E" font-family="Inter,system-ui,sans-serif">${n}</text><text x="${x(i)}" y="72" text-anchor="middle" font-size="9" fill="#6B7785" font-family="Inter,system-ui,sans-serif">${d[i]}</text>`).join('')}</svg>`;}
function DET(nm){let t=PI.replace(/<tbody>[\s\S]*<\/tbody>/,m=>m.split('</tr>').slice(0,1).join('</tr>')+'</tr></tbody>').replace(/<tfoot>[\s\S]*<\/tfoot>/,'').replace('VACANT MADURA',nm);
 t=t.replace('<th rowspan="2">ASM</th><th rowspan="2">SUB REGION</th>','');
 t=t.replace(/(<tbody><tr><td><b>[^<]*<\/b><\/td>)<td>[^<]*<\/td><td>[^<]*<\/td>/,'$1');return t;}
const O={now:['SEKARANG','Banner biru tebal, 3 filter besar + FILTER LAIN, lalu 3 panel panjang bertumpuk (Early Warning, Pencapaian Tim, Pencapaian per Indikator) dengan filter ke-2 di panel terakhir. Gaya tiap tabel beda-beda, halaman sangat panjang.',()=>`<div class="cur"><div class="blue"><b>TIM</b><br><small>Pencapaian tim dan perbandingan periode · sesuai hak akses</small></div>${FILT}<div class="card"><div class="ph"><b>EARLY WARNING · SELL THRU</b></div><div style="padding:8px">${MINT()}</div>${EW}</div><div class="card"><div class="ph"><b>PENCAPAIAN TIM · SALES</b></div>${PT}</div><div class="card"><div class="ph"><b>PENCAPAIAN PER INDIKATOR</b></div>${PI}</div></div>`],
t1:['T1 · SATU HALAMAN BERTAB (paling aman)','Banner biru diganti judul polos + toggle (gaya S4). Satu baris filter. Kartu ringkasan mint di atas. Tiga panel jadi <b>tiga tab</b> (EARLY WARNING · PENCAPAIAN TIM · PER INDIKATOR) sehingga halaman tidak panjang. Isi tiap tabel tidak berubah, hanya gaya tabel disamakan (padat, bergaris, header abu muda).',()=>{window._t=window._t||0;const ct=[EW,PT,PI][_t];return `<div class="ttl"><h2>TIM</h2><small>Pencapaian tim dan perbandingan periode</small><span class="sp"></span><div class="seg"><span class="on">SALES</span><span>TELEMARKETING</span></div></div>${FILT}${MINT()}<div class="tabs">${['EARLY WARNING','PENCAPAIAN TIM','PER INDIKATOR'].map((x,i)=>`<span class="${i===_t?'on':''}" onclick="_t=${i};r('t1')">${x}</span>`).join('')}</div><div class="card">${ct}</div>`}],
t2:['T2 · SATU TABEL INDUK','Tiga tabel digabung jadi <b>satu tabel</b>. Pilih indikator di segmen (SELL THRU / DEALER AKTIF / NOO / SELL OUT / OMZET). Kolom tetap: Sales, ASM, Region, Target, Aktual, Ach vs time gone, Proyeksi, Status, lalu <b>4 kolom brand</b> (%ACHV per brand). Paling ringkas dan tidak ada data dobel, tapi paling besar perubahannya (Pencapaian Tim dan Per Indikator hilang sebagai panel terpisah).',()=>`<div class="ttl"><h2>TIM</h2><small>Pencapaian tim dan perbandingan periode</small><span class="sp"></span><div class="seg"><span class="on">SALES</span><span>TELEMARKETING</span></div></div>${FILT}${MINT()}<div class="card"><div class="ph"><div class="seg"><span class="on">SELL THRU</span><span>DEALER AKTIF</span><span>NOO</span><span>SELL OUT</span><span>OMZET</span></div><span class="sp"></span><small>time gone 92,3% · sisa 2 hari kerja</small></div><table><thead><tr><th>#</th><th>SALES</th><th>ASM</th><th>SUB REGION</th><th class="n">TARGET</th><th class="n">AKTUAL</th><th>ACH VS TIME GONE</th><th class="n">PROYEKSI</th><th>STATUS</th>${BR.map((b,i)=>`<th class="b${i+1} n">${b} %</th>`).join('')}</tr></thead><tbody>${P.map((r,i)=>`<tr><td>${i+1}</td><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td class="n">${f(r[3])}</td><td class="n"><b>${f(r[4])}</b></td><td>${pb(r[5])}${pc(r[5])}</td><td class="n">${pc(r[6])}</td><td>${st(r[7])}</td>${BR.map((b,j)=>`<td class="n">${pc(20+i*6+j*9)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`],
t3:['T3 · DAFTAR + RINCIAN (dua kolom)','Kiri: daftar Sales urut risiko (nomor, nama, ach, status) yang padat. Kanan: <b>rincian Sales yang dipilih</b> (kartu target/aktual/proyeksi/butuh per hari, mini tren 7 hari, tabel per brand). Cocok untuk ASM/RGM yang biasanya cek satu orang satu-satu. Perlu tombol Detail yang sekarang diganti klik baris.',()=>{const s=P[2];return `<div class="ttl"><h2>TIM</h2><small>Pencapaian tim dan perbandingan periode</small><span class="sp"></span><div class="seg"><span class="on">SALES</span><span>TELEMARKETING</span></div></div>${FILT}${MINT()}<div class="md" style="grid-template-columns:420px minmax(0,1fr)"><div class="card list"><div class="ph"><b>URUT RISIKO</b><span class="sp"></span><small>5 teratas dari 89 Sales</small></div>${P.slice(0,5).map((r,i)=>`<div class="${i===2?'on':''}"><span>${i+1}</span><b>${r[0]}</b><span>${pc(r[5])}</span>${st(r[7])}</div>`).join('')}</div><div class="card dt"><div style="display:flex;align-items:flex-start;gap:10px"><div><h3>${s[0]}</h3><small style="color:#6B7785">${s[1]} · ${s[2]}</small></div><span class="sp"></span><span class="dbtn" style="margin-top:2px">LIHAT DETAIL KPI</span></div><div class="kc"><div><small>TARGET</small><b>${f(s[3])}</b></div><div><small>AKTUAL</small><b>${f(s[4])}</b></div><div><small>PROYEKSI</small><b style="color:#B43138">${pc(s[6])}</b></div><div><small>BUTUH / HARI</small><b>3.583</b></div></div>${DET(s[0])}</div></div>`}],
t5:['T1+T3 · BERTAB + DAFTAR/RINCIAN','Gabungan: struktur <b>tab T1</b> (EARLY WARNING · PENCAPAIAN TIM · PER INDIKATOR) dengan isi tab pertama berupa <b>daftar + rincian T3</b>. Tab EARLY WARNING: kiri daftar Sales urut risiko, kanan rincian Sales terpilih (kartu, tren, tabel per brand). Tab PENCAPAIAN TIM dan PER INDIKATOR tetap tabel lebar penuh dengan gaya padat. Klik baris di daftar = ganti rincian (menggantikan tombol Detail). Di bawah daftar+rincian ada panel <b>SEMUA SALES · TABEL LENGKAP</b> (tabel Early Warning seperti sekarang, total menempel di bawah); klik <b>nama Sales</b> di tabel (atau di daftar) = rincian di panel atas berganti ke Sales itu, halaman otomatis menggulung ke rincian, baris terpilih disorot. Coba klik di mockup ini.',()=>{window._u=window._u||0;window._sel=window._sel??2;const s=P[_sel];const mdv=`<div class="md" style="grid-template-columns:420px minmax(0,1fr)"><div class="card list" style="margin:0"><div class="ph"><b>URUT RISIKO</b><span class="sp"></span><small>5 teratas dari 89 Sales</small></div>${P.slice(0,5).map((r,i)=>`<div class="${i===_sel?'on':''}" onclick="pick(${i},false)"><span>${i+1}</span><b>${r[0]}</b><span>${pc(r[5])}</span>${st(r[7])}</div>`).join('')}</div><div class="card dt" id="dtp" style="margin:0"><h3>${s[0]}</h3><small style="color:#6B7785">${s[1]} · ${s[2]}</small><div class="kc"><div><small>TARGET</small><b>${f(s[3])}</b></div><div><small>AKTUAL</small><b>${f(s[4])}</b></div><div><small>PROYEKSI</small><b style="color:#B43138">${pc(s[6])}</b></div><div><small>RUN RATE</small><b>${(s[4]/12).toFixed(1).replace(".",",")}</b></div><div><small>BUTUH / HARI</small><b>${f(Math.round(s[3]*(1-s[5]/100)/2))}</b></div></div><div style="margin:4px 0 6px;font-size:10px;font-weight:800;color:#6B7785">TREN 7 HARI <span style="font-weight:600">· unit per hari kerja</span></div>${TREN(_sel+1,s[4]+s[3]/10)}<div class="hsc" style="margin-top:8px">${DET(s[0])}</div><div class="hint2">↔ geser ke samping untuk melihat semua brand · kolom SALES tetap menempel</div></div></div>`;
return `<div class="ttl"><h2>TIM</h2><small>Pencapaian tim dan perbandingan periode</small><span class="sp"></span><div class="seg"><span class="on">SALES</span><span>TELEMARKETING</span></div></div>${FILT}${MINT()}<div class="tabs">${['EARLY WARNING','PENCAPAIAN TIM','PER INDIKATOR'].map((x,i)=>`<span class="${i===_u?'on':''}" onclick="_u=${i};r('t5')">${x}</span>`).join('')}<span class="sp"></span>${_u===1?'<small style="align-self:center;color:#6B7785">semua indikator tampil sekaligus</small>':'<div class="seg" style="align-self:center;margin-bottom:4px"><small style="padding:6px 10px;font-weight:800;color:#6B7785;font-size:9px;letter-spacing:.4px">INDIKATOR</small><span class="on">SELL THRU</span><span>DEALER AKTIF</span><span>NOO</span>'+(_u===2?'<span>SELL OUT</span><span>OMZET</span>':'')+'</div>'}</div>${_u===0?mdv+'<div class="card" style="margin-top:12px"><div class="ph"><b>SEMUA SALES · TABEL LENGKAP</b><small>klik nama Sales → rincian muncul di atas</small><span class="sp"></span><small>time gone 92,3% · sisa 2 hari kerja</small></div>'+EW.replace(/<tr><td>(\d+)<\/td><td><b>/g,(m,n)=>`<tr class="cl${+n-1===_sel?' sel':''}" onclick="pick(${+n-1},true)"><td>${n}</td><td><b class="lk">`)+'</div>':(_u===0?'':'<div class="card" style="padding:0"><div class="hsc" style="border:0">'+[EW,PT,PI][_u]+'</div><div class="hint2" style="padding:0 12px 8px">↔ geser ke samping jika tabel melebar · kolom pertama tetap menempel</div></div>')}`}],
t4:['T4 · PANEL LIPAT (gaya Summary)','Struktur sekarang dipertahankan, tapi tiap panel jadi <b>panel lipat gaya Summary History</b> (ungu muda, garis kiri, bulatan panah). Hanya Early Warning yang terbuka, dua lainnya tertutup dan diingat per perangkat. Satu baris filter bersama untuk ketiganya (filter ke-2 di Per Indikator dihapus). Perubahan paling kecil.',()=>`<div class="ttl"><h2>TIM</h2><small>Pencapaian tim dan perbandingan periode</small></div>${FILT}${MINT()}<div class="card acc"><div class="ph"><i>▾</i><b>EARLY WARNING · SELL THRU</b><small>time gone 92,3% · sisa 2 hari kerja</small></div>${EW}</div><div class="card acc"><div class="ph"><i>▸</i><b>PENCAPAIAN TIM · SALES</b><small>klik untuk membuka</small></div></div><div class="card acc"><div class="ph"><i>▸</i><b>PENCAPAIAN PER INDIKATOR</b><small>klik untuk membuka</small></div></div>`]};
function pick(i,up){_sel=i;r('t5');if(up)document.getElementById('dtp').scrollIntoView({behavior:'smooth',block:'center'});}
function rw(){document.getElementById('wd').innerHTML=WS.map((w,i)=>`<button class="${i===WD?'on':''}" onclick="WD=${i};r(window._k||'t5')">${w.join(' / ')}</button>`).join('')}
function r(k){window._k=k;rw();document.getElementById('bt').innerHTML=Object.keys(O).map(x=>`<button data-k="${x}" class="${x===k?'on':''}">${O[x][0].split(' (')[0]}</button>`).join('');document.querySelectorAll('#bt button').forEach(b=>b.onclick=()=>r(b.dataset.k));
document.getElementById('n').innerHTML='<b>'+O[k][0]+'</b><br>'+O[k][1]+' <br><small>Kolom <b>LMTD</b> = nilai bulan lalu pada periode yang sama; <b>GROWTH</b> = chip persen saja (tanpa selisih). <b>Filter INDIKATOR</b> ditaruh sebagai segmen di <b>kanan baris tab</b> (bukan di baris filter atas): muncul di tab EARLY WARNING (Sell Thru / Dealer Aktif / NOO, sama seperti sekarang) dan PER INDIKATOR (ditambah Sell Out dan Omzet); di tab PENCAPAIAN TIM disembunyikan karena semua indikator sudah tampil. Baris filter atas: TINGKAT, BRAND, <b>REGION (baru, level atas, mis. JABODEBEK)</b>, SUB REGION. Pilihan SUB REGION menyempit mengikuti REGION yang dipilih. Semuanya dan berlaku untuk ketiga tab. Angka = contoh dari data September. Berlaku desktop; HP tidak diubah.</small>';document.getElementById('o').innerHTML=O[k][2]();}
r('t1');
</script></body></html>
