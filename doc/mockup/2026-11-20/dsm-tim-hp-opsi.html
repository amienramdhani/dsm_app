<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu TIM · versi HP · opsi</title><style>
*{box-sizing:border-box}body{margin:0;font:12px Inter,system-ui,sans-serif;background:#E9EEF3;color:#10394E}
.top{background:#fff;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.08);position:sticky;top:0;z-index:50}
.top button{border:1px solid #CBD5E0;background:#fff;border-radius:8px;padding:6px 12px;font-weight:800;font-size:10.5px;cursor:pointer}.top button.on{background:#10394E;color:#fff;border-color:#10394E}
.note{margin:12px 16px;padding:10px 14px;background:#E8F7EF;border:1px solid #CFEBDC;border-radius:10px;color:#0F4F3B;line-height:1.5;max-width:900px}
.stage{display:flex;gap:24px;flex-wrap:wrap;margin:0 16px 40px;align-items:flex-start}
.ph{width:390px;height:780px;background:#F3F6F9;border:8px solid #10394E;border-radius:30px;overflow:hidden;position:relative;flex:none}
.ph .sc{height:100%;overflow-y:auto;padding:10px 10px 70px}
.lbl{font-size:10px;font-weight:800;color:#6B7785;margin:0 0 6px;letter-spacing:.4px}

.fbtn{display:flex;justify-content:center;align-items:center;gap:8px;height:36px;border-radius:10px;background:linear-gradient(#FFB020,#F07A0C);color:#fff;font-weight:800;font-size:12px;margin:0 0 8px}.fbtn i{font-style:normal;background:#fff;color:#C25A12;border-radius:99px;padding:0 7px;font-size:10px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}.chips span{background:#fff;border:1px solid #D5DDE6;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:700}
.m4{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.m4>div{background:#E8F7EF;border:1px solid #CFEBDC;border-radius:10px;padding:5px 10px;display:flex;align-items:center;gap:8px;height:40px}
.m4 b{font-size:16px;color:#0F4F3B}.m4 small{font-size:9px;font-weight:800;color:#3F6F58;text-transform:uppercase;line-height:1.15}
.m4 .r{background:#FDEEEC;border-color:#F4CFCB}.m4 .r b,.m4 .r small{color:#A3282A}.m4 .y{background:#FFF6DF;border-color:#F1E0AE}.m4 .y b,.m4 .y small{color:#8A6200}
.strip{display:flex;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:8px;overflow:hidden}.strip>div{flex:1;padding:5px 4px;text-align:center;border-right:1px solid #EEF1F5}.strip>div:last-child{border:0}
.strip b{display:block;font-size:15px}.strip small{font-size:8.5px;font-weight:800;color:#6B7785;text-transform:uppercase}
.tabs{display:flex;border-bottom:2px solid #E3E9EF;margin-bottom:8px}.tabs span{flex:1;text-align:center;padding:7px 0;font-weight:800;font-size:10px;color:#7C8899;border-bottom:3px solid transparent;margin-bottom:-2px}.tabs span.on{color:#10394E;border-color:#1E5FB8}
.seg{display:flex;border:1px solid #CBD5E0;border-radius:8px;overflow:hidden;background:#fff;margin-bottom:8px}.seg span{flex:1;text-align:center;padding:5px 0;font-size:10px;font-weight:800;color:#6B7785}.seg span.on{background:#10394E;color:#fff}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(16,57,78,.08);margin-bottom:8px;overflow:hidden}
.row{display:grid;grid-template-columns:20px 1fr auto;gap:6px;padding:7px 10px;border-top:1px solid #EEF1F5;align-items:center}.row:first-child{border:0}.row b{font-size:11.5px}.row small{display:block;color:#6B7785;font-size:9.5px}
.bad,.warn,.ok{display:inline-block;border-radius:99px;padding:0 8px;font-size:9.5px;font-weight:800}.bad{background:#FCE9E8;color:#B43138}.warn{background:#FFF3D6;color:#925c00}.ok{background:#E5F6EE;color:#176d48}
.more{text-align:center;padding:8px;font-weight:800;color:#1E5FB8;font-size:10.5px;border-top:1px solid #EEF1F5}
.hs{overflow-x:auto}.hs table{border-collapse:collapse;min-width:560px;width:100%}.hs th{background:#E6EBF1;font-size:9px;font-weight:800;padding:4px 6px;text-align:left;border-bottom:2px solid #15303F;white-space:nowrap;border-right:1px solid #D5DDE6}.hs td{padding:3px 6px;font-size:10.5px;border-top:1px solid #E3E9EF;border-right:1px solid #EEF1F5;white-space:nowrap;height:24px}
.hs th:first-child,.hs td:first-child{position:sticky;left:0;background:#fff;z-index:2;box-shadow:2px 0 3px rgba(0,0,0,.08);max-width:110px;overflow:hidden;text-overflow:ellipsis}.hs th:first-child{background:#E6EBF1}.hs thead tr+tr th:first-child{position:static;box-shadow:none;max-width:none}.hs td.n{text-align:right}.hs tfoot td{background:#E6EBF1;font-weight:800;border-top:2px solid #15303F}
.jump{display:flex;gap:5px;margin:0 0 6px}.jump span{background:#fff;border:1px solid #CBD5E0;border-radius:99px;padding:3px 10px;font-size:9.5px;font-weight:800;color:#10394E}.jump span.on{background:#10394E;color:#fff}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.2);padding:10px 14px 14px;transform:translateY(105%);transition:.25s;z-index:20;max-height:75%;overflow:auto}.sheet.on{transform:none}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:#CBD5E0;margin:0 auto 8px}.sheet h3{margin:0;font-size:14px}.kc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.kc div{border:1px solid #E3E9EF;border-radius:8px;padding:5px 8px}.kc small{display:block;font-size:8.5px;font-weight:800;color:#6B7785}.kc b{font-size:14px}
.btn{display:block;text-align:center;border:1px solid #1E5FB8;color:#1E5FB8;border-radius:8px;padding:7px;font-weight:800;font-size:10.5px;margin-top:8px}
.bar{position:absolute;bottom:0;left:0;right:0;height:56px;background:#fff;border-top:1px solid #E3E9EF;display:flex;justify-content:space-around;align-items:center;font-size:9px;font-weight:800;color:#7C8899;z-index:10}
.cd{display:flex;align-items:center;gap:8px;background:#E8F7EF;border:1px solid #CFEBDC;border-radius:10px;padding:6px 10px;margin-bottom:8px;font-size:10.5px}.cd b{font-size:13px;color:#0F4F3B}.cd .sp{flex:1}
.sc2{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.sc2>div{flex:none;min-width:112px;background:#E8F7EF;border:1px solid #CFEBDC;border-radius:10px;padding:5px 10px}.sc2 small{display:block;font-size:8.5px;font-weight:800;color:#3F6F58;text-transform:uppercase}.sc2 b{font-size:15px;color:#0F4F3B}.sc2 .r{background:#FDEEEC;border-color:#F4CFCB}.sc2 .r b,.sc2 .r small{color:#A3282A}.sc2 .y{background:#FFF6DF;border-color:#F1E0AE}.sc2 .y b,.sc2 .y small{color:#8A6200}
.tall{background:#fff;padding:10px;border-radius:10px;margin-bottom:8px;color:#A33A33;font-weight:700;font-size:10.5px;border:1px dashed #F4CFCB}
.mst{display:flex;background:#E8F7EF;border:1px solid #CFEBDC;border-radius:12px;margin-bottom:8px;overflow:hidden}.mst>div{flex:1;text-align:center;padding:6px 4px;border-right:1px solid #CFEBDC}.mst>div:last-child{border:0}.mst small{display:block;font-size:8.5px;font-weight:800;color:#3F6F58;text-transform:uppercase;line-height:1.2}.mst b{font-size:15px;color:#0F4F3B}.mst .r b{color:#A3282A}.mst .y b{color:#8A6200}
.hs th.g1{background:#0E7C6B;color:#fff}.hs th.g2{background:#B33D0B;color:#fff}.hs th.g3{background:#1E5FB8;color:#fff}.hs th.g4{background:#455A64;color:#fff}.hs th.g5{background:#9A6400;color:#fff}.hs th.gc{text-align:center}.hs .bs{border-left:1px solid #7F93A6}
.gch{border-radius:99px;padding:0 6px;font-size:9px;font-weight:800}.gch.u{background:#E5F6EE;color:#176d48}.gch.d{background:#FCE9E8;color:#b43138}.hnt{font-size:9px;color:#6B7785;margin:2px 0 6px}
</style></head><body>
<div class="top"><b>Menu TIM · versi HP</b><span id="bt" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
<div class="note" id="n"></div><div class="stage" id="o"></div>
<script>
const P=[['VACANT MADURA','ASM RIDHO','JAWA TIMUR 1',120,0,0,0,'bad'],['ARIFIN SORMANDANI','RGM TOYO','BOGOR-DEPOK',3266,30,.9,1.0,'bad'],['RIDHO ALFIAN','RGM TOYO','JAKARTA',8500,1334,15.7,17.0,'bad'],['DEDE PUJI IMAN FAUZI','ASM EKO','BIG SEMARANG',1011,225,22.3,24.1,'bad'],['KHOIRUR ROZIQIN','ASM EKO','BIG SEMARANG',526,169,32.1,34.8,'bad'],['RIZKY ADE SAPUTRA','SEPTO','BIG PURWOKERTO',1021,415,40.6,44.0,'bad'],['PURNAMA RUDIARTO','ASM SUSILA','BIG CIREBON',1551,731,47.1,51.1,'bad'],['TEDY BRAMASTA A.','ASM RIDHO','JAWA TIMUR 1',1039,539,51.9,56.2,'warn']];
const f=n=>n.toLocaleString('id-ID'),pc=n=>n.toFixed(1).replace('.',',')+'%',W={bad:'Tertinggal',warn:'Mengejar',ok:'Tembus'},st=s=>`<span class="${s}">${W[s]}</span>`;
const FB='<div class="fbtn">FILTER <i>3</i></div>';
const HEAD='<h2>TIM</h2><p class="sub">Pencapaian tim dan perbandingan periode</p>';
const M4='<div class="m4"><div><b>5/89</b><small>Diproyeksikan<br>tembus</small></div><div class="r"><b>34</b><small>Tertinggal</small></div><div class="y"><b>3</b><small>Mengejar</small></div><div><b>21.156</b><small>Gap tim · 10.578/hari</small></div></div>';
const TABS='<div class="tabs"><span class="on">EARLY WARNING</span><span>PENCAPAIAN</span><span>INDIKATOR</span></div>';
const SEG='<div class="seg"><span class="on">SELL THRU</span><span>DEALER AKTIF</span><span>NOO</span></div>';
const SHEET=(s)=>`<div class="sheet" id="sh"><div class="grip"></div><h3>${s[0]}</h3><small style="color:#6B7785">${s[1]} · ${s[2]}</small><div class="kc"><div><small>TARGET</small><b>${f(s[3])}</b></div><div><small>AKTUAL</small><b>${f(s[4])}</b></div><div><small>PROYEKSI</small><b style="color:#B43138">${pc(s[6])}</b></div><div><small>RUN RATE</small><b>${(s[4]/12).toFixed(1).replace('.',',')}</b></div><div><small>BUTUH / HARI</small><b>${f(Math.round(s[3]*(1-s[5]/100)/2))}</b></div><div><small>ACH</small><b>${pc(s[5])}</b></div></div><div class="lbl">TREN 7 HARI · unit per hari kerja</div><svg viewBox="0 0 340 60" width="100%"><polyline fill="none" stroke="#D2453F" stroke-width="1.5" points="20,40 70,30 120,44 170,22 220,34 270,18 320,38"/>${[40,30,44,22,34,18,38].map((y,i)=>`<circle cx="${20+i*50}" cy="${y}" r="2.6" fill="#fff" stroke="#D2453F"/><text x="${20+i*50}" y="${y-6}" font-size="8.5" font-weight="700" text-anchor="middle" fill="#10394E">${[3,5,2,6,4,7,0][i]}</text><text x="${20+i*50}" y="58" font-size="7.5" text-anchor="middle" fill="#6B7785">${['Sen 9','Sel 10','Rab 11','Kam 12','Jum 13','Sab 14','Sen 16'][i]}</text>`).join('')}</svg><div class="lbl" style="margin-top:6px">PER BRAND · geser ke samping</div><div class="hs"><table style="min-width:520px"><thead><tr><th>BRAND</th><th>TARGET</th><th>AKTUAL</th><th>%ACHV</th><th>LMTD</th><th>GROWTH</th></tr></thead><tbody>${['ITEL','MOTOPAD','MOTOROLA','VILLAON'].map((b,i)=>`<tr><td><b>${b}</b></td><td class="n">${40+i*9}</td><td class="n">${12+i*3}</td><td class="n">${pc(30-i*4)}</td><td class="n">${14+i}</td><td><span class="${i%2?'bad':'ok'}">${i%2?'▼':'▲'} ${6+i},0%</span></td></tr>`).join('')}</tbody></table></div><div class="btn">LIHAT DETAIL KPI</div></div>`;
const BAR='<div class="bar"><span>BERANDA</span><span>DEALER</span><span>BRAND</span><span>TRANSAKSI</span><span>LAINNYA</span></div>';
function ph(inner,withSheet){return `<div class="ph"><div class="sc" onclick="sheetClose(event)">${inner}</div>${withSheet?SHEET(P[2]):''}${BAR}</div>`}
window.sheetOpen=()=>document.getElementById('sh')?.classList.add('on');window.sheetClose=e=>{if(e.target.closest('[data-open]'))return;document.getElementById('sh')?.classList.remove('on')};
const FULL=`<div class="card hs"><table><thead><tr><th>SALES</th><th>TARGET</th><th>AKTUAL</th><th>ACH</th><th>PROY</th><th>RUN</th><th>BUTUH</th><th>STATUS</th></tr></thead><tbody>${P.map(r=>`<tr data-open onclick="sheetOpen()"><td><b>${r[0]}</b></td><td class="n">${f(r[3])}</td><td class="n"><b>${f(r[4])}</b></td><td class="n">${pc(r[5])}</td><td class="n">${pc(r[6])}</td><td class="n">${(r[4]/12).toFixed(1).replace('.',',')}</td><td class="n">${f(Math.round(r[3]*(1-r[5]/100)/2))}</td><td>${st(r[7])}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total · 89</td><td class="n">35.351</td><td class="n">16.206</td><td class="n">42,3%</td><td class="n">45,8%</td><td class="n">1.350</td><td class="n">9.573</td><td></td></tr></tfoot></table></div>`;
const LIST=`<div class="card"><div class="row" style="background:#F7F9FB"><span></span><b style="font-size:10px">URUT RISIKO · 5 teratas dari 89</b><span></span></div>${P.slice(0,5).map((r,i)=>`<div class="row" data-open onclick="sheetOpen()"><span>${i+1}</span><div><b>${r[0]}</b><small>${r[1]} · ach ${pc(r[5])}</small></div>${st(r[7])}</div>`).join('')}<div class="more">LIHAT SEMUA 89 SALES ›</div></div>`;
const O={now:['SEKARANG (gambaran masalah)','Di HP sekarang halaman memakai kode lama: toolbar 5 filter bertumpuk (Tingkat, Brand, Big Region, Region, Sub Region), banner/kartu besar, lalu 3 panel panjang. Layar pertama habis untuk filter dan kartu sebelum ada data Sales. Ini yang membuat terasa berantakan dan tinggi.',()=>ph(`<div style="background:#0D5BA8;color:#fff;border-radius:12px;padding:12px;margin-bottom:8px"><b style="font-size:17px">TIM</b><br><small>Pencapaian tim dan perbandingan periode</small></div>${['TINGKAT  Sales','BRAND  ITEL','BIG REGION  Semua','REGION  Semua','SUB REGION  Semua'].map(x=>`<div class="card" style="padding:9px 12px;margin-bottom:6px;font-weight:700">${x}</div>`).join('')}<div class="tall">⇣ 4 kartu ringkasan besar (±300px) ⇣</div><div class="tall">⇣ panel Early Warning: kontrol + tabel lebar ⇣</div>`)],
a:['A · PADAT + DAFTAR RISIKO + LEMBAR BAWAH','Satu tombol FILTER oren (isi filter di dalamnya, chip aktif di bawahnya). Ringkasan jadi 4 kartu <b>pendek 2×2</b> (±90px total). Tab 3 segmen. Early Warning = <b>daftar 5 teratas</b> (nama, ASM, ach, status); <b>ketuk baris → lembar rincian naik dari bawah</b> (kartu, tren, tabel brand, tombol LIHAT DETAIL KPI) menggantikan panel rincian besar. Tombol "LIHAT SEMUA" membuka tabel lengkap padat. Coba ketuk salah satu baris.',()=>ph(`${HEAD}${FB}<div class="chips"><span>ITEL</span><span>Jawa Timur ✕</span><span>Sales</span></div>${M4}${TABS}${SEG}${LIST}`,true)],
b:['B · RINGKASAN SATU BARIS + TABEL PADAT','Ringkasan hanya <b>satu baris strip</b> (4 angka, ±44px). Early Warning langsung <b>tabel padat</b> yang bisa digeser (kolom SALES menempel), tanpa daftar terpisah; ketuk baris → lembar rincian. Paling banyak data per layar, tapi tidak ada "5 teratas" terpisah (tabel sudah urut risiko).',()=>ph(`${HEAD}${FB}<div class="strip"><div><b>5/89</b><small>Tembus</small></div><div><b style="color:#A3282A">34</b><small>Tertinggal</small></div><div><b style="color:#8A6200">3</b><small>Mengejar</small></div><div><b>21.156</b><small>Gap tim</small></div></div>${TABS}${SEG}<div class="lbl">URUT RISIKO · geser ke samping ↔</div>${FULL}`,true)],
c:['C · RINGKASAN BISA DIGESER + DAFTAR + TABEL','Ringkasan = <b>kartu mint yang digeser ke samping</b> (satu baris, ±56px) supaya tidak makan tinggi. Di bawahnya daftar 5 teratas lalu tabel lengkap padat dalam kartu yang sama. Rincian tetap lembar bawah. Paling lengkap, tapi layar pertama sedikit lebih panjang dari A dan B.',()=>ph(`${HEAD}${FB}<div class="sc2"><div><small>Tembus</small><b>5 / 89</b></div><div class="r"><small>Tertinggal</small><b>34</b></div><div class="y"><small>Mengejar</small><b>3</b></div><div><small>Gap tim</small><b>21.156</b></div></div>${TABS}${SEG}${LIST}<div class="lbl">SEMUA SALES · TABEL LENGKAP</div>${FULL}`,true)]};

window._hp=window._hp??0;window._hi=window._hi??'ST';
const gh=(a,l)=>{const d=a-l,u=d>=0;return `<span class="gch ${u?'u':'d'}">${u?'▲':'▼'} ${pc(Math.abs(l?d/l*100:0))}</span>`};
const L=(r,i)=>Math.round(r[4]*(i%2?.9:1.12))+3;
const PTB=`<div class="jump"><span class="on">SELL THRU</span><span>DEALER AKTIF</span><span>NOO</span><span>SELL OUT</span><span>OMZET</span></div><div class="hnt">↔ geser ke samping · ketuk chip untuk loncat · kolom NAMA menempel</div><div class="card hs"><table style="min-width:880px"><thead><tr><th rowspan="2">NAMA</th><th class="g1 gc" colspan="5">SELL THRU</th><th class="g2 gc bs" colspan="5">DEALER AKTIF</th><th class="g3 gc bs" colspan="2">NOO</th><th class="g4 gc bs">SO</th><th class="g5 gc bs">OMZET</th></tr><tr>${['TARGET','AKTUAL','%ACHV','LMTD','GROWTH','TARGET','AKTUAL','%ACHV','LMTD','GROWTH','TARGET','AKTUAL','AKTUAL','AKTUAL'].map((x,k)=>`<th class="${[0,5,10,12,13].includes(k)?'bs':''}">${x}</th>`).join('')}</tr></thead><tbody>${P.slice(0,6).map((r,i)=>`<tr><td><b>${r[0]}</b></td><td class="n bs">${f(r[3])}</td><td class="n"><b>${f(r[4])}</b></td><td class="n">${pc(r[5])}</td><td class="n">${f(L(r,i))}</td><td>${gh(r[4],L(r,i))}</td><td class="n bs">${20+i}</td><td class="n"><b>${14+i}</b></td><td class="n">${pc(60+i*6)}</td><td class="n">${15+i%3*2}</td><td>${gh(14+i,15+i%3*2)}</td><td class="n bs">0</td><td class="n">${i%3}</td><td class="n bs">${100+i*40}</td><td class="n bs">Rp ${f(200+i*140)} jt</td></tr>`).join('')}</tbody><tfoot><tr><td>Total · 89</td><td class="n bs">35.351</td><td class="n">16.206</td><td class="n">45,8%</td><td class="n">16.702</td><td>${gh(16206,16702)}</td><td class="n bs">1.080</td><td class="n">761</td><td class="n">70,5%</td><td class="n">643</td><td>${gh(761,643)}</td><td class="n bs">0</td><td class="n">60</td><td class="n bs">1</td><td class="n bs">Rp 24,6 M</td></tr></tfoot></table></div>`;
const BRN=['ITEL','MOTOPAD','MOTOROLA','VILLAON'];
