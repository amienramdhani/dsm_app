<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>DSM · Cross-sell matriks: kolom dipisah</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#F3F6FA;color:#15232E;font-size:12px}
.top{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #DDE3EA;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:#CBD5E0;border-radius:999px;padding:3px}.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font:700 11px Inter,sans-serif;cursor:pointer;color:#33414D}
.seg button.on{background:#fff;color:#10394E;box-shadow:0 1px 3px #0002}
.note{margin:10px 14px;background:#fff;border-left:4px solid #F0A400;padding:9px 12px;border-radius:8px;font-size:12px;line-height:1.5}
#stage{margin:0 auto;padding:0 14px 40px}#stage.dsk{max-width:1400px}#stage.hp{max-width:390px}
.panel{background:#fff;border-radius:12px;box-shadow:0 1px 4px #0001;overflow:hidden}
.ph{padding:9px 14px;border-bottom:1px solid #EEF0F5}.ph h3{margin:0;font-size:13px;color:#10394E}.ph small{color:#6B7785;font-size:11px}
.pb{padding:10px 12px}.lg{display:flex;gap:12px;font-size:10.5px;color:#4A5663;margin-bottom:6px;flex-wrap:wrap}.lg i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sc{overflow:auto;border:1px solid #D5DCE4;border-radius:6px}table{border-collapse:separate;border-spacing:0;width:100%}
.n{text-align:right}.mx{text-align:center}.mx.y{background:#DDEBFA}.mx.p{background:#FFF3DC;outline:1.5px dashed #E0A93A;outline-offset:-3px;color:#8A5A00;font-weight:700}.mx.g{background:#F4F6F9;color:#9AA4AF}
.lnk{color:#1E5FB8;font-weight:700}
/* SEKARANG */
.now th{background:linear-gradient(90deg,#0B5FC4,#3F4FD6);color:#fff;font-size:11px;font-weight:800;padding:0 12px;height:36px;text-align:left;white-space:nowrap}
.now td{padding:6px 12px;border-bottom:1px solid #EEF0F5;font-size:12.5px;vertical-align:middle}
.now td small{display:block;color:#6B7785;font-size:11px}.now .dn{min-width:230px;white-space:normal}.now .mx{white-space:nowrap}
/* USULAN */
.new th{background:#E6EBF1;color:#15232E;font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:5px 9px;text-align:left;white-space:nowrap;border-bottom:2px solid #15303F;border-right:1px solid #D5DCE4;position:sticky;top:0}
.new th.bh{background:var(--l);color:var(--d);border-top:3px solid var(--d);text-align:center}
.new td{padding:3px 9px;font-size:11px;height:24px;border-bottom:1px solid #E7EBF0;border-right:1px solid #EEF1F4;white-space:nowrap;font-variant-numeric:tabular-nums}
.new td.t{max-width:190px;overflow:hidden;text-overflow:ellipsis}.new td.s{max-width:130px;overflow:hidden;text-overflow:ellipsis}
.new td.k{color:#6B7785;font-size:10px}
.new tbody tr:hover td{background:#F5F8FB}.new .mx{padding:2px 6px}
.new.hpm td.dl,.new.hpm th.dl{position:sticky;left:0;z-index:2;background:#fff;box-shadow:2px 0 3px #0001}.new.hpm th.dl{background:#E6EBF1;z-index:3}
.new.hpm td.dl{max-width:none;overflow:visible;text-overflow:clip;font-size:10.5px}.new.hpm td.s{max-width:none;overflow:visible}.new.hpm td{font-size:10.5px}
.dots{display:inline-flex;gap:2px;vertical-align:middle}.dots i{width:9px;height:9px;border-radius:2px}.dots i.off{background:#E3E8EE}.dn2{margin-left:6px;font-size:10.5px}.pbar{display:inline-block;width:46px;height:7px;background:#E3E8EE;border-radius:4px;vertical-align:middle;overflow:hidden}.pbar i{display:block;height:100%}.bdg{display:inline-block;min-width:34px;text-align:center;border-radius:5px;padding:1px 7px;font-weight:800;font-size:10.5px;border:1px solid}.new td.bv{white-space:nowrap}
</style></head><body>
<div class="top"><b>Cross-sell · matriks dealer × brand</b><div class="seg" id="m"><button data-v="now">SEKARANG</button><button data-v="new" class="on">USULAN</button></div><div class="seg" id="b"><button data-b="plain">POLOS</button><button data-b="dots">TITIK BRAND</button><button data-b="bar">BAR</button><button data-b="badge" class="on">BADGE WARNA</button></div><div class="seg" id="w"><button data-v="dsk" class="on">DESKTOP</button><button data-v="hp">HP</button></div></div>
<div class="note" id="note"></div><div id="stage" class="dsk"></div>
<script>
const BR=[['MOTOROLA','#1E5FB8','#E3EEFB'],['REALME','#2E7D32','#E5F4E6'],['TECNO','#B4204F','#FCE7EE'],['INFINIX','#7A5B00','#FFF4D6'],['ITEL','#0E6E64','#E2F4F1'],['SAMSUNG','#1B3F8F','#E4EAF7'],['VILLAON','#455A64','#E9EEF1']];
const D=[['317.811','PT.AGRES INFO TEKNOLOGI','JABODETABEK 1','RIDHO ALFIAN',42,[18,9,'p6',4,'-',2,2]],['005.094','CV MANDIRI JAYA MAKMUR','JABODETABEK 1','RIDHO ALFIAN',31,[12,'p4',7,'p3',6,'-','-']],['RISM2','RISM JAYA BARU','JABAR UTARA','RIDWAN NOOR MARLIAWAN',28,[10,8,'p5','-',5,'p2','p3']],['032.003','PT. SINAR ARTHA MAHAMAKMUR','JABODETABEK 1','RIDHO ALFIAN',26,['p5',11,6,'-','-',3,3]],['RISM4','RISM SINARMAS','JATENG','EKO PRASETYO',22,[9,'p3',4,5,'-','-','-']],['320.218','PT. CIPTA ARYA EKA SARANA','JABODETABEK 2','ARIFIN SORMANDANI',19,[8,6,'p3','-',3,'-','-']],['RISM1','RISM COMPLETE','JABODETABEK 1','PURNAMA RUDIARTO',17,['p4','-',5,3,'p2',4,4]],['319.047','PT. MANUNGGAL UTAMA MANDIRI','JABODETABEK 1','RIDHO ALFIAN',15,[7,'p2','-',4,2,'-','-']],['RISM3','RISM PERTEMUAN','JABAR UTARA','HASAN NURDIN',14,['-',5,'p3',3,'p2',1,1]],['008.110','PT. THRONE SUKSES MAKMUR','JABAR UTARA','IMAM FAISAL',12,[5,4,'-','p2',3,'-','-']]];
const S={m:'new',w:'dsk',b:'badge'};const $=s=>document.querySelector(s);
const cell=c=>c==='-'?'<td class="mx g">–</td>':String(c)[0]==='p'?`<td class="mx p">+${String(c).slice(1)}</td>`:`<td class="mx y">${c}</td>`;
function tbl(){const cnt=d=>d[5].filter(c=>c!=='-'&&String(c)[0]!=='p').length;const bv=d=>{const n=cnt(d),t=BR.length;if(S.b==='plain')return `<b>${n}</b>/${t}`;if(S.b==='dots')return `<span class="dots">${d[5].map((c,i)=>c!=='-'&&String(c)[0]!=='p'?`<i style="background:${BR[i][1]}" title="${BR[i][0]}"></i>`:`<i class="off" title="${BR[i][0]} belum"></i>`).join('')}</span><b class="dn2">${n}/${t}</b>`;if(S.b==='bar'){const c=n>=5?'#12A86B':n>=3?'#E0A93A':'#D2453F';return `<span class="pbar"><i style="width:${n/t*100}%;background:${c}"></i></span><b class="dn2">${n}/${t}</b>`}const k=n>=5?['#E5F6EE','#176d48','#bce3cd']:n>=3?['#FFF3D6','#925c00','#EFDA9F']:['#FCE9E8','#b43138','#F1C0C1'];return `<span class="bdg" style="background:${k[0]};color:${k[1]};border-color:${k[2]}">${n}/${t}</span>`};
 if(S.m==='now')return `<div class="now"><div class="sc"><table><tr><th>Dealer</th><th class="n">Unit/bln</th>${BR.map(b=>`<th class="mx">${b[0]}</th>`).join('')}<th>Brand</th></tr>${D.map(d=>`<tr><td class="dn"><span style="color:#6B7785">${d[0]} –</span> <span class="lnk">${d[1]}</span><small>${d[2]} · ${d[3]}</small></td><td class="n"><b>${d[4]}</b></td>${d[5].map(cell).join('')}<td><b>${cnt(d)}</b>/7</td></tr>`).join('')}</table></div></div>`;
 const hp=S.w==='hp';
 return `<div class="new ${hp?'hpm':''}"><div class="sc"><table><thead><tr>${hp?'':'<th>KODE</th>'}<th class="dl">${hp?'DEALER':'DEALER'}</th><th>SUB REGION</th><th>SALES</th><th class="n">UNIT/BLN</th>${BR.map(b=>`<th class="bh" style="--d:${b[1]};--l:${b[2]}">${b[0]}</th>`).join('')}<th>BRAND</th></tr></thead><tbody>${D.map(d=>`<tr>${hp?'':`<td class="k">${d[0]}</td>`}<td class="t dl"><span class="lnk" title="${d[0]} · ${d[1]}">${d[1]}</span></td><td>${d[2]}</td><td class="s" title="${d[3]}">${d[3]}</td><td class="n"><b>${d[4]}</b></td>${d[5].map(cell).join('')}<td class="bv">${bv(d)}</td></tr>`).join('')}</tbody></table></div></div>`}
function render(){$('#stage').className=S.w;$('#note').innerHTML=S.m==='now'?'<b>SEKARANG</b>: kode, nama, kota dan sales ditumpuk di 1 kolom Dealer, tinggi baris ±45–65px (nama sales panjang bisa 3 baris).':'<b>USULAN</b>: kolom dipisah <b>KODE · DEALER · SUB REGION · SALES</b>, tiap dealer <b>1 baris</b> (±24px). Di desktop nama/sales panjang dipotong "…" (lengkap di tooltip). '+(S.w==='hp'?'<b>HP</b>: nama dealer &amp; sales <b>tampil penuh, tidak dipotong</b>; kolom DEALER menempel kiri (sticky), sisanya digeser ke samping. Kolom KODE disatukan ke tooltip supaya muat.':'<b>Desktop</b>: semua kolom kelihatan. Header brand berwarna, warna kotak matriks tidak berubah.')+'<br><b>Kolom BRAND</b> (pilih di bar atas): POLOS = 3/7 seperti sekarang · TITIK BRAND = 1 kotak kecil per brand, berwarna brand kalau sudah diambil (kelihatan brand mana yang kosong tanpa melirik matriks) · BAR = batang kecil + angka · BADGE WARNA = hijau ≥5, kuning 3–4, merah ≤2 brand diambil (batas contoh, bisa diatur).<br><span style="color:#6B7785">Cakupan: hanya tabel Matriks dealer × brand di Cross-sell. Top peluang, KPI, tab lain tidak disentuh. Data contoh.</span>';
 $('#stage').innerHTML=`<div class="panel"><div class="ph"><h3>Matriks dealer × brand</h3><small>Klik kotak kuning untuk detail &amp; WhatsApp</small></div><div class="pb"><div class="lg"><span><i style="background:#DDEBFA"></i>Sudah ambil (unit/bln, 3 bln)</span><span><i style="background:#FFF3DC;border:1.5px dashed #E0A93A"></i>Peluang (klik)</span><span><i style="background:#F4F6F9"></i>Belum ada pembanding</span></div>${tbl()}</div></div>`;
 document.querySelectorAll('#m button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.m));document.querySelectorAll('#w button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.w))}
document.addEventListener('click',e=>{const bb=e.target.closest('[data-b]');if(bb){S.b=bb.dataset.b;document.querySelectorAll('#b button').forEach(x=>x.classList.toggle('on',x===bb));render();return}const b=e.target.closest('[data-v]');if(!b)return;if(b.closest('#m'))S.m=b.dataset.v;else S.w=b.dataset.v;render()});render();
</script></body></html>
