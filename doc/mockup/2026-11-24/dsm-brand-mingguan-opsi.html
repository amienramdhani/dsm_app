</style></head><body>
<div class="mode"><button data-m="d" class="on">Desktop</button><button data-m="m">HP</button><b>Tabel</b><button data-t="A" class="on">A · 3 blok (ST · SO · %SO/ST)</button><button data-t="B">B · pilih satu indikator</button><button data-t="C">C · per minggu ST / SO bertumpuk</button><button data-o="1">Lihat SEKARANG</button><small>Data contoh · belum dipasang ke app</small></div>
<div class="frame" id="f"></div>
<script>
const W=['W1','W2','W3','W4','W5'],WD=['1–7','8–14','15–21','22–28','29–30'],CUR=3,FUT=4;
const TY=[['A100C','3GB 64GB',[3210,4120,3900,2610],[2980,3640,3720,2100]],['A100C','4GB 64GB',[1800,2010,2230,1500],[1650,1980,1870,1280]],['A100C','3GB 32GB',[900,820,760,410],[1010,790,700,450]],['P80','4GB 128GB',[640,710,690,420],[520,600,610,300]],['VISTAB 30GT','8GB 128GB',[150,180,210,120],[60,90,120,70]],['S26 ULTRA','8GB 256GB',[80,95,70,40],[30,40,52,22]]];
const f=x=>x.toLocaleString('id-ID');let mob=false,TB='A',old=false,met='ST',sel=-1,VW='T';
const SL=[['ASM BUDI',[['EKO PRASETYO',[1200,1500,1450,980],[1100,1390,1400,820]],['TOYO',[640,700,690,430],[600,650,610,380]],['RINI',[300,280,260,150],[310,260,240,130]]]],['ASM DEDI',[['SUSILA SODIKIN',[1900,2200,2250,1500],[1780,2010,2050,1240]],['AZWAR',[700,820,810,520],[640,760,770,450]]]],['ASM RUDI',[['EKI HERDIYAN',[1600,1800,1720,1100],[1500,1700,1600,950]],['JOHAN ARIF',[440,635,680,420],[320,371,402,252]]]]];
const sum=a=>a.reduce((x,y)=>x+y,0),pc=(st,so)=>st?so/st*100:null;
const sp=(st,so)=>{const p=pc(st,so);if(p==null)return '<span class="sp mu">—</span>';const c=p<50?'r':p<80?'y':p<=100?'g':'b';return `<span class="sp s-${c}">${Math.round(p)}%</span>`};
const tr=(v,i)=>i===0?'':v[i]>v[i-1]?'<span class="up">▲</span>':v[i]<v[i-1]?'<span class="dn">▼</span>':'';
const MOD=[...new Set(TY.map(t=>t[0]))].map(m=>{const k=TY.filter(t=>t[0]===m);return {m,k,st:[0,1,2,3].map(i=>sum(k.map(x=>x[2][i]))),so:[0,1,2,3].map(i=>sum(k.map(x=>x[3][i])))}});
const TST=[0,1,2,3].map(i=>sum(TY.map(t=>t[2][i]))),TSO=[0,1,2,3].map(i=>sum(TY.map(t=>t[3][i]))),ST=sum(TST),SO=sum(TSO);
function filt(){const o=(l,v)=>`<label>${l}<select><option>${v}</option></select></label>`;if(mob)return `<button class="mfb">FILTER<i>1 aktif</i></button><div class="fcs"><span class="fc">Region: <b>JAWA BARAT</b> ×</span></div>`;return `<div class="fa">${o('REGION','JAWA BARAT')}${o('SUB REGION','Semua')}${o('RGM','Semua')}${o('ASM','Semua')}<button class="rs">RESET</button><span style="margin-left:auto;font-size:10.5px;color:#334155;align-self:center">Filter berlaku untuk ringkasan, chart, dan tabel (PER TYPE &amp; PER SALES)</span></div>`}
function chips(){return `<div class="chips">${[['ITEL',23540],['MOTOPAD',3179],['MOTOROLA',320],['VILLAON',10361]].map((c,i)=>`<span class="chip ${i?'':'on'}">${c[0]}<small>${f(c[1])}</small></span>`).join('')}</div>`}
function summ(){const p=Math.round(SO/ST*100),bw=TST.indexOf(Math.max(...TST)),low=MOD.map(m=>({m:m.m,p:pc(sum(m.st),sum(m.so))})).sort((a,b)=>a.p-b.p)[0],big=MOD.slice().sort((a,b)=>sum(b.st)-sum(a.st))[0];
 if(mob)return `<div class="ms"><div class="r"><div><span class="l">SELL THRU MTD</span><b>${f(ST)}</b></div><div><span class="l">SELL OUT MTD</span><b>${f(SO)}</b></div><span class="pill p-g">${p}%<small style="font-size:10px;margin-left:4px">SO/ST</small></span></div><ul><li><span>MINGGU ST TERTINGGI</span><b>${W[bw]}</b> ${f(TST[bw])}</li><li><span>MODEL ST TERBESAR</span><b>${big.m}</b> ${f(sum(big.st))}</li><li><span>% SO/ST TERENDAH</span><b>${low.m}</b> <em style="font-style:normal;color:#C0322C;font-weight:700">${Math.round(low.p)}%</em></li></ul></div>`;
 return `<div class="sa"><div class="nums"><div class="n"><span>SELL THRU MTD</span><b>${f(ST)}</b></div><div class="n"><span>SELL OUT MTD</span><b>${f(SO)}</b></div><div class="n"><span>% SO/ST</span><span class="pill p-g">${p}%</span></div></div><div class="ins"><div><span>MINGGU ST TERTINGGI</span><b>${W[bw]} (${WD[bw]})</b><em>${f(TST[bw])} unit</em></div><div><span>MODEL ST TERBESAR</span><b>${big.m}</b><em>${f(sum(big.st))} unit · ${Math.round(sum(big.st)/ST*100)}% kontribusi</em></div><div><span>% SO/ST TERENDAH</span><b>${low.m}</b><em style="color:#C0322C">${Math.round(low.p)}%</em></div></div></div>`}
function chart(){const w=mob?360:1100,h=mob?220:230,L=40,R=40,T=30,B=36,pw=w-L-R,ph=h-T-B,mx=Math.max(...TST,...TSO)*1.45,gw=pw/5,bw=Math.min(36,gw*.28);let s='';
 for(let i=0;i<4;i++){const y=T+ph-ph*i/3;s+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="#E6EBF1"/><text x="${L-5}" y="${y+3}" font-size="9.5" text-anchor="end" fill="#475569">${f(Math.round(mx*i/3))}</text>`}
 const pts=[];const yP=v=>T+ph*0.08+(ph*0.5)*(1-v/120);W.forEach((x,i)=>{const cx=L+gw*i+gw/2;if(i===FUT){s+=`<text x="${cx}" y="${T+ph/2}" font-size="10" text-anchor="middle" fill="#64748b">belum jalan</text>`}else{const a=ph*TST[i]/mx,b=ph*TSO[i]/mx,c=i===CUR;s+=`<rect x="${cx-bw-1}" y="${T+ph-a}" width="${bw}" height="${a}" rx="3" fill="${c?'#1E5FB8':'#9CC0E6'}"/><rect x="${cx+1}" y="${T+ph-b}" width="${bw}" height="${b}" rx="3" fill="${c?'#C25A12':'#EDB48E'}"/><text x="${cx-bw/2}" y="${T+ph-a-4}" font-size="9.5" font-weight="700" text-anchor="middle">${f(TST[i])}</text><text x="${cx+bw/2}" y="${T+ph-b-4}" font-size="9.5" font-weight="700" text-anchor="middle">${f(TSO[i])}</text>`;pts.push([cx,T+6+18*(1-pc(TST[i],TSO[i])/120),pc(TST[i],TSO[i])])}
 s+=`<text x="${cx}" y="${h-20}" font-size="10" font-weight="700" text-anchor="middle">${x}</text><text x="${cx}" y="${h-8}" font-size="9" text-anchor="middle" fill="#475569">${WD[i]}${i===CUR?' · MTD':''}</text>`});
 s+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="#0E7C6B" stroke-width="1.8" stroke-dasharray="5 4"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#0E7C6B"/><text x="${p[0]+16}" y="${p[1]+4}" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0E7C6B" stroke="#fff" stroke-width="3" paint-order="stroke">${Math.round(p[2])}%</text>`).join('');
 return `<div class="pn"><h4>TREN MINGGUAN<small>ST vs SO per minggu · garis atas = % SO/ST</small></h4><div class="lg"><span><i style="background:#1E5FB8"></i>SELL THRU</span><span><i style="background:#C25A12"></i>SELL OUT</span><span><i style="background:#0E7C6B;border-radius:50%"></i>% SO/ST</span></div><svg viewBox="0 0 ${w} ${h}">${s}</svg></div>`}
const ST_C='#1E5FB8',SO_C='#C25A12',PC='#0E7C6B';
const wcell=(v,i)=>i===FUT?'<span class="mu">—</span>':f(v[i])+tr(v,i);
function rowsOf(fn){if(VW==='S'){let h='';SL.forEach(([g,rs])=>{const st=[0,1,2,3].map(i=>rs.reduce((a,r)=>a+r[1][i],0)),so=[0,1,2,3].map(i=>rs.reduce((a,r)=>a+r[2][i],0));h+=fn(g,st,so,'grp');rs.forEach(r=>h+=fn(r[0],r[1],r[2],'kid'))});const st=[0,1,2,3].map(i=>SL.reduce((a,[g,rs])=>a+rs.reduce((b,r)=>b+r[1][i],0),0)),so=[0,1,2,3].map(i=>SL.reduce((a,[g,rs])=>a+rs.reduce((b,r)=>b+r[2][i],0),0));return h+fn('TOTAL',st,so,'tt')}let h='';MOD.forEach((m,mi)=>{h+=fn(m.m+(mi===0?'<span class="top">TOP ST</span>':''),m.st,m.so,'grp');if(m.k.length>1)m.k.forEach(k=>h+=fn(k[1],k[2],k[3],'kid'))});return h+fn('TOTAL',TST,TSO,'tt')}
function tA(){const hd=(lab,c)=>`<th colspan="7" class="gs" style="--c:${c}">${lab}</th>`,wk=c=>W.map((x,i)=>`<th class="${i?'':'gs'} ${i===CUR?'cur':''}" style="--c:${c}">${x}<small>${WD[i]}</small></th>`).join('');
 let h=`<table><thead><tr><th class="id" rowspan="2">${VW==='S'?'SALES':'TYPE'}</th>${hd('SELL THRU',ST_C)}${hd('SELL OUT',SO_C)}<th colspan="6" class="gs" style="--c:${PC}">% SO/ST</th></tr><tr>${wk(ST_C)}<th style="--c:${ST_C}">TOTAL MTD</th><th style="--c:${ST_C}">% KONTRIB.</th>${wk(SO_C)}<th style="--c:${SO_C}">TOTAL MTD</th><th style="--c:${SO_C}">% KONTRIB.</th>${wk(PC)}<th style="--c:${PC}">TOTAL MTD</th></tr></thead><tbody>`;
 h+=rowsOf((n,st,so,c)=>{const S=[...st,0],O=[...so,0];return `<tr class="${c}"><td class="l">${c==='grp'?'▾ ':''}${n}</td>${W.map((x,i)=>`<td class="${i?'':'gs'} ${i===CUR?'cur':''}">${wcell(S,i)}</td>`).join('')}<td><b>${f(sum(st))}</b></td><td>${Math.round(sum(st)/ST*100)}%</td>${W.map((x,i)=>`<td class="${i?'':'gs'} ${i===CUR?'cur':''}">${wcell(O,i)}</td>`).join('')}<td><b>${f(sum(so))}</b></td><td>${Math.round(sum(so)/SO*100)}%</td>${W.map((x,i)=>`<td class="${i?'':'gs'} ${i===CUR?'cur':''}">${i===FUT?'<span class="mu">—</span>':sp(S[i],O[i])}</td>`).join('')}<td>${sp(sum(st),sum(so))}</td></tr>`});
 return `<div class="tw">${h}</tbody></table></div>`}
function tB(){const c=met==='ST'?ST_C:met==='SO'?SO_C:PC,lab={ST:'SELL THRU',SO:'SELL OUT',P:'% SO/ST'}[met];
 let h=`<div class="bar"><span class="seg">${[['ST','SELL THRU'],['SO','SELL OUT'],['P','% SO/ST']].map(x=>`<span data-me="${x[0]}" class="${met===x[0]?'on':''}">${x[1]}</span>`).join('')}</span></div><div class="tw"><table><thead><tr><th class="id" rowspan="2">${VW==='S'?'SALES':'TYPE'}</th><th colspan="${met==='P'?6:7}" class="gs" style="--c:${c}">${lab}</th></tr><tr>${W.map((x,i)=>`<th class="${i?'':'gs'} ${i===CUR?'cur':''}" style="--c:${c}">${x}<small>${WD[i]}</small></th>`).join('')}<th style="--c:${c}">TOTAL MTD</th>${met==='P'?'':`<th style="--c:${c}">% KONTRIB.</th>`}</tr></thead><tbody>`;
 h+=rowsOf((n,st,so,cl)=>{const S=[...st,0],O=[...so,0],v=met==='ST'?S:O,t=met==='ST'?ST:SO;return `<tr class="${cl}" data-ty="${n.replace(/<.*/,'')}"><td class="l">${cl==='grp'?'▾ ':''}${n}</td>${W.map((x,i)=>`<td class="${i?'':'gs'} ${i===CUR?'cur':''}">${i===FUT?'<span class="mu">—</span>':met==='P'?sp(S[i],O[i]):wcell(v,i)}</td>`).join('')}<td>${met==='P'?sp(sum(st),sum(so)):'<b>'+f(sum(met==='ST'?st:so))+'</b>'}</td>${met==='P'?'':`<td>${Math.round(sum(met==='ST'?st:so)/t*100)}%</td>`}</tr>`});
 return h+'</tbody></table></div>'}
function tC(){let h=`<div class="tw"><table><thead><tr><th class="id" rowspan="2">${VW==='S'?'SALES':'TYPE'}</th>${W.map((x,i)=>`<th class="gs ${i===CUR?'cur':''}" style="--c:${i===CUR?'#F0A400':'#64748B'}">${x} · ${WD[i]}</th>`).join('')}<th class="gs" style="--c:#9A6400">TOTAL MTD</th><th class="gs" style="--c:#9A6400">% KONTRIB. ST</th></tr><tr>${W.map((x,i)=>`<th class="gs" style="--c:${i===CUR?'#F0A400':'#64748B'}">ST · <span style="color:${SO_C}">SO</span> · %</th>`).join('')}<th class="gs" style="--c:#9A6400">ST · <span style="color:${SO_C}">SO</span> · %</th><th style="--c:#9A6400"></th></tr></thead><tbody>`;
 const cb=(st,so)=>`<div class="cb"><b>${f(st)}</b><span>${f(so)}</span></div>`;
 h+=rowsOf((n,st,so,cl)=>`<tr class="${cl}"><td class="l">${cl==='grp'?'▾ ':''}${n}</td>${W.map((x,i)=>`<td class="gs ${i===CUR?'cur':''}">${i===FUT?'<span class="mu">—</span>':`<div style="display:flex;gap:8px;justify-content:flex-end;align-items:center">${cb(st[i],so[i])}${sp(st[i],so[i])}</div>`}</td>`).join('')}<td class="gs"><div style="display:flex;gap:8px;justify-content:flex-end;align-items:center">${cb(sum(st),sum(so))}${sp(sum(st),sum(so))}</div></td><td>${Math.round(sum(st)/ST*100)}%</td></tr>`);
 return h+'</tbody></table></div>'}
function mtable(){const c=met==='ST'?ST_C:met==='SO'?SO_C:PC;let h=`<div class="bar" style="margin-bottom:6px"><span class="seg">${[['T','PER TYPE'],['S','PER SALES']].map(x=>`<span data-vw="${x[0]}" class="${VW===x[0]?'on':''}">${x[1]}</span>`).join('')}</span></div><div class="bar"><span class="seg" style="width:100%;display:flex">${[['ST','SELL THRU'],['SO','SELL OUT'],['P','% SO/ST']].map(x=>`<span style="flex:1;text-align:center" data-me="${x[0]}" class="${met===x[0]?'on':''}">${x[1]}</span>`).join('')}</span></div><div class="tw"><table><thead><tr><th class="id" rowspan="2">${VW==='S'?'SALES':'TYPE'}</th><th colspan="5" class="gs" style="--c:${c}">${{ST:'SELL THRU',SO:'SELL OUT',P:'% SO/ST'}[met]}</th></tr><tr>${W.slice(0,4).map((x,i)=>`<th class="${i?'':'gs'} ${i===CUR?'cur':''}" style="--c:${c}">${x}</th>`).join('')}<th style="--c:${c}">MTD</th></tr></thead><tbody>`;
 h+=rowsOf((n,st,so,cl)=>{const v=met==='ST'?st:so;return `<tr class="${cl}" data-ty="${n.replace(/<.*/,'')}" style="cursor:pointer"><td class="l">${n.replace(/<span class="top">TOP ST<\/span>/,'')}</td>${[0,1,2,3].map(i=>`<td class="${i?'':'gs'} ${i===CUR?'cur':''}">${met==='P'?sp(st[i],so[i]):f(v[i])+tr(v,i)}</td>`).join('')}<td>${met==='P'?sp(sum(st),sum(so)):'<b>'+f(sum(v))+'</b>'}</td></tr>`});
 return h+'</tbody></table></div><div class="note">W5 (29–30) belum jalan, disembunyikan di HP · ketuk type untuk rincian ST/SO per minggu</div>'}
function sheet(n){let st,so;if(VW==='S'){const g=SL.find(x=>x[0]===n);if(g){st=[0,1,2,3].map(i=>g[1].reduce((a,r)=>a+r[1][i],0));so=[0,1,2,3].map(i=>g[1].reduce((a,r)=>a+r[2][i],0));}else{const r=SL.flatMap(x=>x[1]).find(x=>x[0]===n);if(!r)return '';st=r[1];so=r[2];}}else{const m=MOD.find(x=>x.m===n),k=TY.find(x=>x[1]===n);if(!m&&!k)return '';st=m?m.st:k[2];so=m?m.so:k[3];}return `<div class="gr"></div><h5>${n}</h5><div class="sr"><span class="h">MINGGU</span><span class="h">ST</span><span class="h">SO</span><span class="h">% SO/ST</span>${[0,1,2,3].map(i=>`<span>${W[i]} · ${WD[i]}</span><span>${f(st[i])}</span><span>${f(so[i])}</span>${sp(st[i],so[i])}`).join('')}<b>TOTAL MTD</b><b>${f(sum(st))}</b><b>${f(sum(so))}</b>${sp(sum(st),sum(so))}</div><button class="x" id="cl">TUTUP</button>`}
function oldv(){return `<div class="cap">SEKARANG</div><div class="old"><div class="ob"><b>▾ RINCIAN MINGGUAN PER TYPE · ST/SO</b><div class="k3"><div>SELL THRU MTD</div><div>SELL OUT MTD</div><div>% SO/ST</div></div><div class="ch">chart ST / SO per minggu</div><div class="tb">tabel 21 kolom: ST W1–W5 + total + kontribusi · SO W1–W5 + total + kontribusi · %SO/ST W1–W5 + total</div></div></div><div class="cap">USULAN</div>`}
function draw(){const F=document.getElementById('f');F.className='frame'+(mob?' mob':'');
 F.innerHTML=`<div class="tabs"><span>RINGKASAN</span><span>GROWTH</span><span class="on">MINGGUAN</span></div>`+(old&&!mob?oldv():'')+chips()+filt()+summ()+chart()+(mob?mtable():`<div class="pn" style="padding-bottom:6px"><h4>RINCIAN MINGGUAN ${VW==='S'?'PER SALES':'PER TYPE'}<small>klik model untuk buka varian · ▲▼ = dibanding minggu sebelumnya · minggu berjalan disorot kuning</small></h4><div class="bar"><span class="seg">${[['T','PER TYPE'],['S','PER SALES']].map(x=>`<span data-vw="${x[0]}" class="${VW===x[0]?'on':''}">${x[1]}</span>`).join('')}</span></div>${TB==='A'?tA():TB==='B'?tB():tC()}<div class="note">% SO/ST: &lt;50% merah · 50–79% kuning · 80–100% hijau · &gt;100% biru · minggu yang belum jalan tampil "—"</div></div>`)+'<div class="bk" id="bk"><div class="sh" id="sh"></div></div>';
 F.querySelectorAll('[data-me]').forEach(e=>e.onclick=()=>{met=e.dataset.me;draw()});F.querySelectorAll('[data-vw]').forEach(e=>e.onclick=()=>{VW=e.dataset.vw;draw()});
 if(mob)F.querySelectorAll('[data-ty]').forEach(e=>e.onclick=()=>{document.getElementById('sh').innerHTML=sheet(e.dataset.ty.replace('▾ ','').trim());document.getElementById('bk').classList.add('on');document.getElementById('cl').onclick=()=>document.getElementById('bk').classList.remove('on')});
 const bk=document.getElementById('bk');bk.onclick=e=>{if(e.target===bk)bk.classList.remove('on')}}
const grp=(a,fn)=>document.querySelectorAll(`[data-${a}]`).forEach(b=>b.onclick=()=>{fn(b.dataset[a]);document.querySelectorAll(`[data-${a}]`).forEach(x=>x.classList.toggle('on',x===b));draw()});
grp('m',v=>mob=v==='m');grp('t',v=>TB=v);document.querySelector('[data-o]').onclick=e=>{old=!old;e.target.classList.toggle('on',old);draw()};draw();
</script></body></html>
