<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transaksi · kalender & pola · opsi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#EDF0F5;color:#0f172a;font-size:12px}
.mode{position:sticky;top:0;z-index:60;display:flex;gap:6px;padding:8px 14px;background:#fff;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;align-items:center}.mode b{font-size:11px;color:#334155;margin:0 4px 0 10px}.mode button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:5px 11px;font-weight:600;cursor:pointer;font-family:inherit;font-size:11.5px}.mode button.on{background:#0B5CAD;color:#fff;border-color:#0B5CAD}.mode small{margin-left:auto;color:#334155}
.frame{margin:12px auto;max-width:1880px;padding:0 14px}.frame.mob{max-width:390px;border:1px solid #b8c2cf;border-radius:22px;padding:10px;background:#F3F5F8}
.sa{background:#fff;border:1px solid #e5e7eb;border-radius:10px;display:grid;grid-template-columns:auto 1fr;margin-bottom:10px;overflow:hidden}.sa .nums{display:flex;align-items:center;gap:22px;padding:10px 16px;border-right:1px solid #e5e7eb;background:#F8FAFC}.n span{display:block;font-size:9.5px;font-weight:700;color:#0B3F78}.n b{font-size:20px}.n small{display:block;font-size:10px;color:#334155}
.ins{display:grid;grid-template-columns:repeat(3,1fr)}.ins div{padding:9px 14px;border-left:1px solid #EEF2F6}.ins div:first-child{border:0}.ins span{display:block;font-size:9.5px;font-weight:700;color:#475569}.ins b{display:block;font-size:12.5px;margin-top:2px}.ins em{font-style:normal;font-weight:700;font-size:11.5px}.up{color:#0E7C6B}.dn{color:#C0322C}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.mk div{background:#E8F6EF;border:1px solid #D3EDE0;border-radius:10px;padding:7px 10px}.mk span{display:block;font-size:9.5px;font-weight:700;color:#24543F}.mk b{font-size:17px;color:#103B2A}.mk small{display:block;font-size:10px;color:#24543F}
.row{display:grid;grid-template-columns:1.55fr 1fr;gap:10px}.mob .row{grid-template-columns:1fr}
.pn{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 14px;margin-bottom:10px}.pn h4{margin:0 0 2px;font-size:12.5px}.pn .sub{font-size:10.5px;color:#334155;margin-bottom:8px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:#334155;margin-bottom:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal .dh{font-size:10px;font-weight:700;color:#475569;text-align:center;padding:2px 0}.cal .dh.su{color:#C0322C}
.c{border:1px solid #E2E8F0;border-radius:8px;padding:6px 8px;min-height:66px;background:#fff;position:relative;cursor:pointer}.mob .c{min-height:46px;padding:4px 5px}
.c .d{font-size:11px;font-weight:700;color:#334155}.c .u{font-size:15px;font-weight:800;text-align:right;margin-top:2px}.c .u small{font-size:10px;font-weight:600}.c .dl{font-size:10px;color:#475569;text-align:right}
.c .bar{position:absolute;left:6px;right:6px;bottom:5px;height:4px;background:#EEF2F6;border-radius:2px;overflow:hidden}.c .bar i{display:block;height:100%;border-radius:2px}
.mob .c .u{font-size:11.5px}.mob .c .dl{display:none}.mob .c .u small{display:none}
.c.off{background:repeating-linear-gradient(135deg,#F8FAFC 0 6px,#F1F5F9 6px 12px);cursor:default}.c.off .u{font-size:11px;color:#94A3B8;font-weight:600}
.c.fut{border-style:dashed;background:#FBFCFE}.c.fut .u{font-size:10.5px;color:#64748B;font-weight:600}
.c.today{outline:2px solid #0B5CAD;outline-offset:1px}
/* opsi A: putih + teks berwarna + bar */
.A .c.g .u{color:#0B8A60}.A .c.y .u{color:#B7791F}.A .c.r .u{color:#C0322C}
/* opsi B: tint lembut */
.B .c.g{background:#E9F7F0;border-color:#CBEBDB}.B .c.y{background:#FFF6E0;border-color:#F6E3B4}.B .c.r{background:#FDECEA;border-color:#F6CFCB}.B .c.g .u{color:#0B8A60}.B .c.y .u{color:#9A6400}.B .c.r .u{color:#B3322C}
/* pola hari */
.ph{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin:6px 0 4px}.ph .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.ph .v{font-size:11px;font-weight:700;margin-bottom:3px}.ph .b{width:70%;border-radius:5px 5px 0 0}.ph .lb{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}.ph2{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:11px;font-weight:600}
.chip{display:inline-block;border-radius:5px;padding:1px 6px;font-weight:700;font-size:10.5px}.chip.u{background:#E3F4EE;color:#0E7C6B}.chip.d{background:#FBE7E5;color:#C0322C}.chip.n{background:#EEF2F6;color:#64748B}
.note{font-size:10.5px;color:#334155;background:#F8FAFC;border:1px solid #EEF2F6;border-radius:7px;padding:6px 9px;margin-top:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:11.5px}th,td{padding:5px 6px;text-align:center}th{font-size:10px;font-weight:700;background:#E6EBF1;border-bottom:2px solid #15303F}th:first-child,td:first-child{text-align:left}td{border-bottom:1px solid #EEF2F6}th.su{color:#C0322C}
.ix{display:inline-block;min-width:38px;border-radius:5px;padding:1px 5px;font-weight:700;font-size:10.5px}
.tw{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
.bx{font-size:11px;background:#EEF4FB;border:1px solid #D6E3F3;border-radius:8px;padding:8px 10px;margin-top:8px;color:#0f172a;line-height:1.5}.bx b{color:#0B3F78}
.cap{font-size:10.5px;font-weight:700;color:#B4501F;margin:12px 0 6px}.old{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-bottom:8px;color:#64748b;font-size:11px}
.B2 .c.g,.B3 .c.g{background:#E9F7F0;border-color:#CBEBDB}.B2 .c.y,.B3 .c.y{background:#FFF6E0;border-color:#F6E3B4}.B2 .c.r,.B3 .c.r{background:#FDECEA;border-color:#F6CFCB}.B2 .c.g .u,.B3 .c.g .u{color:#0B8A60}.B2 .c.y .u,.B3 .c.y .u{color:#9A6400}.B2 .c.r .u,.B3 .c.r .u{color:#B3322C}
.cal.B2,.cal.B3{grid-template-columns:repeat(7,1fr) 1.05fr}.c .pc{position:absolute;top:6px;right:8px;font-size:9.5px;font-weight:800;border-radius:4px;padding:0 4px}.c.g .pc{background:#0B8A60;color:#fff}.c.y .pc{background:#F2C14E;color:#5A3D00}.c.r .pc{background:#E8908A;color:#fff}
.wk{border:1px solid #CBD5E1;border-radius:8px;background:#F1F5F9;padding:6px 8px;min-height:66px;text-align:right}.wk span{display:block;font-size:9.5px;font-weight:700;color:#475569;text-align:left}.wk b{display:block;font-size:14px;margin-top:2px}.wk em{font-style:normal;font-size:10px;font-weight:700}
.mob .wk{min-height:46px;padding:4px 5px}.mob .wk b{font-size:11px}.mob .c .pc{position:static;display:inline-block;margin-left:3px;font-size:8.5px;padding:0 3px}
.c .sb{position:absolute;left:6px;right:6px;bottom:5px;height:6px;border-radius:3px;overflow:hidden;display:flex;background:#fff}.c .sb i{display:block;height:100%}
.best{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:#0B5CAD;color:#fff;font-size:8.5px;font-weight:800;border-radius:4px;padding:0 5px;white-space:nowrap}
.mwk{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}.mwk div{background:#F1F5F9;border:1px solid #CBD5E1;border-radius:7px;padding:4px 5px;text-align:center}.mwk span{display:block;font-size:8.5px;font-weight:700;color:#475569}.mwk b{display:block;font-size:11px}.mwk em{font-style:normal;font-size:9.5px;font-weight:700}
.fa{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}.fa label{display:flex;flex-direction:column;gap:3px;font-size:9.5px;font-weight:700;color:#0B3F78}.fa select{height:30px;border:1px solid #cbd5e1;border-radius:6px;padding:0 7px;font:500 11px inherit;min-width:140px;background:#fff}.fa .rs{height:30px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:0 12px;font-weight:700;font-size:10.5px}.fa em{margin-left:auto;font-style:normal;font-size:10.5px;color:#334155;align-self:center}
.mfb{display:block;width:100%;border:0;border-radius:9px;padding:10px;font-weight:700;color:#fff;background:linear-gradient(90deg,#FFB020,#F07A0C);font-family:inherit;font-size:12.5px;margin-bottom:8px}.mfb i{font-style:normal;background:#fff;color:#C25A12;border-radius:9px;padding:0 7px;margin-left:6px;font-size:10.5px}
</style></head><body>
<div class="mode"><button data-m="d" class="on">Desktop</button><button data-m="m">HP</button><b>Kalender</b><button data-k="A" class="on">A · sel putih + angka berwarna</button><button data-k="B">B · warna lembut</button><button data-k="B2">B2 · + % target & total minggu (tanpa bar)</button><button data-o="1">Lihat SEKARANG</button><small>Data contoh · belum dipasang ke app</small></div>
<div class="frame" id="f"></div>
<script>
const f=x=>x.toLocaleString('id-ID');const TG=2137;
const D={1:[1721,192],2:[827,96],3:[691,89],4:[1067,97],5:[646,85],6:[0,0,'off'],7:[3266,187],8:[1570,110],9:[712,77],10:[949,102],11:[1204,130],12:[653,103],13:[15,4,'off'],14:[1397,122],15:[954,116],16:[1705,148],17:[1810,159],18:[2066,134],19:[819,90],20:[36,2,'off'],21:[1597,144],22:[1575,133],23:[1209,109],24:[941,89],25:[892,89],26:[698,76],27:[0,0,'off'],28:[1052,142],29:[0,0,'fut'],30:[0,0,'fut']};
let mob=false,K='A',old=false;
const cls=u=>u>=TG?'g':u>=TG*.6?'y':'r',col={g:'#0B8A60',y:'#D9A11A',r:'#D2453F'};
function strip(){if(mob)return `<div class="mk"><div><span>HARI BERTRANSAKSI</span><b>26</b><small>bulan pilihan</small></div><div><span>SELL THRU</span><b>30.072</b><small>unit device</small></div><div><span>SELL OUT</span><b>29.898</b><small>s.d. 28 Sep 2026</small></div><div><span>OMZET</span><b>Rp 48,72 M</b><small>termasuk aksesori</small></div></div>`;
 return `<div class="sa"><div class="nums"><div class="n"><span>HARI BERTRANSAKSI</span><b>26</b><small>bulan pilihan</small></div><div class="n"><span>SELL THRU</span><b>30.072</b><small>unit device</small></div><div class="n"><span>SELL OUT</span><b>29.898</b><small>s.d. 28 Sep 2026</small></div><div class="n"><span>OMZET</span><b>Rp 48,72 M</b><small>termasuk aksesori</small></div></div><div class="ins"><div><span>HARI TERTINGGI</span><b>Sen, 7 Sep</b><em>3.266 unit · 187 dealer</em></div><div><span>RATA-RATA HARI KERJA</span><b>1.157 unit</b><em class="dn">54% dari target harian 2.137</em></div><div><span>HARI CAPAI TARGET</span><b>1 dari 24 hari kerja</b><em>sisa 2 hari kerja · butuh 12.744 unit</em></div></div></div>`}
function cal(){const ext=(K==='B2'||K==='B3')&&!mob,extM=(K==='B2'||K==='B3')&&mob,BC=[['ITEL','#1E5FB8'],['MOTOPAD','#6D3FD8'],['MOTOROLA','#C25A12'],['VILLAON','#0E7C6B']],mix=d=>[.55,.12,.05,.28].map((p,i)=>p+((d*7+i*13)%10-5)/100);
 let h=`<div class="pn"><h4>KALENDER SELL THRU HARIAN</h4><div class="sub">Unit per hari · klik tanggal untuk rincian per brand</div><div class="lg"><span><i style="background:${col.g}"></i>≥ target harian (${f(TG)})</span><span><i style="background:${col.y}"></i>60–99%</span><span><i style="background:${col.r}"></i>&lt; 60%</span><span><i style="background:#fff;border:1px dashed #94A3B8"></i>sisa hari</span><span><i style="background:repeating-linear-gradient(135deg,#F1F5F9 0 3px,#CBD5E1 3px 5px)"></i>Minggu / libur</span>${K==='B3'?BC.map(b=>`<span><i style="background:${b[1]}"></i>${b[0]}</span>`).join(''):''}</div><div class="cal ${mob?'B':K}">`+['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map((d,i)=>`<div class="dh ${i==6?'su':''}">${d}</div>`).join('')+(ext?'<div class="dh">TOTAL MINGGU</div>':'')+'<div></div>';
 const wkEnd=[6,13,20,27,30];let wsum=0,wdays=0,best=7;const WK2=[];
 for(let d=1;d<=30;d++){const x=D[d],u=x[0],t=x[2];
  if(t==='off'){h+=`<div class="c off"><div class="d">${d}</div><div class="u">${u?f(u)+(mob?'':' unit'):'Libur'}</div>${u&&!mob?`<div class="dl">${x[1]} dealer</div>`:''}</div>`;wsum+=u;}
  else if(t==='fut'){h+=`<div class="c fut"><div class="d">${d}</div><div class="u">${mob?'butuh':'butuh 12.744'}</div></div>`;}
  else{const c=cls(u),pc=Math.round(u/TG*100),m=mix(d);wsum+=u;wdays++;if(extM)WK2[wkEnd.findIndex(e=>d<=e)]=(WK2[wkEnd.findIndex(e=>d<=e)]||0)+u;
   h+=`<div class="c ${c}${d===28?' today':''}">${ext&&d===best&&!mob?'<span class="best">TERTINGGI</span>':''}<div class="d">${d}${ext&&mob?`<span class="pc">${pc}%</span>`:''}</div>${ext&&!mob?`<span class="pc">${pc}%</span>`:''}<div class="u">${f(u)}${mob?'':' <small>unit</small>'}</div><div class="dl">${x[1]} dealer</div>${K==='A'?`<div class="bar"><i style="width:${Math.min(100,u/TG*100)}%;background:${col[c]}"></i></div>`:''}</div>`;}
  if(ext&&wkEnd.includes(d)){if(d===30)h+='<div></div><div></div><div></div><div></div>';const tgW=TG*(d===30?2:6),p=Math.round(wsum/tgW*100);h+=`<div class="wk"><span>${mob?'MG':'MINGGU'} ${wkEnd.indexOf(d)+1}</span><b>${f(wsum)}</b><em style="color:${p>=100?'#0B8A60':p>=60?'#9A6400':'#C0322C'}">${d===30?'berjalan':p+'% target'}</em></div>`;wsum=0;wdays=0;}}
 if(extM)h+=`</div><div class="mwk">${WK2.map((v,i)=>{const tg=TG*(i===4?2:6),p=Math.round(v/tg*100);return `<div><span>MG ${i+1}</span><b>${f(v)}</b><em style="color:${i===4?'#334155':p>=100?'#0B8A60':p>=60?'#9A6400':'#C0322C'}">${i===4?'berjalan':p+'%'}</em></div>`}).join('')}`;
 return h+'</div></div>'}
function pola(){const V=[[1828,46],[1455,16],[1113,-11],[1098,-12],[1307,5],[704,-44],[13,null]],mx=1828,N=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
 return `<div class="pn"><h4>POLA HARI PENJUALAN</h4><div class="sub">Rata-rata unit per hari · % dibanding rata-rata Senin–Sabtu</div><div class="ph">${V.map((v,i)=>`<div class="col"><div class="v">${f(v[0])}</div><div class="b" style="height:${Math.max(3,v[0]/mx*115)}px;background:${v[1]==null?'repeating-linear-gradient(135deg,#F1F5F9 0 3px,#CBD5E1 3px 5px)':v[1]>=0?'#1E5FB8':'#E8908A'}"></div></div>`).join('')}</div><div class="ph2">${N.map((n,i)=>`<div style="${i==6?'color:#C0322C':''}">${n}<br>${V[i][1]==null?'<span class="chip n">Libur</span>':`<span class="chip ${V[i][1]>=0?'u':'d'}">${V[i][1]>=0?'+':''}${V[i][1]}%</span>`}</div>`).join('')}</div><div class="note">Ada 51 unit transaksi di hari Minggu / libur (2 hari) — tidak ikut dianalisa.</div></div>`}
function brand(){const B=[['ITEL','#1E5FB8',[114,118,97,85,124,62,11]],['MOTOPAD','#6D3FD8',[132,119,66,132,109,42,0]],['MOTOROLA','#C25A12',[139,79,105,60,83,135,0]],['VILLAON','#0E7C6B',[200,114,84,79,74,49,2]]];
 const ix=v=>{const c=v>=110?['#0E7C6B','#E3F4EE']:v>=90?['#475569','#EEF2F6']:v>=1?['#C0322C','#FBE7E5']:['#94A3B8','#F8FAFC'];return `<span class="ix" style="background:${c[1]};color:${c[0]}">${v}</span>`};
 return `<div class="pn"><h4>POLA SELL THRU PER BRAND</h4><div class="sub">Indeks 100 = rata-rata hari kerja brand itu · hijau ≥110 · merah &lt;90</div><div class="tw"><table><thead><tr><th>BRAND</th>${['SEN','SEL','RAB','KAM','JUM','SAB','MIN'].map((d,i)=>`<th class="${i==6?'su':''}">${d}</th>`).join('')}</tr></thead><tbody>${B.map(b=>`<tr><td style="box-shadow:inset 4px 0 0 ${b[1]}"><b>${b[0]}</b></td>${b[2].map(v=>`<td>${ix(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="bx"><b>Senin</b> jadi hari order terbesar (+46,1% dari rata-rata hari kerja), <b>Sabtu</b> paling rendah (-43,7%). Minggu libur, tidak dianalisa.</div></div>`}
function draw(){const F=document.getElementById('f');F.className='frame'+(mob?' mob':'');const fl=mob?'<button class="mfb">FILTER<i>1 aktif</i></button>':`<div class="fa">${[['REGION','JAWA TENGAH'],['SUB REGION','Semua'],['BRAND','Semua']].map(x=>`<label>${x[0]}<select><option>${x[1]}</option></select></label>`).join('')}<button class="rs">RESET</button><em>Filter berlaku untuk ringkasan, kalender, pola hari, dan pola per brand</em></div>`;F.innerHTML=fl+(old&&!mob?`<div class="cap">SEKARANG</div><div class="old">4 kartu angka besar · kalender blok pink/kuning penuh · pola hari batang gradasi biru · pola brand header biru tua + kotak insight biru tua</div><div class="cap">USULAN</div>`:'')+strip()+`<div class="row"><div>${cal()}</div><div>${pola()}${brand()}</div></div>`}
const grp=(a,fn)=>document.querySelectorAll(`[data-${a}]`).forEach(b=>b.onclick=()=>{fn(b.dataset[a]);document.querySelectorAll(`[data-${a}]`).forEach(x=>x.classList.toggle('on',x===b));draw()});
grp('m',v=>mob=v==='m');grp('k',v=>K=v);document.querySelector('[data-o]').onclick=e=>{old=!old;e.target.classList.toggle('on',old);draw()};draw();
</script></body></html>
