<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brand · Ringkasan gabungan (opsi)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F3F5F8;color:#0f172a;font-size:13px}
.mode{position:sticky;top:0;z-index:20;display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;align-items:center}.mode button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:6px 14px;font-weight:600;cursor:pointer;font-family:inherit}.mode button.on{background:#0B5CAD;color:#fff;border-color:#0B5CAD}.mode .sp{width:14px}.mode small{margin-left:auto;color:#64748b;font-size:11.5px}
.frame{margin:14px auto;max-width:1180px;padding:0 16px}.frame.mob{max-width:390px;border:1px solid #cbd5e1;border-radius:18px;padding:8px;background:#F3F5F8}
.desc{background:#fff;border:1px solid #e5e7eb;border-left:4px solid #0B5CAD;border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#334155}.desc b{color:#0f172a}
.tabs{background:#fff;border:1px solid #e5e7eb;border-radius:8px;display:flex;padding:0 8px;margin-bottom:10px;overflow:auto}.tabs span{padding:11px 14px;font-size:11.5px;font-weight:600;color:#64748b;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}.tabs span.on{color:#0B5CAD;border-color:#0B5CAD}
.pn{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;margin-bottom:10px}.pn h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;color:#334155;letter-spacing:.2px;display:flex;align-items:center;gap:8px}.pn h4 small{font-weight:400;color:#64748b;text-transform:none}
table{width:100%;border-collapse:collapse;font-size:11.5px}th{background:#E6EBF1;text-align:right;padding:6px 8px;font-size:10px;text-transform:uppercase;font-weight:600;border:1px solid #d5dce5;white-space:nowrap}th:first-child,td:first-child{text-align:left}td{padding:6px 8px;border:1px solid #e5e7eb;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.br{cursor:pointer}tr.br td:first-child{font-weight:600;color:#0B5CAD;border-left:4px solid transparent}tr.br.on td{background:#EAF2FB}tr.br.on td:first-child{border-left-color:#0B5CAD}tr.tot td{background:#E6EBF1;font-weight:600}
.up{color:#0E7C6B;font-weight:600}.dn{color:#D2453F;font-weight:600}.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-weight:600;font-size:10.5px}.p-r{background:#FBE4E2;color:#B3322C}.p-y{background:#FDF0CC;color:#8A5A00}.p-g{background:#DDF3EA;color:#0E7C6B}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:6px 12px;font-size:11.5px;font-weight:600;text-transform:uppercase;cursor:pointer}.chip small{color:#64748b;margin-left:6px;font-weight:500}.chip.on{background:#0B5CAD;border-color:#0B5CAD;color:#fff}.chip.on small{color:#cfe1f5}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none}.ring div{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:600;font-size:15px}
.hm{flex:1;min-width:230px}.hm h3{margin:0 0 4px;font-size:15px;font-weight:600}.hm .sub{color:#64748b;font-size:11px;margin-bottom:6px}.prog{height:8px;background:#E6EBF1;border-radius:4px;position:relative;overflow:hidden}.prog i{position:absolute;left:0;top:0;bottom:0;background:#0B5CAD}.prog u{position:absolute;top:0;bottom:0;background:#9CC0E6;opacity:.7}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1.3;min-width:300px}.mob .mini{grid-template-columns:repeat(2,1fr);min-width:0;width:100%}.mini div{border-left:4px solid #0B5CAD;background:#F8FAFC;border-radius:4px;padding:6px 9px}.mini div:nth-child(2){border-color:#D2453F}.mini div:nth-child(3){border-color:#0E7C6B}.mini div:nth-child(4){border-color:#F0A400}.mini span{display:block;font-size:9.5px;color:#64748b;text-transform:uppercase}.mini b{font-size:15px;font-weight:600}
.mob .hero{flex-direction:column;align-items:stretch}.mob .ring{margin:0 auto}.mob .hm{min-width:0}.mob .mini{flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mob .two{grid-template-columns:1fr}svg{width:100%;height:auto;display:block}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.mob .cards{grid-template-columns:repeat(2,1fr)}
.card{background:#fff;border:1px solid #e5e7eb;border-top:4px solid #cbd5e1;border-radius:8px;padding:9px 10px;cursor:pointer}.card.on{border-color:#0B5CAD;border-top-color:#0B5CAD;box-shadow:0 2px 8px rgba(11,92,173,.18);background:#F5F9FE}
.card .t{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:12px}.card .big{font-size:17px;font-weight:600;margin:4px 0 2px}.card .s{font-size:10.5px;color:#64748b}.bar{height:6px;background:#E6EBF1;border-radius:3px;margin:6px 0 4px;overflow:hidden}.bar i{display:block;height:100%}
.ms{display:grid;grid-template-columns:270px 1fr;gap:10px;align-items:start}.mob .ms{grid-template-columns:1fr}
.li{display:block;border:1px solid #e5e7eb;border-left:4px solid #cbd5e1;border-radius:6px;padding:8px 10px;margin-bottom:6px;background:#fff;cursor:pointer}.li.on{border-left-color:#0B5CAD;background:#EAF2FB}.li .t{display:flex;justify-content:space-between;font-weight:600;font-size:12px}.li .s{display:flex;justify-content:space-between;font-size:10.5px;color:#64748b;margin-top:3px}
details.fold{background:#fff;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:10px}details.fold summary{cursor:pointer;padding:10px 12px;font-size:11.5px;font-weight:600;text-transform:uppercase;color:#334155}details.fold .in{padding:0 12px 12px;overflow:auto}
.scr{overflow:auto}.opt{display:none}.opt.on{display:block}.mobnote{font-size:11px;color:#64748b;margin:4px 0 8px}
</style></head><body>
<div class="mode"><button data-o="A" class="on">A · Tabel + detail di bawah</button><button data-o="B">B · Kartu brand + detail</button><button data-o="C">C · Daftar kiri + detail kanan</button><span class="sp"></span><button data-m="d" class="on">Desktop</button><button data-m="m">HP</button><small>Data contoh dari screenshot · belum dipasang ke app · klik brand untuk ganti</small></div>
<div class="frame" id="f"><div class="tabs"><span class="on">Ringkasan</span><span>Growth</span><span>Mingguan</span><span>Dealer</span></div><div id="o"></div></div>
<script>
const B=[{n:'ITEL',tg:35351,ak:16212,ac:45.9,gr:-2.9,gd:'-490 · dari 16.702',dt:1080,da:762,dac:70.6,dg:18.5,noo:60,so:20310},
{n:'MOTOPAD',tg:5429,ak:3179,ac:58.6,gr:136.9,gd:'+1.837 · dari 1.342',dt:304,da:174,dac:57.2,dg:52.6,noo:92,so:1212},
{n:'MOTOROLA',tg:1252,ak:320,ac:25.6,gr:-50.1,gd:'-321 · dari 641',dt:97,da:27,dac:27.8,dg:-15.6,noo:5,so:642},
{n:'VILLAON',tg:13527,ak:10361,ac:76.6,gr:59.6,gd:'+3.871 · dari 6.490',dt:722,da:663,dac:91.8,dg:21.9,noo:211,so:7734}];
const T={n:'TOTAL',tg:55559,ak:30072,ac:54.1,gr:19.5,gd:'+4.897 · dari 25.175',dt:2203,da:1626,dac:73.8,dg:22.0,noo:368,so:29898};
let sel=0,opt='A',mob=false;
const f=x=>x.toLocaleString('id-ID'),pc=x=>(x>0?'+':'')+String(x).replace('.',',')+'%',cls=x=>x>=0?'up':'dn',ac=x=>x>=75?'p-g':x>=50?'p-y':'p-r',ar=x=>x>=75?'#0E7C6B':x>=50?'#F0A400':'#D2453F';
function row(b,i,t){return `<tr class="${t?'tot':'br'+(i===sel?' on':'')}" ${t?'':`data-i="${i}"`}><td>${b.n}</td><td>${f(b.tg)}</td><td><b>${f(b.ak)}</b></td><td><span class="pill ${ac(b.ac)}">${String(b.ac).replace('.',',')}%</span></td><td class="${cls(b.gr)}">${pc(b.gr)}</td><td>${f(b.dt)}</td><td><b>${f(b.da)}</b></td><td><span class="pill ${ac(b.dac)}">${String(b.dac).replace('.',',')}%</span></td><td class="${cls(b.dg)}">${pc(b.dg)}</td><td>${b.noo}</td><td>${f(b.so)}</td></tr>`}
function tbl(){return `<div class="scr"><table><tr><th>Brand</th><th>ST target</th><th>ST aktual</th><th>%Achv</th><th>Growth</th><th>DA target</th><th>DA aktual</th><th>%Achv</th><th>Growth</th><th>NOO</th><th>Sell out</th></tr>${B.map((b,i)=>row(b,i)).join('')}${row(T,0,1)}</table></div>`}
function chips(){return `<div class="chips">${B.map((b,i)=>`<span class="chip ${i===sel?'on':''}" data-i="${i}">${b.n}<small>${f(b.ak)}</small></span>`).join('')}</div>`}
function hero(){const b=B[sel],k=b.ak/b.tg;const rr=Math.round(b.ak/24);return `<div class="pn"><div class="hero"><div class="ring" style="background:conic-gradient(${ar(b.ac)} ${b.ac*3.6}deg,#E6EBF1 0)"><div>${String(b.ac).replace('.',',')}%</div></div><div class="hm"><h3>${b.n} · Nasional · Seluruh cakupan saya</h3><div class="sub">September 2026 · MTD s.d. 28 Sep 2026 · 89 sales</div><div class="prog"><i style="width:${b.ac}%"></i><u style="left:${b.ac}%;width:${Math.min(8,100-b.ac)}%"></u></div><div class="sub" style="margin-top:6px"><span class="${cls(b.gr)}">vs LMTD ${pc(b.gr)}</span> · time gone 92,3% · target belum lengkap</div></div><div class="mini"><div><span>Run rate / hari kerja</span><b>${f(rr)} unit</b></div><div><span>Butuh / hari kerja</span><b>${f(Math.max(0,Math.round((b.tg-b.ak)/2)))} unit</b></div><div><span>Proyeksi omzet</span><b>Rp ${(b.ak*1.64/1000).toFixed(2).replace('.',',')} M</b></div><div><span>Gap ke target</span><b>${f(Math.max(0,b.tg-b.ak))} unit</b></div></div></div></div>`}
function trend(){const b=B[sel],s=[2066,6879,7586,33144,28765,20046,33227,33354,20507,b.ak].map(v=>Math.round(v*b.ak/16212*(0.8+Math.random()*0)));const m=['Des','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep'],mx=Math.max(...s);let g='';s.forEach((v,i)=>{const h=v/mx*120,x=18+i*34;g+=`<rect x="${x}" y="${140-h}" width="22" height="${h}" rx="2" fill="${i===9?'#0B5CAD':'#9CC0E6'}"/><text x="${x+11}" y="${136-h}" font-size="7.5" text-anchor="middle" fill="#334155">${f(v)}</text><text x="${x+11}" y="152" font-size="8" text-anchor="middle" fill="#64748b">${m[i]}</text>`});return `<div class="pn"><h4>Tren sell thru · ${b.n}<small>histori bulanan</small></h4><svg viewBox="0 0 370 160">${g}</svg></div>`}
function proj(){const b=B[sel];const pts=[];let a=0;for(let d=0;d<=28;d++){a=b.ak*Math.pow(d/28,1.15);pts.push(`${20+d*11.7},${130-a/b.tg*110}`)}const e=`${20+28*11.7},${130-b.ak/b.tg*110}`;return `<div class="pn"><h4>Proyeksi sell thru · ${b.n}<small>kumulatif harian vs target</small></h4><svg viewBox="0 0 370 160"><line x1="20" y1="130" x2="350" y2="20" stroke="#D2453F" stroke-dasharray="4 3" stroke-width="2"/><polyline points="${pts.join(' ')}" fill="none" stroke="#0B5CAD" stroke-width="2.5"/><circle cx="${e.split(',')[0]}" cy="${e.split(',')[1]}" r="4" fill="#F0A400"/><line x1="20" y1="130" x2="350" y2="130" stroke="#cbd5e1"/><text x="350" y="14" font-size="8" text-anchor="end" fill="#D2453F">Target ${f(b.tg)}</text><text x="${+e.split(',')[0]-6}" y="${+e.split(',')[1]-8}" font-size="8" text-anchor="end" fill="#0B5CAD">Aktual ${f(b.ak)}</text></svg></div>`}
function detail(){return hero()+`<div class="two">${trend()}${proj()}</div>`}
function cards(){return `<div class="cards">${B.map((b,i)=>`<div class="card ${i===sel?'on':''}" data-i="${i}"><div class="t">${b.n}<span class="pill ${ac(b.ac)}">${String(b.ac).replace('.',',')}%</span></div><div class="big">${f(b.ak)}</div><div class="s">dari ${f(b.tg)} · <span class="${cls(b.gr)}">${pc(b.gr)}</span> vs LMTD</div><div class="bar"><i style="width:${Math.min(100,b.ac)}%;background:${ar(b.ac)}"></i></div><div class="s">DA ${f(b.da)}/${f(b.dt)} · NOO ${b.noo}</div></div>`).join('')}</div>`}
function list(){return B.map((b,i)=>`<div class="li ${i===sel?'on':''}" data-i="${i}"><div class="t">${b.n}<span class="pill ${ac(b.ac)}">${String(b.ac).replace('.',',')}%</span></div><div class="bar"><i style="width:${Math.min(100,b.ac)}%;background:${ar(b.ac)}"></i></div><div class="s"><span>${f(b.ak)} / ${f(b.tg)}</span><span class="${cls(b.gr)}">${pc(b.gr)}</span></div></div>`).join('')+`<div class="li" style="border-left-color:#0f172a;cursor:default"><div class="t">TOTAL<span class="pill p-y">54,1%</span></div><div class="s"><span>30.072 / 55.559</span><span class="up">+19,5%</span></div></div>`}
function draw(){const d={A:'<b>A · Tabel + detail di bawah.</b> Tabel ringkasan tetap di atas (header abu kebiruan, TOTAL senada). Baris brand yang aktif ditandai; klik baris = detail di bawah berganti. Tabel boleh dilipat.',B:'<b>B · Kartu brand + detail.</b> Satu kartu per brand (bar pencapaian + growth). Klik kartu = detail brand di bawah. Tabel lengkap dilipat di paling bawah.',C:'<b>C · Daftar kiri + detail kanan.</b> Desktop: daftar brand ramping di kiri, detail penuh di kanan. HP: daftar jadi satu baris geser, detail di bawahnya.'}[opt];
let h=`<div class="desc">${d}</div>`;
if(opt==='A')h+=`<details class="fold" open><summary>Summary pencapaian per brand <span style="font-weight:400;text-transform:none;color:#64748b">· target bulan penuh · SO s.d. 28 Sep 2026</span></summary><div class="in">${tbl()}</div></details>${chips()}${detail()}`;
if(opt==='B')h+=cards()+detail()+`<details class="fold"><summary>Tabel lengkap per brand</summary><div class="in">${tbl()}</div></details>`;
if(opt==='C')h+=mob?`${chips()}${detail()}<details class="fold"><summary>Tabel lengkap per brand</summary><div class="in">${tbl()}</div></details>`:`<div class="ms"><div>${list()}</div><div>${detail()}</div></div><details class="fold"><summary>Tabel lengkap per brand</summary><div class="in">${tbl()}</div></details>`;
document.getElementById('o').innerHTML=h;document.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>{sel=+e.dataset.i;draw()})}
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{if(b.dataset.o){opt=b.dataset.o;document.querySelectorAll('[data-o]').forEach(x=>x.classList.toggle('on',x===b))}else{mob=b.dataset.m==='m';document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('f').classList.toggle('mob',mob)}draw()});
draw();
</script></body></html>
