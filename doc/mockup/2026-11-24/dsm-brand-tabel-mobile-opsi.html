.cp .up{color:#0E7C6B;font-weight:600}.cp .dn{color:#C0322C;font-weight:600}

.gC .cp{background:linear-gradient(90deg,var(--gc) 0%,#fff 52%);border-color:#E3E8EF;border-left:4px solid var(--gs)}.gC .cp.ok{--gc:#DDF3EA;--gs:#0E7C6B}.gC .cp.md{--gc:#FBEFCB;--gs:#F0A400}.gC .cp.lo{--gc:#FADDDA;--gs:#D2453F}
.gA .cp.tt,.gB .cp.tt,.gC .cp.tt{background:linear-gradient(135deg,#CFE1F5 0%,#E8F0FA 100%);border-color:#CFE1F5;border-left-width:1px}
</style></head><body>
<div class="mode"><button data-o="1">M1 · Kartu per brand</button><button data-o="2">M2 · Tabel geser</button><button data-o="3">M3a · Kartu diperkaya</button><button data-o="4">M3b · Kartu paling lengkap</button><button data-o="5">M3c · Padat 2 baris</button><button data-o="6" class="on">M3d · Padat 1,5 baris</button></div>
<div class="desc" id="d"></div>
<div class="ph" id="ph"><div class="tabs"><span class="on">Ringkasan</span><span>Growth</span><span>Mingguan</span><span>Dealer</span></div><div id="o"></div><div class="bk" id="bk"><div class="sh" id="sh"></div></div></div>
<script>
const B=[{n:'ITEL',tg:35351,ak:16212,ac:45.9,gr:-2.9,gd:'-490 · dari 16.702',dt:1080,da:762,dac:70.6,dg:18.5,dd:'+119 · dari 643',noo:60,so:20310,sg:4.2,sl:19490,om:24180,og:-1.8,od:'-444 jt · dari 24.624 jt'},
{n:'MOTOPAD',tg:5429,ak:3179,ac:58.6,gr:136.9,gd:'+1.837 · dari 1.342',dt:304,da:174,dac:57.2,dg:52.6,dd:'+60 · dari 114',noo:92,so:1212,sg:-12.5,sl:1385,om:3900,og:98.4,od:'+1.934 jt · dari 1.966 jt'},
{n:'MOTOROLA',tg:1252,ak:320,ac:25.6,gr:-50.1,gd:'-321 · dari 641',dt:97,da:27,dac:27.8,dg:-15.6,dd:'-5 · dari 32',noo:5,so:642,sg:8.1,sl:594,om:910,og:-44.2,od:'-721 jt · dari 1.631 jt'},
{n:'VILLAON',tg:13527,ak:10361,ac:76.6,gr:59.6,gd:'+3.871 · dari 6.490',dt:722,da:663,dac:91.8,dg:21.9,dd:'+119 · dari 544',noo:211,so:7734,sg:31.0,sl:5904,om:14610,og:54.3,od:'+5.140 jt · dari 9.470 jt'},
{n:'TOTAL',tot:1,tg:55559,ak:30072,ac:54.1,gr:19.5,gd:'+4.897 · dari 25.175',dt:2203,da:1626,dac:73.8,dg:22.0,dd:'+293 · dari 1.333',noo:368,so:29898,sg:9.2,sl:27373,om:43600,og:21.7,od:'+7.800 jt · dari 35.800 jt'}];
const f=x=>x.toLocaleString('id-ID'),n=x=>String(x).replace('.',','),cl=x=>x>=0?'up':'dn',ar=x=>x>=0?'▲':'▼';
const rp=x=>'Rp '+(x>=1000?n((x/1000).toFixed(2))+' M':f(x)+' jt');
const g=x=>`<span class="gc ${cl(x)}">${ar(x)} ${n(Math.abs(x))}%</span>`,sp=d=>d.split(' · dari ');
const dn=p=>`<span class="dn2" style="--p:${Math.min(100,p)};--k:${p<50?'#D2453F':'#0B5CAD'}"><b>${Math.round(p)}%</b></span>`;
const D={1:'<b>M1 · Kartu per brand.</b> Tiap brand satu kartu: doughnut %ACHV + nama, lalu kotak-kotak angka 2 kolom (target | aktual, growth + LMTD). Semua data desktop tampil, tanpa geser. Paling lengkap tapi paling panjang ke bawah.',2:'<b>M2 · Tabel geser.</b> Tetap berbentuk tabel seperti di desktop. Kolom BRAND (doughnut + nama) menempel di kiri, kolom lain digeser ke samping. Header biru muda bold, TOTAL di baris bawah.',3:'<b>M3a · Kartu diperkaya.</b> Kartu tetap ringkas tapi sekarang memuat: doughnut + %ACHV, growth SELLTHRU, SELLTHRU dan DEALER AKTIF (target | aktual), plus baris NOO, SELL OUT, OMZET. Ketuk kartu untuk rincian lengkap (LMTD dan selisih) dari bawah.',5:'<b>M3c · Padat 2 baris.</b> Tinggi kartu sekitar setengah M3a. Baris 1: doughnut, nama, SELLTHRU (target | aktual) dan growth. Baris 2: DEALER AKTIF (target | aktual), NOO, SELL OUT, OMZET sejajar ke samping. Tanpa kotak-kotak. Ketuk kartu untuk rincian (growth dealer aktif, growth sell out/omzet, LMTD, selisih).',6:'<b>M3d · Padat 1,5 baris + gradasi.</b> Pilih gaya gradasi lewat tombol di atas kartu (semua tipis, tidak norak). Gaya B dan C warnanya mengikuti pencapaian (hijau ≥75%, kuning 50–75%, merah di bawah 50%). Paling pendek: baris 1 sama seperti M3c, baris 2 cuma satu kalimat kecil "NOO · Sell out · Omzet". Dealer aktif hanya di rincian (ketuk).',4:'<b>M3b · Kartu paling lengkap.</b> Seperti M3a ditambah growth DEALER AKTIF, growth SELL OUT dan OMZET langsung di kartu, serta LMTD SELLTHRU. Lebih padat, tapi tidak perlu ketuk untuk angka pentingnya.'};
const grow=(g1,d)=>{const x=sp(d);return `<span class="v">${g(g1)}</span><span class="s">LMTD ${x[1]}</span><span class="s">selisih ${x[0]}</span>`};
function full(b){return `<div class="cd ${b.tot?'tt':''}"><div class="top">${dn(b.ac)}<b>${b.n}</b><em>${n(b.ac)}% dari target</em></div><div class="g2">
<div class="m"><span class="l">Sellthru<i>target | aktual</i></span><span class="v"><span>${f(b.tg)} |</span> ${f(b.ak)}</span><span class="s">${n(b.ac)}% dari target</span></div>
<div class="m"><span class="l">Growth sellthru<i>vs LMTD</i></span>${grow(b.gr,b.gd)}</div>
<div class="m"><span class="l">Dealer aktif<i>target | aktual</i></span><span class="v"><span>${f(b.dt)} |</span> ${f(b.da)}</span><span class="s">${n(b.dac)}% dari target</span></div>
<div class="m"><span class="l">Growth dealer aktif<i>vs LMTD</i></span>${grow(b.dg,b.dd)}</div>
<div class="m"><span class="l">NOO</span><span class="v">${f(b.noo)}</span></div>
<div class="m"><span class="l">Sell out<i>aktual · growth vs LMTD</i></span><span class="v">${f(b.so)}</span><span class="s">${g(b.sg)} · LMTD ${f(b.sl)}</span></div>
<div class="m w"><span class="l">Omzet<i>aktual · growth vs LMTD</i></span><span class="v">${rp(b.om)}</span><span class="s">${g(b.og)} · LMTD ${sp(b.od)[1]}</span></div></div></div>`}
function tbl(){const H=[['Brand',''],['Sellthru','target | aktual'],['Growth sellthru','vs LMTD'],['Dealer aktif','target | aktual'],['Growth dealer aktif','vs LMTD'],['NOO',''],['Sell out','aktual · growth vs LMTD'],['Omzet','aktual · growth vs LMTD']];
return `<div class="sc"><table><tr>${H.map(h=>`<th>${h[0]}${h[1]?`<em>${h[1]}</em>`:''}</th>`).join('')}</tr>${B.map(b=>`<tr class="${b.tot?'tt':''}"><td><span class="b">${dn(b.ac)}${b.n}</span></td><td><span class="a"><span class="t">${f(b.tg)} |</span> ${f(b.ak)}</span><span class="z">${n(b.ac)}% dari target</span></td><td>${g(b.gr)}<span class="z">LMTD ${sp(b.gd)[1]}</span><span class="z">selisih ${sp(b.gd)[0]}</span></td><td><span class="a"><span class="t">${f(b.dt)} |</span> ${f(b.da)}</span><span class="z">${n(b.dac)}% dari target</span></td><td>${g(b.dg)}<span class="z">LMTD ${sp(b.dd)[1]}</span><span class="z">selisih ${sp(b.dd)[0]}</span></td><td><span class="a">${f(b.noo)}</span></td><td><span class="a">${f(b.so)}</span><span class="z">${g(b.sg)} · LMTD ${f(b.sl)}</span></td><td><span class="a">${rp(b.om)}</span><span class="z">${g(b.og)} · LMTD ${sp(b.od)[1]}</span></td></tr>`).join('')}</table></div><div class="hint">Geser ke samping untuk kolom lainnya. Kolom BRAND tetap menempel.</div>`}
function comp(){return B.map((b,i)=>`<div class="cc ${b.tot?'tt':''}" data-i="${i}">${dn(b.ac)}<div class="mid"><b>${b.n}</b><span>${f(b.tg)} | <b style="font-size:13px">${f(b.ak)}</b></span></div><div class="rg">${g(b.gr)}<small>vs LMTD</small></div><span class="chev">›</span></div>`).join('')}

function rich(v){return B.map((b,i)=>{const s0=sp(b.gd),d0=sp(b.dd),o0=sp(b.od);
 return `<div class="cx ${b.tot?'tt':''}" data-i="${i}"><div class="t1">${dn(b.ac)}<div class="nm"><b>${b.n}</b><span>${n(b.ac)}% dari target</span></div><div class="gv">${g(b.gr)}<small>${v===2?'LMTD '+s0[1]:'vs LMTD'}</small></div><span class="chev">›</span></div>
 <div class="two"><div class="bx"><span class="l">Sellthru</span><span class="v"><i>${f(b.tg)} |</i> ${f(b.ak)}</span></div><div class="bx"><span class="l">Dealer aktif</span><span class="v"><i>${f(b.dt)} |</i> ${f(b.da)}</span>${v===2?`<span class="s">${g(b.dg)} · LMTD ${d0[1]}</span>`:`<span class="s">${n(b.dac)}% dari target</span>`}</div></div>
 <div class="three"><div class="bx"><span class="l">NOO</span><span class="v">${f(b.noo)}</span></div><div class="bx"><span class="l">Sell out</span><span class="v">${f(b.so)}</span>${v===2?`<span class="s">${g(b.sg)}</span>`:''}</div><div class="bx"><span class="l">Omzet</span><span class="v">${rp(b.om)}</span>${v===2?`<span class="s">${g(b.og)}</span>`:''}</div></div></div>`}).join('')}

function pad(v){return B.map((b,i)=>`<div class="cp ${b.tot?'tt':b.ac>=75?'ok':b.ac>=50?'md':'lo'}" data-i="${i}"><div class="r1">${dn(b.ac)}<div class="nm"><b>${b.n}</b><span>${f(b.tg)} | <b>${f(b.ak)}</b></span></div><div class="gv">${g(b.gr)}<small>vs LMTD</small></div><span class="chev">›</span></div>`+(v===1?`<div class="r2"><div><span class="l">Dealer aktif</span><span class="v"><i>${f(b.dt)} |</i> ${f(b.da)}</span></div><div><span class="l">NOO</span><span class="v">${f(b.noo)}</span></div><div><span class="l">Sell out</span><span class="v">${f(b.so)}</span></div><div><span class="l">Omzet</span><span class="v">${rp(b.om)}</span></div></div>`:`<div class="r3"><b>NOO</b> ${f(b.noo)} · <b>Sell out</b> ${f(b.so)} · <b>Omzet</b> ${rp(b.om)}</div>`)+`</div>`).join('')}
let opt=6,gv=2;
