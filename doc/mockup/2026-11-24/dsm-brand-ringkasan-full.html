<script>
const B=[{n:'ITEL',tg:35351,ak:16212,ac:45.9,gr:-2.9,gd:'-490 · dari 16.702',dt:1080,da:762,dac:70.6,dg:18.5,dd:'+119 · dari 643',noo:60,so:20310,sg:4.2,sl:19490,om:24180,og:-1.8,od:'-444 jt · dari 24.624 jt'},
{n:'MOTOPAD',tg:5429,ak:3179,ac:58.6,gr:136.9,gd:'+1.837 · dari 1.342',dt:304,da:174,dac:57.2,dg:52.6,dd:'+60 · dari 114',noo:92,so:1212,sg:-12.5,sl:1385,om:3900,og:98.4,od:'+1.934 jt · dari 1.966 jt'},
{n:'MOTOROLA',tg:1252,ak:320,ac:25.6,gr:-50.1,gd:'-321 · dari 641',dt:97,da:27,dac:27.8,dg:-15.6,dd:'-5 · dari 32',noo:5,so:642,sg:8.1,sl:594,om:910,og:-44.2,od:'-721 jt · dari 1.631 jt'},
{n:'VILLAON',tg:13527,ak:10361,ac:76.6,gr:59.6,gd:'+3.871 · dari 6.490',dt:722,da:663,dac:91.8,dg:21.9,dd:'+119 · dari 544',noo:211,so:7734,sg:31.0,sl:5904,om:14610,og:54.3,od:'+5.140 jt · dari 9.470 jt'},

const f=x=>x.toLocaleString('id-ID'),n=x=>String(x).replace('.',','),cl=x=>x>=0?'up':'dn',ar=x=>x>=0?'▲':'▼',rp=x=>'Rp '+(x>=1000?n((x/1000).toFixed(2))+' M':f(x)+' jt'),g=x=>`<span class="gc ${cl(x)}">${ar(x)} ${n(Math.abs(x))}%</span>`,sp=d=>d.split(' · dari ');

const col=x=>x>=75?'#0E7C6B':x>=50?'#F0A400':'#D2453F';
const nm=b=>b.tot?'SEMUA BRAND':b.n;function chips(){return `<div class="chips">${[4,0,1,2,3].map(i=>{const b=B[i];return `<span class="chip ${i===sel?'on':''}" data-s="${i}">${nm(b)}<small>${f(b.ak)}</small></span>`}).join('')}</div>`}
function hero(){const b=B[sel],rr=Math.round(b.ak/24);return `<div class="pn"><div class="hero"><div class="ring" style="background:conic-gradient(${col(b.ac)} ${b.ac*3.6}deg,#E6EBF1 0)"><div>${n(b.ac)}%</div></div><div class="hm"><h3>${nm(b)} · Nasional · Seluruh cakupan saya</h3><div class="sub">September 2026 · MTD s.d. 28 Sep 2026 · 89 sales</div><div class="prog"><i style="width:${b.ac}%"></i><u style="left:${b.ac}%;width:${Math.min(8,100-b.ac)}%"></u></div><div class="sub" style="margin-top:6px"><span class="${cl(b.gr)}">vs LMTD ${n(b.gr)}%</span> · time gone 92,3% · target belum lengkap</div></div><div class="mini"><div><span>Run rate / hari kerja</span><b>${f(rr)} unit</b></div><div><span>Butuh / hari kerja</span><b>${f(Math.max(0,Math.round((b.tg-b.ak)/2)))} unit</b></div><div><span>Proyeksi omzet</span><b>Rp ${(b.ak*1.64/1000).toFixed(2).replace('.',',')} M</b></div><div><span>Gap ke target</span><b>${f(Math.max(0,b.tg-b.ak))} unit</b></div></div></div></div>`}
const SR=[0.1,0.33,0.37,1.6,1.4,0.97,1.6,1.62,1,1];
function trend(){const b=B[sel],k=b.ak/16212,s=[2066,6879,7586,33144,28765,20046,33227,33354,20507,16212].map(v=>Math.round(v*k)),m=['Des','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep'],mx=Math.max(...s);let h='';s.forEach((v,i)=>{const hh=v/mx*120,x=18+i*34;h+=`<rect x="${x}" y="${140-hh}" width="22" height="${hh}" rx="2" fill="${i===9?'#0B5CAD':'#9CC0E6'}"/><text x="${x+11}" y="${136-hh}" font-size="7.5" text-anchor="middle" fill="#334155">${f(v)}</text><text x="${x+11}" y="152" font-size="8" text-anchor="middle" fill="#475569">${m[i]}</text>`});return `<div class="pn"><h4>Tren sell thru · ${nm(b)}<small>histori bulanan</small></h4><svg viewBox="0 0 370 160">${h}</svg></div>`}
function proj(){const b=B[sel],pts=[];for(let d=0;d<=28;d++)pts.push(`${20+d*11.7},${130-b.ak*Math.pow(d/28,1.15)/b.tg*110}`);const ey=130-b.ak/b.tg*110,ex=20+28*11.7;return `<div class="pn"><h4>Proyeksi sell thru · ${nm(b)}<small>kumulatif harian vs target</small></h4><svg viewBox="0 0 370 160"><line x1="20" y1="130" x2="350" y2="20" stroke="#D2453F" stroke-dasharray="4 3" stroke-width="2"/><polyline points="${pts.join(' ')}" fill="none" stroke="#0B5CAD" stroke-width="2.5"/><circle cx="${ex}" cy="${ey}" r="4" fill="#F0A400"/><line x1="20" y1="130" x2="350" y2="130" stroke="#cbd5e1"/><text x="350" y="14" font-size="8" text-anchor="end" fill="#D2453F">Target ${f(b.tg)}</text><text x="${ex-6}" y="${ey-8}" font-size="8" text-anchor="end" fill="#0B5CAD">Aktual ${f(b.ak)}</text></svg></div>`}
function detail(){return chips()+hero()+`<div class="two">${trend()}${proj()}</div>`}
const gcell=(g1,d)=>{const x=sp(d);return `<span><span class="big">${g(g1)}</span><span class="lm">LMTD ${x[1]}</span><span class="lm">selisih ${x[0]}</span></span>`};
function dtbl(){const H=[['Brand',''],['Sellthru','target | aktual'],['Growth sellthru','vs LMTD'],['Dealer aktif','target | aktual'],['Growth dealer aktif','vs LMTD'],['NOO',''],['Sell out','aktual · growth vs LMTD'],['Omzet','aktual · growth vs LMTD']];
return `<div class="cd"><div class="cr hd">${H.map(x=>`<span>${x[0]}${x[1]?`<em>${x[1]}</em>`:''}</span>`).join('')}</div>`+B.map(b=>`<div class="cr ${b.tot?'tt':''}"><span>${dn(b.ac)}<b style="font-weight:700;font-size:14px">${b.n}</b></span><span><span class="big"><span class="of2">${f(b.tg)} |</span>${f(b.ak)}</span><span class="sm">${n(b.ac)}% dari target</span></span>${gcell(b.gr,b.gd)}<span><span class="big"><span class="of2">${f(b.dt)} |</span>${f(b.da)}</span><span class="sm">${n(b.dac)}% dari target</span></span>${gcell(b.dg,b.dd)}<span><span class="big">${f(b.noo)}</span></span><span><span class="big">${f(b.so)}</span><span class="lm">${g(b.sg)} · LMTD ${f(b.sl)}</span></span><span><span class="big">${rp(b.om)}</span><span class="lm">${g(b.og)} · LMTD ${sp(b.od)[1]}</span></span></div>`).join('')+'</div>'}
