<script>
const K=[['HABIS','#C0314B',41],['PERLU CEK DATA','#6D3FD8',12],['MENIPIS','#D9831A',88],['CUKUP','#0B8A60',612],['STOK TINGGI','#2B5FB8',140],['BELUM BERGERAK','#6F7B8E',57],['TIDAK AKTIF','#94A3B8',23]];
const KC=Object.fromEntries(K.map(k=>[k[0],k[1]]));const f=x=>x.toLocaleString('id-ID'),d1=x=>x.toLocaleString('id-ID',{maximumFractionDigits:1});
const ROWS=[['CV MAJU JAYA CELL','100231','EKO PRASETYO','BIG SEMARANG','ITEL','A100C 3GB 64GB',0,42,'HABIS'],['CV MAJU JAYA CELL','100231','EKO PRASETYO','BIG SEMARANG','ITEL','P80 4GB 128GB',3,30,'MENIPIS'],['CV MAJU JAYA CELL','100231','EKO PRASETYO','BIG SEMARANG','VILLAON','V50S 4GB 64GB',22,25,'CUKUP'],['SINAR CELLULAR','100877','TOYO','BIG SOLO','ITEL','A100C 4GB 64GB',-2,18,'PERLU CEK DATA'],['SINAR CELLULAR','100877','TOYO','BIG SOLO','ITEL','S26 ULTRA 8GB 256GB',40,6,'STOK TINGGI'],['GLOBAL PHONE','101552','SUSILA SODIKIN','BIG CIREBON','MOTOPAD','MOTOPAD 10',12,0,'BELUM BERGERAK'],['GLOBAL PHONE','101552','SUSILA SODIKIN','BIG CIREBON','ITEL','A100C 3GB 64GB',18,21,'CUKUP'],['ANUGRAH SELULER','102004','AZWAR','JAMBI','ITEL','A100C 3GB 32GB',4,33,'MENIPIS']];
let MG=[];let mob=false,TB='A',old=false,mode='T',basis='30',ks=null,open=new Set([0]);
const dos=(s,so)=>s<0||so<=0?null:s/(so/30);
const dcell=(s,so,k)=>{const v=dos(s,so);return `<span class="dd" style="--c:${KC[k]}">${v==null?'—':d1(v)+' hari'}</span>`};
const kb=k=>`<span class="kb" style="--c:${KC[k]}">${k}</span>`;
function filt(){if(mob)return `<button class="mfb">FILTER<i>2 aktif</i></button><div class="fcs"><span class="fc"><b>DOS 30 hari</b></span><span class="fc">Region: <b>JAWA TENGAH</b> ×</span>${ks?`<span class="fc">Kondisi: <b>${ks}</b> ×</span>`:''}</div>`;const o=(l,v)=>`<label>${l}<select><option>${v}</option></select></label>`;
 return `<div class="fa">${o('REGION','JAWA TENGAH')}${o('SUB REGION','Semua')}${o('BRAND','Semua')}${o('TYPE','Semua')}${o('KONDISI',ks||'Semua')}<label>CARI DEALER<input placeholder="nama / kode dealer"></label><button class="btn">RESET</button><span class="sep"></span><label>BASIS SELL OUT<span class="seg">${[['MTD','BULAN BERJALAN'],['7','7 HARI'],['14','14 HARI'],['30','30 HARI'],['60','60 HARI']].map(x=>`<span class="${basis===x[0]?'on':''}" data-b="${x[0]}">${x[1]}</span>`).join('')}</span></label></div>`}
function summ(){const tot=K.reduce((a,k)=>a+k[2],0);const kdM=`<div class="kd"><div class="t">KONDISI DEALER–TYPE<span>ketuk untuk filter</span></div><div class="stk">${K.map(k=>`<i style="width:${k[2]/tot*100}%;background:${k[1]}"></i>`).join('')}</div><div class="kg">${K.map(k=>`<div style="--c:${k[1]}" class="${ks===k[0]?'on':''}" data-k="${k[0]}"><i></i>${k[0]}<b>${f(k[2])}</b></div>`).join('')}</div></div>`;const kd=`<div class="kd"><div class="t">KONDISI DEALER–TYPE<span>${f(tot)} pasangan · klik untuk filter</span></div><div class="stk">${K.map(k=>`<i style="width:${k[2]/tot*100}%;background:${k[1]}" title="${k[0]} ${k[2]}"></i>`).join('')}</div><div class="kc">${K.map(k=>`<span style="--c:${k[1]}" class="${ks===k[0]?'on':''}" data-k="${k[0]}">${k[0]}<b>${f(k[2])}</b></span>`).join('')}</div></div>`;
 if(mob)return `<div class="mk"><div style="--c:#2B7BE0"><span>ESTIMASI STOK</span><b>18.420</b><small>unit device</small></div><div style="--c:#F07A0C"><span>SELL OUT 30 HARI</span><b>21.870</b><small>rata-rata 729 / hari</small></div><div style="--c:#0E7C6B"><span>DOS GABUNGAN</span><b>25,3 hari</b><small>stok ÷ SO per hari</small></div><div style="--c:#C0314B"><span>MENIPIS / HABIS</span><b>129</b><small>pasangan dealer–type</small></div></div><div class="pn" style="padding:0">${kdM}</div><div class="foot" style="margin:0 0 8px 2px">Stok per 28 Sep 2026 · ST s.d. 28 Sep · SO s.d. 27 Sep</div>`;
 return `<div class="sa"><div class="nums"><div class="n"><span>ESTIMASI STOK</span><b>18.420</b><small>unit device</small></div><div class="n"><span>SELL OUT 30 HARI</span><b>21.870</b><small>29 Agu–27 Sep</small></div><div class="n"><span>RATA-RATA / HARI</span><b>729</b><small>unit sell out</small></div><div class="n"><span>DOS GABUNGAN</span><span class="pill">25,3 hari</span></div></div>${kd}</div><div class="foot">Estimasi stok per 28 Sep 2026 · Sell Thru s.d. 28 Sep · Sell Out s.d. 27 Sep · stok dihitung sejak Desember 2025</div>`}
function wil(){const W=[['JAWA TENGAH','BIG SEMARANG',212,18,5420,6120],['JAWA TENGAH','BIG SOLO',140,22,3980,3010],['JAWA BARAT','BIG CIREBON',198,31,4710,6880],['SUMATERA','JAMBI',96,12,2110,2450],['SUMATERA','RIAU',120,46,2200,3410]];
 const row=w=>{const d=w[4]/(w[5]/30),k=d<14?'MENIPIS':d>45?'STOK TINGGI':'CUKUP';return `<tr><td class="l">${w[0]}</td><td class="l"><a href="#" style="color:#0B5CAD;font-weight:600">${w[1]}</a></td><td>${f(w[2])}</td><td><b style="color:${w[3]>25?'#C0314B':'#0f172a'}">${f(w[3])}</b></td><td>${f(w[4])}</td><td>${f(w[5])}</td><td>${f(Math.round(w[5]/30))}</td><td>${dcell(w[4],w[5],k)}</td></tr>`};
 return `<div class="pn"><h4>DOS PER WILAYAH<small>klik wilayah untuk mempersempit · urut DOS terendah</small></h4><div class="tw"><table><thead><tr><th class="l">REGION</th><th class="l">SUB REGION</th><th>DEALER</th><th>MENIPIS/HABIS</th><th>STOK</th><th>SO 30 HARI</th><th>RATA²/HARI</th><th>DOS</th></tr></thead><tbody>${W.sort((a,b)=>a[4]/a[5]-b[4]/b[5]).map(row).join('')}<tr class="tt"><td class="l">TOTAL</td><td class="l">Semua</td><td>766</td><td>129</td><td>18.420</td><td>21.870</td><td>729</td><td>${dcell(18420,21870,'CUKUP')}</td></tr></tbody></table></div></div>`}
function brd(){const B=[['ITEL',11200,14300,'#1E5FB8'],['VILLAON',4300,4980,'#0E7C6B'],['MOTOPAD',2400,2010,'#6D3FD8'],['MOTOROLA',520,580,'#C25A12']];
 return `<div class="pn"><h4>DOS PER BRAND<small>gabungan dealer sesuai filter</small></h4><div class="tw"><table><thead><tr><th class="l">BRAND</th><th>STOK</th><th>SO 30 HARI</th><th>RATA²/HARI</th><th>DOS</th></tr></thead><tbody>${B.map(b=>{const d=b[1]/(b[2]/30),k=d<14?'MENIPIS':d>45?'STOK TINGGI':'CUKUP';return `<tr class="s" style="--c:${b[3]}"><td class="l"><b>${b[0]}</b></td><td>${f(b[1])}</td><td>${f(b[2])}</td><td>${f(Math.round(b[2]/30))}</td><td>${dcell(b[1],b[2],k)}</td></tr>`}).join('')}<tr class="tt"><td class="l">TOTAL</td><td>18.420</td><td>21.870</td><td>729</td><td>${dcell(18420,21870,'CUKUP')}</td></tr></tbody></table></div></div>`}
function main(){const R=ROWS.filter(r=>!ks||r[8]===ks);const tog=mob?'':`<div class="bar"><span class="seg"><span class="${mode==='T'?'on':''}" data-md="T">DEALER + TYPE</span><span class="${mode==='B'?'on':''}" data-md="B">DEALER + BRAND</span></span><span style="font-size:10.5px;color:#334155">Urut: kondisi terparah dulu · ${f(R.length)} baris</span></div>`;
 if(mob){const g=new Map();R.forEach(r=>{if(!g.has(r[1]))g.set(r[1],[]);g.get(r[1]).push(r)});const ORD=K.map(k=>k[0]),worst=a=>a.slice().sort((x,y)=>ORD.indexOf(x)-ORD.indexOf(y))[0];MG=[...g.values()];return `<div class="ms2"><input placeholder="Cari nama / kode dealer"><button>CARI</button></div><div style="font-size:10.5px;color:#334155;margin:0 0 6px 2px">${MG.length} dealer · kondisi terparah dulu · ketuk kartu untuk rincian per type</div>`+MG.map((rs,i)=>{const w=worst(rs.map(r=>r[8])),bs=[...new Set(rs.map(r=>r[4]))].map(b=>{const x=rs.filter(r=>r[4]===b);return {b,st:x.reduce((a,r)=>a+r[6],0),so:x.reduce((a,r)=>a+r[7],0),k:worst(x.map(r=>r[8]))}});return `<div class="dc" style="--c:${KC[w]}" data-dc="${i}"><div class="h"><div><b>${rs[0][0]}</b><small>${rs[0][1]} · ${rs[0][2]} · ${rs[0][3]}</small></div>${kb(w)}</div><div class="r"><span class="hh">BRAND</span><span class="hh">STOK</span><span class="hh">SO 30H</span><span class="hh">DOS</span>${bs.map(x=>`<span><b>${x.b}</b></span><span>${f(x.st)}</span><span>${f(x.so)}</span>${dcell(x.st,x.so,x.k)}`).join('')}</div><div class="ft"><span>${rs.length} type</span><span>Rincian per type ›</span></div></div>`}).join('')}
