<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brand · MINGGUAN · chart + panel samping</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#EDF0F5;color:#0f172a;font-size:12px}
.mode{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:8px 14px;background:#fff;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;align-items:center}.mode b{font-size:11px;color:#334155;margin-right:4px}.mode button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:5px 11px;font-weight:600;cursor:pointer;font-family:inherit;font-size:11.5px}.mode button.on{background:#0B5CAD;color:#fff;border-color:#0B5CAD}.mode small{margin-left:auto;color:#334155}
.wrap{max-width:1880px;margin:12px auto;padding:0 14px}.row{display:grid;grid-template-columns:1.5fr .9fr 1fr;gap:10px}
.pn{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 14px}.pn h4{margin:0 0 6px;font-size:12px;display:flex;gap:8px;align-items:baseline}.pn h4 small{font-weight:400;color:#475569;font-size:10.5px}
.lg{display:flex;gap:14px;font-size:10.5px;color:#334155;margin-bottom:2px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg{width:100%;height:auto;display:block}
.li{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;font-size:11.5px}.li .h{font-size:9.5px;font-weight:700;color:#0B3F78}.li .n{font-weight:600}
.bar{height:8px;background:#EEF2F6;border-radius:4px;position:relative;grid-column:1/-1;margin:-1px 0 5px}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.ch{display:inline-block;min-width:52px;text-align:center;border-radius:5px;padding:1px 6px;font-weight:700;font-size:10.5px}.up{background:#E3F4EE;color:#0E7C6B}.dn{background:#FBE7E5;color:#C0322C}.r{background:#FBE7E5;color:#C0322C}.y{background:#FFF3D6;color:#A26A00}.g{background:#E3F4EE;color:#0E7C6B}.b{background:#E4EEFB;color:#1E5FB8}
.sub{font-size:10px;font-weight:700;color:#475569;margin:6px 0 4px}.sub.u{color:#0E7C6B}.sub.d{color:#C0322C}
.dn2{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:6px}.dn2 .lgd div{display:flex;gap:6px;align-items:center;font-size:11.5px;margin:3px 0}.dn2 .lgd i{width:10px;height:10px;border-radius:2px}.dn2 .lgd b{margin-left:auto;padding-left:12px}
.note{font-size:10.5px;color:#334155;margin-top:6px}
</style></head><body>
<div class="mode"><b>Panel ke-3:</b><button data-o="A">A · Type naik/turun</button><button data-o="B">B · % SO/ST per model</button><b style="margin-left:10px">Sales naik/turun:</b><button data-o="C">C1 · daftar + batang</button><button data-o="E">C2 · batang dua arah</button><button data-o="F" class="on">C3 · 2 kolom naik | turun</button><button data-o="G">C4 · turun 2 minggu beruntun</button><small>Data contoh · belum dipasang ke app</small></div>
<div class="wrap"><div class="row"><div class="pn"><h4>TREN MINGGUAN<small>ST vs SO per minggu · garis atas = % SO/ST</small></h4><div class="lg"><span><i style="background:#1E5FB8"></i>SELL THRU</span><span><i style="background:#C25A12"></i>SELL OUT</span><span><i style="background:#0E7C6B;border-radius:50%"></i>% SO/ST</span></div><svg id="cv" viewBox="0 0 760 250"></svg></div><div class="pn" id="dnt"></div><div class="pn" id="side"></div></div></div>
<script>
const f=x=>x.toLocaleString('id-ID');const ST=[4490,2091,6554,3077],SO=[5668,5407,4697,4538],WD=['1–7','8–14','15–21','22–28'];
(function(){const w=760,h=250,L=40,R=10,T=34,B=36,pw=w-L-R,ph=h-T-B,mx=Math.max(...ST,...SO)*1.4,gw=pw/6,bw=Math.round(gw*.4);let s='';
for(let i=0;i<4;i++){const y=T+ph-ph*i/3;s+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="#E6EBF1"/><text x="${L-5}" y="${y+3}" font-size="9" text-anchor="end" fill="#475569">${f(Math.round(mx*i/3))}</text>`}
const pts=[];for(let i=0;i<5;i++){const cx=L+gw*i+gw/2;if(i===4){s+=`<text x="${cx}" y="${T+ph/2}" font-size="9.5" text-anchor="middle" fill="#64748b">belum jalan</text>`}else{const a=ph*ST[i]/mx,b=ph*SO[i]/mx,c=i===3;s+=`<rect x="${cx-bw-1}" y="${T+ph-a}" width="${bw}" height="${a}" rx="3" fill="${c?'#1E5FB8':'#9CC0E6'}"/><rect x="${cx+1}" y="${T+ph-b}" width="${bw}" height="${b}" rx="3" fill="${c?'#C25A12':'#EDB48E'}"/><text x="${cx-bw/2}" y="${T+ph-a-4}" font-size="9" font-weight="700" text-anchor="middle">${f(ST[i])}</text><text x="${cx+bw/2}" y="${T+ph-b-4}" font-size="9" font-weight="700" text-anchor="middle">${f(SO[i])}</text>`;pts.push([cx,T+4+16*(1-Math.min(SO[i]/ST[i]*100,260)/260),Math.round(SO[i]/ST[i]*100)])}
s+=`<text x="${cx}" y="${h-20}" font-size="10" font-weight="700" text-anchor="middle">W${i+1}</text><text x="${cx}" y="${h-8}" font-size="9" text-anchor="middle" fill="#475569">${i<4?WD[i]:'29–30'}${i===3?' · MTD':''}</text>`}
s+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="#0E7C6B" stroke-width="1.6" stroke-dasharray="5 4"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#0E7C6B"/><text x="${p[0]+7}" y="${p[1]+4}" font-size="9" font-weight="700" fill="#0E7C6B" stroke="#fff" stroke-width="3" paint-order="stroke">${p[2]}%</text>`).join('');
const cx=L+gw*5+gw/2,xs=L+gw*5,t1=16212,t2=20310,tm=t2,h1=ph*.62*t1/tm,h2=ph*.62*t2/tm;s+=`<line x1="${xs}" x2="${xs}" y1="${T}" y2="${T+ph+4}" stroke="#94A3B8" stroke-dasharray="3 4"/><rect x="${cx-bw-1}" y="${T+ph-h1}" width="${bw}" height="${h1}" rx="3" fill="#1E5FB8"/><rect x="${cx+1}" y="${T+ph-h2}" width="${bw}" height="${h2}" rx="3" fill="#C25A12"/><text x="${cx-bw/2}" y="${T+ph-h1-4}" font-size="9" font-weight="700" text-anchor="middle">${f(t1)}</text><text x="${cx+bw/2}" y="${T+ph-h2-4}" font-size="9" font-weight="700" text-anchor="middle">${f(t2)}</text><text x="${cx}" y="${T+10}" font-size="10" font-weight="800" text-anchor="middle" fill="#0E7C6B">125% SO/ST</text><text x="${cx}" y="${h-20}" font-size="10" font-weight="700" text-anchor="middle">TOTAL</text><text x="${cx}" y="${h-8}" font-size="9" font-weight="700" text-anchor="middle" fill="#9A6400">MTD</text>`;
document.getElementById('cv').innerHTML=s})();
const M=[['A100C',[2100,980,3100,1450],[2600,2500,2200,2100]],['P80',[900,420,1300,620],[1200,1100,950,900]],['VISTAB 30GT',[600,300,900,500],[700,800,600,700]],['S26 ULTRA',[480,240,700,310],[650,560,520,430]],['A90',[410,151,554,197],[518,447,427,408]]];
const SL=[['EKO PRASETYO',420,260],['TOYO',180,90],['SUSILA SODIKIN',510,700],['AZWAR',160,240],['EKI HERDIYAN',300,610],['JOHAN ARIF',140,95],['NIKO',90,210]];
const ch=(a,b)=>{const p=(a-b)/b*100;return `<span class="ch ${p>=0?'up':'dn'}">${p>=0?'▲ +':'▼ '}${Math.round(p)}%</span>`};
const S={A(){const L=M.map(m=>({n:m[0],a:m[1][3],b:m[1][2]})).sort((x,y)=>(x.a-x.b)-(y.a-y.b));const mx=Math.max(...L.map(x=>Math.abs(x.a-x.b)));return `<h4>TYPE NAIK / TURUN<small>ST W4 (berjalan, s.d. hari sama) vs W3</small></h4><div class="li"><span class="h">MODEL</span><span class="h">W4 vs W3</span><span class="h">SELISIH</span>${L.map(x=>`<span class="n">${x.n}</span>${ch(x.a,x.b)}<b style="color:${x.a>=x.b?'#0E7C6B':'#C0322C'}">${x.a-x.b>0?'+':''}${f(x.a-x.b)}</b><div class="bar"><i style="width:${Math.abs(x.a-x.b)/mx*100}%;background:${x.a>=x.b?'#0E7C6B':'#D2453F'}"></i></div>`).join('')}</div><div class="note">Minggu berjalan dibandingkan minggu lalu pada jumlah hari yang sama, supaya tidak kelihatan turun cuma karena minggunya belum selesai.</div>`},
B(){const L=M.map(m=>{const s=m[1].reduce((a,b)=>a+b),o=m[2].reduce((a,b)=>a+b);return {n:m[0],s,o,p:o/s*100}}).sort((a,b)=>a.p-b.p);const mx=Math.max(...L.map(x=>x.p));return `<h4>% SO/ST PER MODEL<small>MTD · terendah di atas (stok menumpuk di dealer)</small></h4><div class="li"><span class="h">MODEL</span><span class="h">ST · SO</span><span class="h">% SO/ST</span>${L.map(x=>{const c=x.p<50?'r':x.p<80?'y':x.p<=100?'g':'b';return `<span class="n">${x.n}</span><span>${f(x.s)} · ${f(x.o)}</span><span class="ch ${c}">${Math.round(x.p)}%</span><div class="bar"><i style="width:${x.p/mx*100}%;background:${{r:'#D2453F',y:'#F0A400',g:'#0E7C6B',b:'#1E5FB8'}[c]}"></i></div>`}).join('')}</div><div class="note">&lt;50% merah · 50–79% kuning · 80–100% hijau · &gt;100% biru</div>`},
C(){const L=SL.map(x=>({n:x[0],a:x[1],b:x[2],d:x[1]-x[2]})),up=L.filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,3),dn=L.filter(x=>x.d<0).sort((a,b)=>a.d-b.d).slice(0,3),mx=Math.max(...L.map(x=>Math.abs(x.d)));const r=x=>`<span class="n">${x.n}</span>${ch(x.a,x.b)}<b style="color:${x.d>=0?'#0E7C6B':'#C0322C'}">${x.d>0?'+':''}${f(x.d)}</b><div class="bar"><i style="width:${Math.abs(x.d)/mx*100}%;background:${x.d>=0?'#0E7C6B':'#D2453F'}"></i></div>`;return `<h4>SALES NAIK / TURUN<small>ST W4 vs W3 · s.d. hari sama</small></h4><div class="sub u">NAIK TERBESAR</div><div class="li">${up.map(r).join('')}</div><div class="sub d">TURUN TERBESAR</div><div class="li">${dn.map(r).join('')}</div><div class="note">Ikut filter Region / Sub Region / RGM / ASM.</div>`},
D(){const L=M.map(m=>({n:m[0],s:m[1].reduce((a,b)=>a+b)})),T=L.reduce((a,x)=>a+x.s,0),C=['#1E5FB8','#0E7C6B','#6D3FD8','#C25A12','#B4235A'];let acc=0,arcs='';L.forEach((x,i)=>{const a0=acc/T*2*Math.PI,a1=(acc+x.s)/T*2*Math.PI;acc+=x.s;const p=(a)=>[60+50*Math.sin(a),60-50*Math.cos(a)],[x0,y0]=p(a0),[x1,y1]=p(a1);arcs+=`<path d="M${x0},${y0} A50,50 0 ${a1-a0>Math.PI?1:0} 1 ${x1},${y1}" stroke="${C[i]}" stroke-width="16" fill="none"/>`});
 return `<h4>KONTRIBUSI ST PER MODEL<small>MTD</small></h4><div class="dn2"><svg viewBox="0 0 120 120" style="width:190px;flex:none">${arcs}<text x="60" y="58" text-anchor="middle" font-size="15" font-weight="800">${f(T)}</text><text x="60" y="73" text-anchor="middle" font-size="8" fill="#475569">ST MTD</text></svg><div class="lgd" style="flex:1">${L.map((x,i)=>`<div><i style="background:${C[i]}"></i>${x.n}<b>${f(x.s)}</b><span style="width:40px;text-align:right">${Math.round(x.s/T*100)}%</span></div>`).join('')}</div></div>`}};

S.E=function(){const L=SL.map(x=>({n:x[0],d:x[1]-x[2],a:x[1],b:x[2]})).sort((a,b)=>b.d-a.d),mx=Math.max(...L.map(x=>Math.abs(x.d)));return `<h4>SALES NAIK / TURUN<small>ST W4 vs W3 · s.d. hari sama</small></h4>${L.map(x=>`<div style="display:grid;grid-template-columns:110px 1fr 1fr 50px;align-items:center;gap:0;font-size:11px;margin:4px 0"><span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.n}</span><div style="display:flex;justify-content:flex-end;border-right:2px solid #15303F;height:14px">${x.d<0?`<i style="width:${-x.d/mx*100}%;background:#D2453F;border-radius:3px 0 0 3px"></i>`:''}</div><div style="height:14px">${x.d>0?`<i style="display:block;height:14px;width:${x.d/mx*100}%;background:#0E7C6B;border-radius:0 3px 3px 0"></i>`:''}</div><b style="text-align:right;color:${x.d>=0?'#0E7C6B':'#C0322C'}">${x.d>0?'+':''}${f(x.d)}</b></div>`).join('')}<div class="note">Kiri merah = turun, kanan hijau = naik · semua sales pada filter (maks 10)</div>`};
S.F=function(){const L=SL.map(x=>({n:x[0],d:x[1]-x[2],a:x[1],b:x[2]})),up=L.filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,5),dn=L.filter(x=>x.d<0).sort((a,b)=>a.d-b.d).slice(0,5);const it=(x,i,c)=>`<div style="display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #EEF2F6"><span style="width:20px;height:20px;border-radius:50%;background:${c}22;color:${c};font-weight:800;font-size:10px;display:grid;place-items:center">${i+1}</span><div style="flex:1;min-width:0"><b style="display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.n}</b><small style="color:#334155">${f(x.b)} → ${f(x.a)}</small></div><b style="color:${c}">${x.d>0?'+':''}${f(x.d)}</b></div>`;return `<h4>SALES NAIK / TURUN<small>ST W4 vs W3 · s.d. hari sama</small></h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><div class="sub u">▲ NAIK</div>${up.map((x,i)=>it(x,i,'#0E7C6B')).join('')}</div><div><div class="sub d">▼ TURUN</div>${dn.map((x,i)=>it(x,i,'#C0322C')).join('')}</div></div>`};
S.G=function(){const L=[['SUSILA SODIKIN',[820,700,610,510]],['EKI HERDIYAN',[700,650,610,300]],['AZWAR',[300,260,240,160]],['NIKO',[260,240,210,90]]];return `<h4>PERLU PERHATIAN<small>sales yang ST-nya turun 2 minggu berturut-turut</small></h4>${L.map(x=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #EEF2F6"><b style="flex:1;font-size:11.5px">${x[0]}</b><svg viewBox="0 0 80 24" style="width:80px;height:24px"><polyline points="${x[1].map((v,i)=>i*26+','+(22-v/Math.max(...x[1])*20)).join(' ')}" fill="none" stroke="#D2453F" stroke-width="2"/>${x[1].map((v,i)=>`<circle cx="${i*26}" cy="${22-v/Math.max(...x[1])*20}" r="2" fill="#D2453F"/>`).join('')}</svg><span style="font-size:10.5px;color:#334155;width:92px;text-align:right">${x[1].map(f).slice(1).join(' → ')}</span></div>`).join('')}<div class="note">Garis kecil = ST W1–W4 · kalau tidak ada, panel menampilkan "Tidak ada sales yang turun 2 minggu beruntun".</div>`};
let o='F';const draw=()=>{document.getElementById('side').innerHTML=S[o]();document.getElementById('dnt').innerHTML=S.D();};draw();
document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{o=b.dataset.o;document.querySelectorAll('[data-o]').forEach(x=>x.classList.toggle('on',x===b));draw()});
</script></body></html>
