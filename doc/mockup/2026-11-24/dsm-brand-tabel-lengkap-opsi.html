h:()=>`<table><tr><th rowspan=2 style="vertical-align:bottom">Brand</th><th class="g sep" colspan=4 style="--c:#1E5FB8">SELLTHRU</th><th class="g sep" colspan=4 style="--c:#0E7C6B">DEALER AKTIF</th><th class="g sep" style="--c:#6D3FD8">NOO</th><th class="g sep" style="--c:#C25A12">SELL OUT</th></tr><tr><th class="sep">Target</th><th>Aktual</th><th>%Achv</th><th>Growth</th><th class="sep">Target</th><th>Aktual</th><th>%Achv</th><th>Growth</th><th class="sep">Aktual</th><th class="sep">Aktual</th></tr>${B.map(b=>`<tr class="${b.tot?'tot':''}"><td>${b.n}</td><td class="sep">${f(b.tg)}</td><td><b>${f(b.ak)}</b></td><td>${bar(b.ac)}${pill(b.ac)}</td><td><span class="${cl(b.gr)}">${pc(b.gr)}</span><span class="d">${b.gd}</span></td><td class="sep">${f(b.dt)}</td><td><b>${f(b.da)}</b></td><td>${bar(b.dac)}${pill(b.dac)}</td><td><span class="${cl(b.dg)}">${pc(b.dg)}</span><span class="d">${b.dd}</span></td><td class="sep">${f(b.noo)}</td><td class="sep">${f(b.so)}</td></tr>`).join('')}</table>`},
2:{d:'<b>B · Ringkas.</b> Target dan aktual digabung jadi satu kolom ("16.212 dari 35.351") dengan bar di bawahnya, jadi tabel jauh lebih pendek lebarnya (7 kolom, bukan 11). Cocok kalau lebar layar sempit atau brand nanti bertambah banyak.',
h:()=>`<table><tr><th>Brand</th><th class="g sep" style="--c:#1E5FB8">SELLTHRU · Aktual dari Target</th><th>%Achv</th><th>Growth</th><th class="g sep" style="--c:#0E7C6B">DEALER AKTIF · Aktual dari Target</th><th>%Achv</th><th>Growth</th><th class="g sep" style="--c:#6D3FD8">NOO</th><th class="g sep" style="--c:#C25A12">SELL OUT</th></tr>${B.map(b=>`<tr class="${b.tot?'tot':''}"><td>${b.n}</td><td class="sep"><b>${f(b.ak)}</b> dari ${f(b.tg)}<span class="d"><span class="bar" style="width:100%;margin:2px 0 0"><i style="width:${Math.min(100,b.ac)}%;background:${col(b.ac)}"></i></span></span></td><td>${pill(b.ac)}</td><td><span class="${cl(b.gr)}">${pc(b.gr)}</span><span class="d">${b.gd}</span></td><td class="sep"><b>${f(b.da)}</b> dari ${f(b.dt)}<span class="d"><span class="bar" style="width:100%;margin:2px 0 0"><i style="width:${Math.min(100,b.dac)}%;background:${col(b.dac)}"></i></span></span></td><td>${pill(b.dac)}</td><td><span class="${cl(b.dg)}">${pc(b.dg)}</span><span class="d">${b.dd}</span></td><td class="sep">${f(b.noo)}</td><td class="sep">${f(b.so)}</td></tr>`).join('')}</table>`},
3:{d:'<b>C · Dibalik.</b> Karena brand cuma 4, brand jadi kolom dan indikator jadi baris. Tiap indikator punya blok sendiri (Target, Aktual, %Achv, Growth), sehingga brand gampang dibandingkan ke samping. TOTAL jadi kolom paling kanan.',
h:()=>{const K=[['SELLTHRU','#1E5FB8',[['Target',b=>f(b.tg)],['Aktual',b=>`<b>${f(b.ak)}</b>`],['%Achv',b=>pill(b.ac)],['Growth',b=>`<span class="${cl(b.gr)}">${pc(b.gr)}</span><span class="d">${b.gd}</span>`]]],['DEALER AKTIF','#0E7C6B',[['Target',b=>f(b.dt)],['Aktual',b=>`<b>${f(b.da)}</b>`],['%Achv',b=>pill(b.dac)],['Growth',b=>`<span class="${cl(b.dg)}">${pc(b.dg)}</span><span class="d">${b.dd}</span>`]]],['NOO','#6D3FD8',[['Aktual',b=>f(b.noo)]]],['SELL OUT','#C25A12',[['Aktual',b=>f(b.so)]]]];
let r=`<table><tr><th>Indikator</th><th style="text-align:left">Ukuran</th>${B.map(b=>`<th>${b.n}</th>`).join('')}</tr>`;K.forEach(([nm,c,rows])=>rows.forEach((x,i)=>{r+=`<tr style="--c:${c}">${i===0?`<td class="ind" rowspan="${rows.length}">${nm}</td>`:''}<td style="text-align:left;color:#64748b;font-weight:500;border-left:0">${x[0]}</td>${B.map(b=>`<td ${b.tot?'style="background:#E6EBF1;font-weight:600"':''}>${x[1](b)}</td>`).join('')}</tr>`}));return r+'</table>'}},
4:{d:'<b>C2 · Dibalik + heat &amp; bar.</b> Header kolom brand dipertegas (nama + aktual SELLTHRU kecil). Tiap sel %ACHV jadi bar penuh berwarna (hijau/kuning/merah) supaya kelihatan sekilas siapa yang tertinggal. Aktual dibesarkan dengan target kecil di bawahnya. Growth jadi chip panah. Sel terbaik diberi bingkai hijau, terendah bingkai merah (per baris %ACHV).',
h:()=>{const bs=B.filter(b=>!b.tot);const ex=(k)=>{const v=bs.map(b=>b[k]);return [Math.max(...v),Math.min(...v)]};
const gr=(x,d)=>`<span class="gr ${x>=0?'gu':'gd'}">${x>=0?'▲':'▼'} ${n(Math.abs(x))}%</span><span class="tg">${d}</span>`;
const hb=(x,k)=>{const [mx,mn]=ex(k);const c=col(x);return `<span class="hb ${x===mx?'best':''} ${x===mn?'worst':''}"><i style="width:${Math.min(100,x)}%;background:${c}"></i><b style="color:${x>=75?'#0E7C6B':x>=50?'#8A5A00':'#B3322C'}">${n(x)}%</b></span>`};
const blocks=[['SELLTHRU','#1E5FB8',[['Aktual',b=>`<span class="cell"><span class="big">${f(b.ak)}</span><span class="tg">dari ${f(b.tg)}</span></span>`],['%Achv',b=>hb(b.ac,'ac')],['Growth',b=>gr(b.gr,b.gd)]]],['DEALER AKTIF','#0E7C6B',[['Aktual',b=>`<span class="cell"><span class="big">${f(b.da)}</span><span class="tg">dari ${f(b.dt)}</span></span>`],['%Achv',b=>hb(b.dac,'dac')],['Growth',b=>gr(b.dg,b.dd)]]],['NOO','#6D3FD8',[['Aktual',b=>`<span class="big">${f(b.noo)}</span>`]]],['SELL OUT','#C25A12',[['Aktual',b=>`<span class="big">${f(b.so)}</span>`]]]];
let r=`<table class="c2"><tr><th style="vertical-align:bottom">Indikator</th><th style="text-align:left;vertical-align:bottom">Ukuran</th>${B.map(b=>`<th><span class="bn">${b.n}</span><span class="bs">${f(b.ak)} unit</span></th>`).join('')}</tr>`;
blocks.forEach(([nm,c,rows])=>rows.forEach((x,i)=>{r+=`<tr style="--c:${c}">${i===0?`<td class="ind" rowspan="${rows.length}">${nm}</td>`:''}<td style="text-align:left;color:#64748b;font-weight:500;border-left:0">${x[0]}</td>${B.map(b=>`<td ${b.tot?'style="background:#E6EBF1;font-weight:600"':''}>${x[1](b)}</td>`).join('')}</tr>`}));return r+'</table>'}},
5:{d:'<b>C3 · Kartu per indikator.</b> Satu kartu per indikator (SELLTHRU, DEALER AKTIF, NOO, SELL OUT) dalam grid 2x2. Di tiap kartu, brand jadi baris dengan bar pencapaian, angka aktual/target, dan growth. Paling enak dibaca sekilas, tapi detail seperti "dari LMTD" lebih sedikit.',
h:()=>{const bs=B.filter(b=>!b.tot),T=B.find(b=>b.tot);const rowH=(b,a,t,p,g,cl2)=>`<div class="r ${b.tot?'t':''}"><span class="n">${b.n}</span><div><div class="tr"><i style="width:${Math.min(100,p)}%;background:${col(p)}"></i></div><div class="v"><b>${f(a)}</b> dari ${f(t)} · ${n(p)}%</div></div><span class="gr ${g>=0?'gu':'gd'}" style="justify-self:end">${g>=0?'▲':'▼'} ${n(Math.abs(g))}%</span></div>`;
const plain=(b,key)=>`<div class="r ${b.tot?'t':''}"><span class="n">${b.n}</span><div><div class="tr"><i style="width:${Math.round(b[key]/Math.max(...bs.map(x=>x[key]))*100)}%;background:${key==='noo'?'#6D3FD8':'#C25A12'}"></i></div></div><b style="justify-self:end">${f(b[key])}</b></div>`;
return `<div class="c3"><div class="k" style="--c:#1E5FB8"><h6>SELLTHRU<small>target bulan penuh</small></h6>${bs.map(b=>rowH(b,b.ak,b.tg,b.ac,b.gr)).join('')}${rowH(T,T.ak,T.tg,T.ac,T.gr)}</div><div class="k" style="--c:#0E7C6B"><h6>DEALER AKTIF<small>target bulan penuh</small></h6>${bs.map(b=>rowH(b,b.da,b.dt,b.dac,b.dg)).join('')}${rowH(T,T.da,T.dt,T.dac,T.dg)}</div><div class="k" style="--c:#6D3FD8"><h6>NOO<small>aktual</small></h6>${bs.map(b=>plain(b,'noo')).join('')}${plain(T,'noo')}</div><div class="k" style="--c:#C25A12"><h6>SELL OUT<small>aktual</small></h6>${bs.map(b=>plain(b,'so')).join('')}${plain(T,'so')}</div></div>`}},
6:{d:'<b>D1 · Bersih.</b> Tanpa bar, pill, atau kotak. Hanya garis tipis antar baris, satu garis tebal di bawah header, dan kolom TOTAL diberi latar abu muda. %ACHV dan growth cuma teks berwarna (hijau/merah). Indikator jadi judul bagian kecil dengan satu titik warna. Omzet ditambahkan sebagai bagian baru.',
h:()=>{const gtxt=(g,d)=>`<span class="${cl(g)}">${pc(g)}</span> <span style="color:#64748b;font-size:10.5px">${d}</span>`;const G=[['SELLTHRU','#1E5FB8',[['Target',b=>f(b.tg)],['Aktual',b=>`<span class="m">${f(b.ak)}</span>`],['%Achv',b=>`<span class="${b.ac>=75?'up':b.ac<50?'dn':''}">${n(b.ac)}%</span>`],['Growth',b=>gtxt(b.gr,b.gd)]]],['DEALER AKTIF','#0E7C6B',[['Target',b=>f(b.dt)],['Aktual',b=>`<span class="m">${f(b.da)}</span>`],['%Achv',b=>`<span class="${b.dac>=75?'up':b.dac<50?'dn':''}">${n(b.dac)}%</span>`],['Growth',b=>gtxt(b.dg,b.dd)]]],['NOO','#6D3FD8',[['Aktual',b=>`<span class="m">${f(b.noo)}</span>`]]],['SELL OUT','#C25A12',[['Aktual',b=>`<span class="m">${f(b.so)}</span>`]]],['OMZET','#9A6400',[['Aktual',b=>`<span class="m">${rp(b.om)}</span>`],['Growth',b=>gtxt(b.og,b.od)]]]];
let r=`<table class="cl"><tr><th></th><th></th>${B.map(b=>`<th class="${b.tot?'tt':''}">${b.n}</th>`).join('')}</tr>`;G.forEach(([nm,c,rows])=>{r+=`<tr class="sec" style="--c:${c}"><td colspan="${B.length+2}">${nm}</td></tr>`;rows.forEach(x=>{r+=`<tr><td style="width:0;padding:0"></td><td class="lb" style="text-align:left;width:70px">${x[0]}</td>${B.map(b=>`<td class="${b.tot?'tt':''}">${x[1](b)}</td>`).join('')}</tr>`})});return r+'</table>'}},
7:{d:'<b>D2 · Satu baris per indikator.</b> Tabel cuma 5 baris. Di tiap sel, angka AKTUAL paling besar, lalu baris kecil abu: "dari target · %ACHV" dan growth. Tidak ada bar. Paling ringkas dan paling sedikit warna: hanya growth yang berwarna. Baris OMZET ditambahkan.',
h:()=>{const sub=(t,p,g,d)=>`<span class="z">dari ${f(t)} · ${n(p)}%</span><span class="z"><span class="${cl(g)}">${g>=0?'▲':'▼'} ${n(Math.abs(g))}%</span> · ${d}</span>`;
const R=[['SELLTHRU','#1E5FB8',b=>`<span class="a">${f(b.ak)}</span>${sub(b.tg,b.ac,b.gr,b.gd)}`],['DEALER AKTIF','#0E7C6B',b=>`<span class="a">${f(b.da)}</span>${sub(b.dt,b.dac,b.dg,b.dd)}`],['NOO','#6D3FD8',b=>`<span class="a">${f(b.noo)}</span>`],['SELL OUT','#C25A12',b=>`<span class="a">${f(b.so)}</span>`],['OMZET','#9A6400',b=>`<span class="a">${rp(b.om)}</span><span class="z"><span class="${cl(b.og)}">${b.og>=0?'▲':'▼'} ${n(Math.abs(b.og))}%</span> · ${b.od}</span>`]];
return `<table class="cl"><tr><th style="text-align:left">Indikator</th>${B.map(b=>`<th class="${b.tot?'tt':''}">${b.n}</th>`).join('')}</tr>${R.map(([nm,c,fn])=>`<tr><td class="l" style="border-left:3px solid ${c}">${nm}</td>${B.map(b=>`<td class="${b.tot?'tt':''}">${fn(b)}</td>`).join('')}</tr>`).join('')}</table>`}},
8:{d:'<b>D3 · D2 + garis tipis.</b> Sama dengan D2, ditambah garis tipis 3px di bawah angka aktual SELLTHRU dan DEALER AKTIF sebagai penunjuk pencapaian (biru semua, tidak warna-warni). %ACHV di bawah 50% cuma ditandai teks merah. OMZET ada.',
h:()=>{const sub=(t,p,g,d)=>`<span class="z">dari ${f(t)} · <b class="${p<50?'dn':''}" style="font-weight:600">${n(p)}%</b></span><span class="z"><span class="${cl(g)}">${g>=0?'▲':'▼'} ${n(Math.abs(g))}%</span> · ${d}</span>`;
const ln=p=>`<span class="ln"><i style="width:${Math.min(100,p)}%"></i></span>`;
const R=[['SELLTHRU','#1E5FB8',b=>`<span class="a">${f(b.ak)}</span>${ln(b.ac)}${sub(b.tg,b.ac,b.gr,b.gd)}`],['DEALER AKTIF','#0E7C6B',b=>`<span class="a">${f(b.da)}</span>${ln(b.dac)}${sub(b.dt,b.dac,b.dg,b.dd)}`],['NOO','#6D3FD8',b=>`<span class="a">${f(b.noo)}</span>`],['SELL OUT','#C25A12',b=>`<span class="a">${f(b.so)}</span>`],['OMZET','#9A6400',b=>`<span class="a">${rp(b.om)}</span><span class="z"><span class="${cl(b.og)}">${b.og>=0?'▲':'▼'} ${n(Math.abs(b.og))}%</span> · ${b.od}</span>`]];
return `<table class="cl"><tr><th style="text-align:left">Indikator</th>${B.map(b=>`<th class="${b.tot?'tt':''}">${b.n}</th>`).join('')}</tr>${R.map(([nm,c,fn])=>`<tr><td class="l" style="border-left:3px solid ${c}">${nm}</td>${B.map(b=>`<td class="${b.tot?'tt':''}">${fn(b)}</td>`).join('')}</tr>`).join('')}</table>`}},

9:{d:'<b>E1 · Tabel + cincin.</b> Brand tetap jadi baris. Cuma 6 hal per brand: SELLTHRU (angka + cincin %ACHV), GROWTH, DEALER AKTIF (angka + cincin), NOO, SELL OUT, OMZET. Target dan selisih "dari LMTD" disembunyikan, muncul kalau baris diklik. TOTAL jadi baris biru tua. Coba klik salah satu baris.',
h:()=>E(1)},
10:{d:'<b>E2 · Kartu per brand.</b> Setiap brand satu kartu baris bersudut bulat dengan bayangan lembut, label kecil di atas angka besar. Tanpa garis tabel. TOTAL jadi kartu biru tua di bawah. Klik kartu untuk melihat target dan selisih.',
h:()=>E(2)},
11:{d:'<b>E3 · Tabel minimal, header gelap.</b> Satu pita header biru tua (warna DSM #10394E), baris lega, angka saja. Growth jadi chip kecil satu-satunya elemen berwarna. Cincin dibuang. Klik baris untuk detail.',
h:()=>E(3)},

12:{d:'<b>F1 · C2 yang dipadatkan.</b> Tiap baris cuma satu angka, tinggi sekitar 30px (sebelumnya hampir 45px). Target jadi baris sendiri. Header brand biru tua DSM, label indikator pakai latar tipis warna indikator, bar %ACHV dipipihkan, selisih growth ikut di baris yang sama. OMZET ditambahkan.',h:()=>F(1)},
13:{d:'<b>F2 · Bar tipis.</b> Sama dengan F1, tapi %ACHV tidak pakai bar tebal: angka %-nya saja plus garis tipis 3px di bawahnya. Lebih tenang, warna hanya muncul di garis dan growth.',h:()=>F(2)},
14:{d:'<b>F3 · Aktual / Target satu sel.</b> Paling pendek: "16.212 / 35.351" dalam satu sel (target abu), lalu %ACHV dan Growth. Per indikator cuma 3 baris. Target tetap kelihatan tanpa baris sendiri.',h:()=>F(3)},

15:{d:'<b>G1 · E2 + kolom Target terpisah.</b> Kolom TARGET sendiri di depan SELLTHRU dan di depan DEALER AKTIF, jadi target gampang dibaca lurus ke bawah per brand. Isi lain sama dengan E2. Klik kartu untuk selisih dan growth detail.',h:()=>G(1)},
16:{h:()=>G2(),d:'<b>G2 · E2 + Target di sel angka (revisi 4).</b> Header bold, default warna Biru muda. Sell Out ikut punya growth + LMTD. Header pita bisa dipilih warnanya (tombol Warna); TOTAL ikut warna header. Kotak huruf diganti doughnut %ACHV SELLTHRU per brand. Header bisa dipilih 1/2/3 lewat tombol di atas tabel. Urutan TARGET dulu baru AKTUAL dengan pemisah garis tegak: "35.351 | <b>16.212</b>". Kartu tidak bisa diklik (tanpa rincian tambahan). Data LMTD ditampilkan: kolom Growth sekarang memuat chip % plus angka LMTD dan selisihnya, untuk SELLTHRU dan DEALER AKTIF (kolom growth masing-masing). Omzet juga punya growth + LMTD.',h0:()=>G(2)}
};
function F(v){const bs=B;const cell=(b,html)=>`<td class="${b.tot?'tt':''}">${html}</td>`;
 const gr=(g,d)=>`<span class="gc ${g>=0?'u2':'d2'}">${g>=0?'▲':'▼'} ${n(Math.abs(g))}%</span><span class="sl">${d.split(' · ')[0]}</span>`;
 const ac=(p)=>v===1?`<span class="hb2"><i style="width:${Math.min(100,p)}%;background:${col(p)}"></i><b style="color:${p>=75?'#0E7C6B':p>=50?'#8A5A00':'#B3322C'}">${n(p)}%</b></span>`:`<span class="tl"><b style="color:${p>=75?'#0E7C6B':p>=50?'#8A5A00':'#B3322C'}">${n(p)}%</b><i><u style="width:${Math.min(100,p)}%;background:${col(p)}"></u></i></span>`;
 const blocks=[];
 const L=(nm,c,rows)=>blocks.push({nm,c,rows});
 if(v===3){L('SELLTHRU','#1E5FB8',[['Aktual / Target',b=>`<span class="a">${f(b.ak)}</span> <span class="t">/ ${f(b.tg)}</span>`],['%Achv',b=>`<b style="color:${b.ac>=75?'#0E7C6B':b.ac>=50?'#8A5A00':'#B3322C'}">${n(b.ac)}%</b>`],['Growth',b=>gr(b.gr,b.gd)]]);
  L('DEALER AKTIF','#0E7C6B',[['Aktual / Target',b=>`<span class="a">${f(b.da)}</span> <span class="t">/ ${f(b.dt)}</span>`],['%Achv',b=>`<b style="color:${b.dac>=75?'#0E7C6B':b.dac>=50?'#8A5A00':'#B3322C'}">${n(b.dac)}%</b>`],['Growth',b=>gr(b.dg,b.dd)]]);}
 else{L('SELLTHRU','#1E5FB8',[['Target',b=>`<span class="t">${f(b.tg)}</span>`],['Aktual',b=>`<span class="a">${f(b.ak)}</span>`],['%Achv',b=>ac(b.ac)],['Growth',b=>gr(b.gr,b.gd)]]);
  L('DEALER AKTIF','#0E7C6B',[['Target',b=>`<span class="t">${f(b.dt)}</span>`],['Aktual',b=>`<span class="a">${f(b.da)}</span>`],['%Achv',b=>ac(b.dac)],['Growth',b=>gr(b.dg,b.dd)]]);}
 L('NOO','#6D3FD8',[['Aktual',b=>`<span class="a">${f(b.noo)}</span>`]]);L('SELL OUT','#C25A12',[['Aktual',b=>`<span class="a">${f(b.so)}</span>`]]);L('OMZET','#9A6400',[['Aktual',b=>`<span class="a">${rp(b.om)}</span>`],['Growth',b=>gr(b.og,b.od)]]);
 let h=`<table class="f"><tr><th>INDIKATOR</th><th style="text-align:left"></th>${bs.map(b=>`<th>${b.n}</th>`).join('')}</tr>`;
 blocks.forEach(bl=>bl.rows.forEach((r,i)=>{h+=`<tr class="${i===bl.rows.length-1?'gl':''}" style="--c:${bl.c}">${i===0?`<td class="ind" rowspan="${bl.rows.length}">${bl.nm}</td>`:''}<td class="u">${r[0]}</td>${bs.map(b=>cell(b,r[1](b))).join('')}</tr>`}));return h+'</table>'}

function G(v){const H1=['Brand','Target sellthru','SELLTHRU','Growth','Target dealer','Dealer aktif','NOO','Sell out','Omzet'],H2=['Brand','SELLTHRU','Growth','Dealer aktif','NOO','Sell out','Omzet'];const H=v===1?H1:H2,cc=v===1?'cg':'cg2';
 let h=`<div class="cd"><div class="cr hd ${cc}">${H.map(x=>`<span class="${/^Target/.test(x)?'tgh':''}">${x}</span>`).join('')}</div>`;
 [...B.filter(b=>!b.tot),B.find(b=>b.tot)].forEach(b=>{const pt=x=>`<span class="sm">${n(x)}% dari target</span>`;
  const brand=`<span><span class="bd">${b.n[0]}</span><b>${b.n}</b></span>`,gr=`<span><span class="big">${gtx(b.gr)}</span><span class="sm">vs LMTD</span></span>`,rest=`<span><span class="big">${f(b.noo)}</span></span><span><span class="big">${f(b.so)}</span></span><span><span class="big">${rp(b.om)}</span></span>`;
  h+=`<div class="cr ${cc} ${b.tot?'tt':''}" data-k="${b.n}">${brand}`+(v===1?`<span><span class="tgt">${f(b.tg)}</span></span><span><span class="big">${f(b.ak)}</span>${pt(b.ac)}</span>${gr}<span><span class="tgt">${f(b.dt)}</span></span><span><span class="big">${f(b.da)}</span>${pt(b.dac)}</span>${rest}`:`<span><span class="big">${f(b.ak)} <span class="of">/ ${f(b.tg)}</span></span>${pt(b.ac)}</span>${gr}<span><span class="big">${f(b.da)} <span class="of">/ ${f(b.dt)}</span></span>${pt(b.dac)}</span>${rest}`)+`</div>`;
  if(open_[b.n])h+=`<div class="cx">${det(b)}</div>`});return h+'</div>'}

let hv=2,hcv=4;function dn(p,r){return `<span class="dn2" style="--p:${Math.min(100,p)};--k:${p<50?'#D2453F':'#0B5CAD'}"><b>${Math.round(p)}%</b></span>`}
function G2(){const sp=d=>{const a=d.split(' · dari ');return {sel:a[0],lm:a[1]}};
 const H=[['Brand',''],['Sellthru','target | aktual'],['Growth sellthru','vs LMTD'],['Dealer aktif','target | aktual'],['Growth dealer aktif','vs LMTD'],['NOO',''],['Sell out','aktual · growth vs LMTD'],['Omzet','aktual · growth vs LMTD']];
 const gcell=(g,d)=>{const x=sp(d);return `<span><span class="big">${gtx(g)}</span><span class="lm">LMTD ${x.lm}</span><span class="lm">selisih ${x.sel}</span></span>`};
 let h=`<div class="hsel">Header: ${[['1','1 · Garis bawah'],['2','2 · Pita biru tua'],['3','3 · Per indikator berwarna']].map(([k,t])=>`<button data-h="${k}" class="${+k===hv?'on':''}">${t}</button>`).join('')}<span class="gap"></span>Warna: ${[['1','Biru DSM'],['2','Teal DSM'],['3','Abu kebiruan'],['4','Biru muda']].map(([k,t])=>`<button data-c="${k}" class="${+k===hcv?'on':''}">${t}</button>`).join('')}</div><div class="cd h${hv} hc${hcv}"><div class="cr hd cg3">${H.map(x=>`<span>${x[0]}${x[1]?`<em>${x[1]}</em>`:''}</span>`).join('')}</div>`;
 [...B.filter(b=>!b.tot),B.find(b=>b.tot)].forEach(b=>{const o=sp(b.od);
  h+=`<div class="cr cg3 ${b.tot?'tt':''}"><span>${dn(b.ac)}<b>${b.n}</b></span><span><span class="big"><span class="of2">${f(b.tg)} |</span>${f(b.ak)}</span><span class="sm">${n(b.ac)}% dari target</span></span>${gcell(b.gr,b.gd)}<span><span class="big"><span class="of2">${f(b.dt)} |</span>${f(b.da)}</span><span class="sm">${n(b.dac)}% dari target</span></span>${gcell(b.dg,b.dd)}<span><span class="big">${f(b.noo)}</span></span><span><span class="big">${f(b.so)}</span><span class="lm">${gtx(b.sg)} · LMTD ${f(b.sl)}</span></span><span><span class="big">${rp(b.om)}</span><span class="lm">${gtx(b.og)} · LMTD ${o.lm}</span></span></div>`;
  });return h+'</div>'}

const open_={};
function ring(p){return `<span class="rg" style="--p:${Math.min(100,p)};--k:${p<50?'#D2453F':'#0B5CAD'}"><b>${Math.round(p)}%</b></span>`}
function gtx(g){return `<span class="${cl(g)}">${g>=0?'▲':'▼'} ${n(Math.abs(g))}%</span>`}
function det(b){return `<div class="g"><span>Target SELLTHRU<b>${f(b.tg)}</b></span><span>%Achv SELLTHRU<b>${n(b.ac)}%</b></span><span>Selisih growth<b>${b.gd}</b></span><span>Target dealer aktif<b>${f(b.dt)}</b></span><span>%Achv dealer aktif<b>${n(b.dac)}%</b></span><span>Growth dealer<b>${pc(b.dg)} · ${b.dd}</b></span><span>Growth omzet<b>${pc(b.og)} · ${b.od}</b></span></div>`}
function E(v){const H=['Brand','SELLTHRU','Growth','Dealer aktif','NOO','Sell out','Omzet'];
 if(v===2){let h=`<div class="cd"><div class="cr hd"><span>Brand</span>${H.slice(1).map(x=>`<span>${x}</span>`).join('')}</div>`;[...B.filter(b=>!b.tot),B.find(b=>b.tot)].forEach(b=>{h+=`<div class="cr ${b.tot?'tt':''}" data-k="${b.n}"><span><span class="bd">${b.n[0]}</span><b>${b.n}</b></span><span><span class="big">${f(b.ak)}</span><span class="sm">${n(b.ac)}% dari target</span></span><span><span class="big">${gtx(b.gr)}</span><span class="sm">vs LMTD</span></span><span><span class="big">${f(b.da)}</span><span class="sm">${n(b.dac)}% dari target</span></span><span><span class="big">${f(b.noo)}</span></span><span><span class="big">${f(b.so)}</span></span><span><span class="big">${rp(b.om)}</span></span></div>`;if(open_[b.n])h+=`<div class="cx" style="display:block">${det(b).replace('class="g"','class="g" style="display:flex;gap:26px;flex-wrap:wrap"')}</div>`});return h+'</div>'}
 let h=`<table class="e ${v===3?'e3':''}"><tr><th>${H[0]}</th>${H.slice(1).map(x=>`<th>${x}</th>`).join('')}</tr>`;
 [...B.filter(b=>!b.tot),B.find(b=>b.tot)].forEach(b=>{const o=open_[b.n];
  const st=v===1?`<span class="gw">${ring(b.ac)}<span class="big">${f(b.ak)}</span></span>`:`<span class="tx"><span class="big">${f(b.ak)}</span><small>${n(b.ac)}%</small></span>`;
  const da=v===1?`<span class="gw">${ring(b.dac)}<span class="big">${f(b.da)}</span></span>`:`<span class="tx"><span class="big">${f(b.da)}</span><small>${n(b.dac)}%</small></span>`;
  const gr=v===3&&!b.tot?`<span class="grw ${b.gr>=0?'p-g':'p-r'}">${pc(b.gr)}</span>`:gtx(b.gr);
  h+=`<tr class="row ${b.tot?'tt':''} ${o?'open':''}" data-k="${b.n}"><td>${v===1||v===3&&0?`<span class="bd">${b.n[0]}</span>`:''}<span class="nm">${b.n}</span></td><td>${st}</td><td>${gr}</td><td>${da}</td><td class="big">${f(b.noo)}</td><td class="big">${f(b.so)}</td><td class="big">${rp(b.om)}</td></tr>`;
  if(o)h+=`<tr class="dt"><td colspan="7">${det(b)}</td></tr>`});
 return h+'</table>'}
let cur=15;function draw(o){cur=o;document.getElementById('d').innerHTML=D[o].d;document.getElementById('o').innerHTML=D[o].h();document.querySelectorAll('[data-h]').forEach(e=>e.onclick=()=>{hv=+e.dataset.h;draw(cur)});document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{hcv=+e.dataset.c;draw(cur)});document.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{open_[e.dataset.k]=!open_[e.dataset.k];draw(cur)})}
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('on',x===b));draw(+b.dataset.o)});draw(15);
</script></body></html>
