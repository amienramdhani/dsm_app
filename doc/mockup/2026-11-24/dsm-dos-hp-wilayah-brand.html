<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOS HP · 3 tab (Dealer, Wilayah, Brand)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#EDF0F5;color:#0f172a;font-size:12px}
.mode{position:sticky;top:0;z-index:60;display:flex;gap:6px;padding:8px 14px;background:#fff;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;align-items:center}.mode button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:5px 11px;font-weight:600;cursor:pointer;font-family:inherit;font-size:11.5px}.mode button.on{background:#0B5CAD;color:#fff;border-color:#0B5CAD}.mode small{margin-left:auto;color:#334155}
.frame{max-width:390px;margin:12px auto;border:1px solid #b8c2cf;border-radius:22px;padding:10px;background:#F3F5F8;position:relative;overflow:hidden;min-height:700px}
.pn{background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px;overflow:hidden}.pn .ph{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer}.pn .ph b{font-size:12.5px}.pn .ph small{display:block;font-size:10.5px;color:#334155;font-weight:400}.pn .ph .cv{color:#64748b}
.srt{display:flex;gap:5px;padding:0 12px 8px}.srt span{border:1px solid #cbd5e1;border-radius:6px;padding:3px 9px;font-size:10.5px;font-weight:700;color:#475569}.srt span.on{background:#0B5CAD;color:#fff;border-color:#0B5CAD}
.hd{display:grid;grid-template-columns:1fr 64px 56px 74px;gap:6px;padding:5px 12px;background:#E6EBF1;border-top:1px solid #e5e7eb;border-bottom:2px solid #15303F;font-size:9.5px;font-weight:700;color:#0f172a;text-align:right}.hd span:first-child{text-align:left}
.rw{display:grid;grid-template-columns:1fr 64px 56px 74px;gap:6px;padding:7px 12px;border-bottom:1px solid #EEF2F6;align-items:center;text-align:right;font-size:11.5px;box-shadow:inset 4px 0 0 var(--c);cursor:pointer}.rw .nm{text-align:left;min-width:0}.rw .nm b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw .nm small{display:block;font-size:10px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw .lw{font-size:9.5px;font-weight:700;color:#C0314B}
.rw.tt{background:#E6EBF1;font-weight:700;box-shadow:none;border-top:2px solid #15303F;cursor:default}
.dd{display:inline-block;min-width:60px;text-align:center;border-radius:5px;padding:1px 5px;font-weight:700;font-size:10.5px;background:color-mix(in srgb,var(--c) 12%,#fff);color:color-mix(in srgb,var(--c) 85%,#000)}
.bk{position:absolute;inset:0;background:rgba(15,23,42,.45);display:none;z-index:10;border-radius:22px}.bk.on{display:block}.sh{position:absolute;left:0;right:0;bottom:0;background:#F3F5F8;border-radius:18px 18px 0 0;padding:10px 12px 16px}.sh .gr{width:38px;height:4px;border-radius:2px;background:#b8c2cf;margin:0 auto 10px}.sh h5{margin:0;font-size:14px}.sh p{margin:2px 0 8px;font-size:11px;color:#334155}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:#fff;border-radius:8px;padding:7px 9px}.m span{display:block;font-size:9.5px;font-weight:700;color:#0B3F78}.m b{font-size:15px}.m small{display:block;font-size:10px;color:#334155}
.x{display:block;width:100%;border:0;border-radius:8px;background:#0B5CAD;color:#fff;font-weight:700;font-family:inherit;padding:10px;font-size:12px;margin-top:8px}.ln{display:block;width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:9px;font-weight:700;font-size:12px;color:#0B5CAD;margin-top:8px;font-family:inherit}
.tb{display:flex;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:3px;margin-bottom:8px;position:sticky;top:0;z-index:3}.tb span{flex:1;text-align:center;padding:8px 0;font-size:11.5px;font-weight:700;color:#475569;border-radius:7px;cursor:pointer}.tb span.on{background:#0B5CAD;color:#fff}.tb span small{font-weight:500;margin-left:3px;opacity:.85}
.top{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px;margin-bottom:8px;color:#64748b;font-size:11px}
.cnt{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:10.5px;color:#334155;flex-wrap:wrap}.cnt span{border:1px solid #cbd5e1;border-radius:6px;padding:3px 9px;font-weight:700;color:#475569;background:#fff;cursor:pointer}.cnt span.on{background:#0B5CAD;color:#fff;border-color:#0B5CAD}
.ms2{display:flex;gap:6px;margin:0 0 8px}.ms2 input{flex:1;height:36px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;font:500 12.5px inherit}.ms2 button{height:36px;border:0;border-radius:8px;background:#0B5CAD;color:#fff;font-weight:700;padding:0 16px}
.dc{background:#fff;border:1px solid #e5e7eb;border-left:5px solid var(--c);border-radius:10px;margin-bottom:6px;padding:8px 10px}.dc .h{display:flex;justify-content:space-between;align-items:center}.dc b{font-size:12.5px}.dc small{display:block;font-size:10.5px;color:#334155}.kb{border-radius:5px;padding:2px 7px;font-weight:700;font-size:10px;background:color-mix(in srgb,var(--c) 12%,#fff);color:color-mix(in srgb,var(--c) 85%,#000)}
.more{display:block;width:100%;border:1px dashed #94A3B8;background:#fff;border-radius:8px;padding:9px;font-weight:700;font-size:11.5px;color:#0B5CAD;margin:4px 0 8px;font-family:inherit}
.nav{display:flex;align-items:center;gap:6px;margin:0 0 8px}.nav button{flex:1;height:32px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;font-weight:700;font-size:11.5px;color:#0B5CAD;font-family:inherit}.nav button:disabled{color:#CBD5E1}.nav span{font-size:11px;color:#334155;white-space:nowrap;padding:0 4px}
</style></head><body>
<div class="mode"><b style="font-size:11px">DOS HP · panel per wilayah & per brand</b><small>Data contoh · belum dipasang ke app</small></div>
<div class="frame" id="f"></div>
<script>
const f=x=>x.toLocaleString('id-ID'),d1=x=>x.toLocaleString('id-ID',{maximumFractionDigits:1});
const KC=d=>d==null?'#94A3B8':d<7?'#D9831A':d>45?'#2B5FB8':'#0B8A60';
const W=[['LAMPUNG','SUMATERA BAG. SELATAN',73,2,1820,1610],['SUMATERA SELATAN','SUMATERA BAG. SELATAN',132,14,4110,2140],['JAMBI','SUMATERA BAG. TENGAH',81,8,2010,2390],['KEPULAUAN BANGKA BELITUNG','SUMATERA BAG. SELATAN',20,2,410,380],['GROSS NAS JATIM','JAWA TIMUR',11,3,240,90],['BIG CISUKA','JAWA BARAT',96,26,3120,1050],['RIAU','SUMATERA BAG. TENGAH',196,17,5200,2980]];
const B=[['VILLAON',10948,3696],['REALME',23134,0],['ITEL',34033,9235],['MOTOPAD',5392,553],['TECNO',10799,0],['MOTOROLA',1433,281],['IPHONE',308,0]];
let srt={w:'dos',b:'dos'},open={w:true,b:true},tab='D',lim=10,pg=0;const N=14;
const dos=(s,so)=>so>0?s/(so/N):null;
const dd=d=>`<span class="dd" style="--c:${KC(d)}">${d==null?'—':d>365?'>365 hari':d1(d)+' hari'}</span>`;
function sorted(list,k,key){const L=list.slice();if(k==='dos')L.sort((a,b)=>(key(a)??1e9)-(key(b)??1e9));else if(k==='stok')L.sort((a,b)=>b[a.length?0:0]);return L}
function pw(){const L=W.map(w=>({n:w[0],s:w[1],dl:w[2],lw:w[3],st:w[4],so:w[5],d:dos(w[4],w[5])}));L.sort(srt.w==='dos'?(a,b)=>(a.d??1e9)-(b.d??1e9):srt.w==='low'?(a,b)=>b.lw-a.lw:(a,b)=>b.st-a.st);
 return `<div class="pn"><div class="ph" data-o="w"><div><b>DOS PER WILAYAH</b><small>${L.length} sub region · ketuk baris untuk rincian</small></div><span class="cv">${open.w?'▾':'▸'}</span></div>${open.w?`<div class="srt">${[['dos','DOS terendah'],['low','Menipis/habis'],['stok','Stok terbesar']].map(x=>`<span data-s="w:${x[0]}" class="${srt.w===x[0]?'on':''}">${x[1]}</span>`).join('')}</div><div class="hd"><span>SUB REGION</span><span>STOK</span><span>SO ${N}H</span><span>DOS</span></div>${L.map((x,i)=>`<div class="rw" style="--c:${KC(x.d)}" data-w="${i}"><div class="nm"><b>${x.n}</b><small>${x.dl} dealer${x.lw?` · <span class="lw">${x.lw} menipis/habis</span>`:''}</small></div><span>${f(x.st)}</span><span>${f(x.so)}</span>${dd(x.d)}</div>`).join('')}<div class="rw tt"><div class="nm"><b>TOTAL</b></div><span>${f(L.reduce((a,x)=>a+x.st,0))}</span><span>${f(L.reduce((a,x)=>a+x.so,0))}</span>${dd(dos(L.reduce((a,x)=>a+x.st,0),L.reduce((a,x)=>a+x.so,0)))}</div>`:''}</div>`;}
function pb(){const L=B.map(b=>({n:b[0],st:b[1],so:b[2],d:dos(b[1],b[2])}));L.sort(srt.b==='dos'?(a,b)=>(a.d??1e9)-(b.d??1e9):(a,b)=>b.st-a.st);
 return `<div class="pn"><div class="ph" data-o="b"><div><b>DOS PER BRAND</b><small>gabungan dealer sesuai filter</small></div><span class="cv">${open.b?'▾':'▸'}</span></div>${open.b?`<div class="srt">${[['dos','DOS terendah'],['stok','Stok terbesar']].map(x=>`<span data-s="b:${x[0]}" class="${srt.b===x[0]?'on':''}">${x[1]}</span>`).join('')}</div><div class="hd"><span>BRAND</span><span>STOK</span><span>SO ${N}H</span><span>DOS</span></div>${L.map((x,i)=>`<div class="rw" style="--c:${KC(x.d)}"><div class="nm"><b>${x.n}</b><small>rata-rata ${x.so?d1(x.so/N):'0'} / hari</small></div><span>${f(x.st)}</span><span>${x.so?f(x.so):'—'}</span>${dd(x.d)}</div>`).join('')}<div class="rw tt"><div class="nm"><b>TOTAL</b></div><span>${f(L.reduce((a,x)=>a+x.st,0))}</span><span>${f(L.reduce((a,x)=>a+x.so,0))}</span>${dd(dos(L.reduce((a,x)=>a+x.st,0),L.reduce((a,x)=>a+x.so,0)))}</div>`:''}</div>`;}
function sheet(i){const x=W[i],d=dos(x[4],x[5]);return `<div class="gr"></div><h5>${x[0]}</h5><p>${x[1]} · basis SO ${N} hari</p><div class="g2"><div class="m"><span>DEALER</span><b>${x[2]}</b><small>dealer unik</small></div><div class="m"><span>MENIPIS / HABIS</span><b style="color:#C0314B">${x[3]}</b><small>pasangan dealer–type</small></div><div class="m"><span>ESTIMASI STOK</span><b>${f(x[4])}</b></div><div class="m"><span>SO ${N} HARI</span><b>${f(x[5])}</b><small>rata-rata ${d1(x[5]/N)} / hari</small></div></div><div class="m" style="margin-top:8px"><span>DOS</span>${dd(d)}</div><button class="ln">Tampilkan dealer di ${x[0]} →</button><button class="x" id="cl">TUTUP</button>`}
const DL=Array.from({length:37},(_,i)=>{const k=[['HABIS','#C0314B'],['PERLU CEK DATA','#6D3FD8'],['MENIPIS','#D9831A'],['CUKUP','#0B8A60']][i<8?0:i<11?1:i<20?2:3];return {n:['ABADI MOBILE SOREANG','BP STORE BUKITTINGGI','CV. INDAH PONSEL TAMORA','SINAR CELL','GLOBAL PHONE','MAJU JAYA','ANUGRAH SELULER'][i%7]+' '+(i+1),k}});
function pd(){const per=lim==='all'?DL.length:lim,np=Math.max(1,Math.ceil(DL.length/per));if(pg>=np)pg=np-1;const L=DL.slice(pg*per,pg*per+per);const nav=`<div class="nav"><button data-p="-1" ${pg?'':'disabled'}>‹ Sebelumnya</button><span>Hal <b>${pg+1}</b> dari ${np}</span><button data-p="1" ${pg<np-1?'':'disabled'}>Berikutnya ›</button></div>`;return `<div class="ms2"><input placeholder="Cari nama / kode dealer"><button>CARI</button></div><div class="cnt">Per halaman ${[10,25,50].map(n=>`<span data-l="${n}" class="${lim===n?'on':''}">${n}</span>`).join('')}<span data-l="all" class="${lim==='all'?'on':''}">Semua</span><em style="font-style:normal;margin-left:auto">${pg*per+1}–${pg*per+L.length} dari ${DL.length}</em></div>${np>1?nav:''}${L.map(d=>`<div class="dc" style="--c:${d.k[1]}"><div class="h"><b>${d.n}</b><span class="kb" style="--c:${d.k[1]}">${d.k[0]}</span></div><small>BRAND · STOK · SO · DOS … (isi kartu sama seperti sekarang)</small></div>`).join('')}${np>1?nav:''}`}
function draw(){const F=document.getElementById('f');F.innerHTML=`<div class="top">FILTER · kartu angka · bar kondisi (sama seperti sekarang)</div><div class="tb">${[['D','DEALER',DL.length],['W','WILAYAH',W.length],['B','BRAND',B.length]].map(t=>`<span data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}<small>${t[2]}</small></span>`).join('')}</div>`+(tab==='D'?pd():tab==='W'?pw():pb())+'<div class="bk" id="bk"><div class="sh" id="sh"></div></div>';
 F.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{tab=e.dataset.t;draw()});F.querySelectorAll('[data-l]').forEach(e=>e.onclick=()=>{lim=e.dataset.l==='all'?'all':+e.dataset.l;pg=0;draw()});F.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{pg+=+e.dataset.p;draw();window.scrollTo(0,0)});F.querySelectorAll('[data-o]').forEach(e=>e.onclick=()=>{open[e.dataset.o]=!open[e.dataset.o];draw()});F.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{const[a,b]=e.dataset.s.split(':');srt[a]=b;draw()});
 F.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>{document.getElementById('sh').innerHTML=sheet(+e.dataset.w);document.getElementById('bk').classList.add('on');document.getElementById('cl').onclick=()=>document.getElementById('bk').classList.remove('on')});
 const bk=document.getElementById('bk');bk.onclick=e=>{if(e.target===bk)bk.classList.remove('on')}}draw();
</script></body></html>
