<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSM Klaim · Ajukan klaim · opsi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#EDF0F5;color:#0f172a;font-size:12px}
.mode{position:sticky;top:0;z-index:60;display:flex;gap:6px;padding:8px 14px;background:#fff;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;align-items:center}.mode button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:5px 11px;font-weight:600;cursor:pointer;font-family:inherit;font-size:11.5px}.mode button.on{background:#0B5CAD;color:#fff;border-color:#0B5CAD}.mode small{margin-left:auto;color:#334155}
.wrap{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;padding:14px}
.ph{width:390px;border:1px solid #b8c2cf;border-radius:22px;background:#F3F5F8;overflow:hidden;flex:none}.ph .cap{text-align:center;font-size:11px;font-weight:700;color:#B4501F;padding:6px 0;background:#fff;border-bottom:1px solid #e5e7eb}
.hd{background:#0B5CAD;color:#fff;padding:12px 16px 14px;display:flex;align-items:center;gap:10px}.hd .bk{font-size:18px;font-weight:700}.hd div{flex:1}.hd small{display:block;font-size:10px;letter-spacing:.5px;color:#CFE3F7}.hd b{font-size:17px}.hd .bell{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.hd.old{padding:12px 16px 60px;display:block}.hd.old b{display:block;font-size:19px;margin-top:4px}
.body{padding:10px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px;margin-bottom:8px;color:#64748b}.sr input{border:0;outline:0;flex:1;font:inherit;font-size:12px}
.hint{font-size:10.5px;color:#334155;margin:0 2px 8px}
/* A kartu */
.ca{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ca .t{display:flex;align-items:center;gap:9px}.ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}.ca .t b{font-size:13.5px;flex:1}.ca .t .sisa{text-align:right;font-size:10px;color:#334155}.ca .t .sisa b{display:block;font-size:12px;color:#0f172a}
.bud{height:5px;border-radius:3px;background:#EEF2F6;margin:7px 0 8px;overflow:hidden}.bud i{display:block;height:100%;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid color-mix(in srgb,var(--c) 30%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff);color:color-mix(in srgb,var(--c) 85%,#000);border-radius:8px;padding:6px 10px;font-weight:600;font-size:11.5px}
.gab{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed #E2E8F0;color:#0B5CAD;font-weight:700;font-size:11px}
/* B grid */
.cb{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.g3 div{border:1px solid #EEF2F6;border-radius:10px;padding:8px 4px;text-align:center;font-size:10.5px;font-weight:600;color:#0f172a;background:#FAFBFD}.g3 div .ic2{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin:0 auto 5px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}.g3 div.gb{border-style:dashed;color:#0B5CAD;background:#fff}
/* C daftar */
.cc{background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:8px;overflow:hidden}.cc .t{display:flex;align-items:center;gap:9px;padding:10px 12px;background:color-mix(in srgb,var(--c) 7%,#fff);border-bottom:1px solid #EEF2F6}.cc .t b{flex:1;font-size:13px}.cc .t small{font-size:10.5px;color:#334155}
.cc .r{display:flex;align-items:center;padding:9px 12px;border-bottom:1px solid #F1F5F9;font-size:12px;font-weight:600}.cc .r:last-child{border:0}.cc .r span{flex:1}.cc .r em{color:#94A3B8;font-style:normal;font-size:15px}.cc .r.gb{color:#0B5CAD;font-size:11px}
.tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:8px}.tabs span{flex:none;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;color:#475569}.tabs span.on{background:#0B5CAD;color:#fff;border-color:#0B5CAD}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.g4 div{position:relative;border:1px solid #EEF2F6;border-radius:9px;padding:6px 3px 5px;text-align:center;font-size:10px;font-weight:600;color:#0f172a;background:#FAFBFD;cursor:pointer;line-height:1.2;min-height:54px}
.g4 div .ic2{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin:0 auto 3px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}.g4 div .ic2 svg{width:14px;height:14px}
.g4 div.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:inset 0 0 0 1px var(--c)}.g4 div.on::after{content:'✓';position:absolute;top:3px;right:4px;width:14px;height:14px;border-radius:50%;background:var(--c);color:#fff;font-size:9px;display:grid;place-items:center}
.g4 div.dim{opacity:.4}
.cb2{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:8px 10px;margin-bottom:7px}.cb2 .t{display:flex;align-items:center;gap:8px;margin-bottom:6px}.cb2 .t .ic{width:26px;height:26px;border-radius:7px}.cb2 .t .ic svg{width:15px;height:15px}.cb2 .t b{flex:1;font-size:12.5px}.cb2 .t small{font-size:10px;color:#334155}.cb2 .t small b{font-size:11px;color:#0f172a}
.ph.b2{position:relative}.ph.b2 .body{padding-bottom:90px}
.bar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;padding:8px 10px 10px;box-shadow:0 -4px 12px rgba(15,23,42,.06)}.bar .sel{display:flex;gap:4px;flex-wrap:wrap;font-size:10.5px;margin-bottom:6px;color:#334155}.bar .sel span{background:color-mix(in srgb,var(--c) 10%,#fff);color:color-mix(in srgb,var(--c) 85%,#000);border-radius:6px;padding:2px 7px;font-weight:700}
.bar button{width:100%;border:0;border-radius:9px;background:#0B5CAD;color:#fff;font-weight:800;font-size:12.5px;padding:11px;font-family:inherit}.bar button:disabled{background:#CBD5E1}
.toast{font-size:10.5px;background:#FFF6E0;border:1px solid #F6E3B4;color:#7A5200;border-radius:8px;padding:6px 9px;margin-bottom:8px}
</style></head><body>
<div class="mode"><b style="font-size:11px">Ajukan klaim · HP</b><small>Data contoh · belum dipasang ke app</small></div>
<div class="wrap" id="w"></div>
<script>
const I={fuel:'<path d="M4 20V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15M3 20h12M6 8h6M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/>',food:'<path d="M5 3v8a3 3 0 0 0 6 0V3M8 3v18M16 21V3c3 1 4 4 4 8h-4"/>',bag:'<rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2M4 12h16"/>',build:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4"/>',
toll:'<path d="M4 20 8 4M20 20 16 4M12 6v2M12 11v2M12 16v2"/>',park:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"/>',car:'<path d="M5 17h14M6 17v2M18 17v2M4 13l2-6h12l2 6v4H4z"/>',tick:'<path d="M4 8a2 2 0 0 0 0 4v4h16v-4a2 2 0 0 0 0-4V4H4z M14 4v12"/>',meet:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1.5 6 5"/>',cake:'<path d="M4 21h16v-8H4zM4 16c2 1 4 1 4 0s2-1 4 0 4 1 4 0 4 1 4 0M12 13V9M12 6a1 1 0 0 0 0-2"/>',flower:'<circle cx="12" cy="8" r="3"/><path d="M12 11v10M12 16c-3 0-5-2-5-4M12 18c3 0 5-2 5-4"/>',gift:'<rect x="3" y="8" width="18" height="5"/><path d="M5 13v8h14v-8M12 8v13M12 8c-2-4-6-3-4 0M12 8c2-4 6-3 4 0"/>',plane:'<path d="M3 13l18-7-5 14-4-6-9-1z"/>',bed:'<path d="M3 18V7M3 13h18v5M7 13V10h5v3"/>',box:'<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>',wrench:'<path d="M14 6a4 4 0 0 0-5 5L3 17l4 4 6-6a4 4 0 0 0 5-5l-3 3-3-3z"/>',dots:'<circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',bell:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>'};
const sv=k=>`<svg class="i" viewBox="0 0 24 24">${I[k]}</svg>`;
const C=[['Transportasi','#1E5FB8','fuel',1923900,3000000,[['BBM','fuel'],['Tol','toll'],['Parkir','park'],['Ojol & taksi online','car'],['Tiket perjalanan','tick']],1],['Entertain','#C25A12','food',1500000,1500000,[['Meeting','meet'],['Makan-makan','food'],['Kue ulang tahun','cake'],['Karangan bunga','flower'],['Reward / Hadiah','gift']],1],['Perdin','#0E7C6B','bag',null,null,[['Perdin','plane'],['Uang makan','food']],0],['Operasional','#6D3FD8','build',null,null,[['Kost','bed'],['Penginapan / Hotel','bed'],['ATK & perlengkapan kantor','box'],['Ongkir & kurir','box'],['Servis kendaraan','wrench'],['Operasional lainnya','dots']],1]];
const f=x=>'Rp '+x.toLocaleString('id-ID');
const hd=`<div class="hd"><span class="bk">←</span><div><small>PEMOHON</small><b>Ajukan klaim</b></div><span class="bell">${sv('bell')}</span></div>`;
const sisa=c=>c[3]==null?'<div class="sisa">tanpa batas budget</div>':`<div class="sisa">sisa budget<b>${f(c[3])}</b></div>`;
function A(){return hd+'<div class="body"><div class="hint">Pilih jenis klaim. Bisa gabung beberapa jenis dalam satu kategori.</div>'+C.map(c=>`<div class="ca" style="--c:${c[1]}"><div class="t"><span class="ic">${sv(c[2])}</span><b>${c[0]}</b>${sisa(c)}</div>${c[3]!=null?`<div class="bud"><i style="width:${c[3]/c[4]*100}%"></i></div>`:'<div style="height:8px"></div>'}<div class="chips">${c[5].map(j=>`<span>${j[0]}</span>`).join('')}</div>${c[6]?`<div class="gab">${sv('plus')} Gabung beberapa jenis dalam satu klaim</div>`:''}</div>`).join('')+'</div>'}
function B(){return hd+'<div class="body"><div class="sr">'+sv('search')+'<input placeholder="Cari jenis klaim, mis. bensin, hotel"></div>'+C.map(c=>`<div class="cb" style="--c:${c[1]}"><div class="ca" style="border:0;padding:0;margin:0 0 8px"><div class="t"><span class="ic">${sv(c[2])}</span><b>${c[0]}</b>${sisa(c)}</div></div><div class="g3">${c[5].map(j=>`<div><span class="ic2">${sv(j[1])}</span>${j[0]}</div>`).join('')}${c[6]?`<div class="gb"><span class="ic2" style="background:#EEF4FB;color:#0B5CAD">${sv('plus')}</span>Gabung jenis</div>`:''}</div></div>`).join('')+'</div>'}
function Cc(){return hd+'<div class="body"><div class="tabs">'+C.map((c,i)=>`<span class="${i?'':'on'}">${c[0]}</span>`).join('')+'</div>'+C.map(c=>`<div class="cc" style="--c:${c[1]}"><div class="t"><span class="ic">${sv(c[2])}</span><b>${c[0]}</b><small>${c[3]==null?'tanpa batas':'sisa '+f(c[3])}</small></div>${c[5].map(j=>`<div class="r"><span>${j[0]}</span><em>›</em></div>`).join('')}${c[6]?`<div class="r gb"><span>+ Gabung beberapa jenis dalam satu klaim</span></div>`:''}</div>`).join('')+'</div>'}
let SEL={cat:null,j:new Set()},MSG='';
function B2(){const cat=SEL.cat;return hd+'<div class="body"><div class="sr">'+sv('search')+'<input placeholder="Cari jenis klaim, mis. bensin, hotel"></div><div class="hint">Ketuk satu atau beberapa jenis (dalam satu kategori), lalu <b>Lanjut ajukan</b>.</div>'+(MSG?`<div class="toast">${MSG}</div>`:'')+C.map((c,ci)=>`<div class="cb2" style="--c:${c[1]}"><div class="t"><span class="ic">${sv(c[2])}</span><b>${c[0]}</b><small>${c[3]==null?'tanpa batas budget':'sisa <b>'+f(c[3])+'</b>'}</small></div><div class="g4">${c[5].map((j,ji)=>{const k=ci+':'+ji,on=SEL.j.has(k);return `<div data-j="${k}" class="${on?'on':''}${cat!=null&&cat!==ci?' dim':''}"><span class="ic2">${sv(j[1])}</span>${j[0]}</div>`}).join('')}</div></div>`).join('')+'</div>'+(()=>{const n=SEL.j.size,c=cat!=null?C[cat]:null;return `<div class="bar" style="--c:${c?c[1]:'#0B5CAD'}">${n?`<div class="sel">${c[0]}: ${[...SEL.j].map(k=>`<span>${c[5][+k.split(':')[1]][0]}</span>`).join('')}</div>`:'<div class="sel">Belum ada jenis dipilih</div>'}<button ${n?'':'disabled'}>LANJUT AJUKAN${n?` (${n} jenis)`:''} →</button></div>`})()}
function OLD(){return `<div class="hd old"><span class="bk" style="font-size:12px">← Kembali</span><small style="margin-top:6px">PEMOHON</small><b>Ajukan klaim</b></div><div class="body" style="color:#64748b;font-size:11px;padding:14px">Header biru tinggi · kartu dengan emoji · chip biru seragam · tombol "Gabung" kotak kuning putus-putus di tiap kartu</div>`}
document.getElementById('w').innerHTML=`<div class="ph"><div class="cap">SEKARANG</div>${OLD()}</div><div class="ph b2" id="b2"></div><div class="ph"><div class="cap">B (versi tadi)</div>${B()}</div>`;
function drawB2(){const h=document.getElementById('b2');h.innerHTML='<div class="cap">B2 · pendek + pilih beberapa + LANJUT AJUKAN</div>'+B2();h.querySelectorAll('[data-j]').forEach(e=>e.onclick=()=>{const k=e.dataset.j,ci=+k.split(':')[0];MSG='';if(SEL.cat!=null&&SEL.cat!==ci){SEL={cat:ci,j:new Set([k])};MSG='Pilihan sebelumnya dihapus: satu klaim hanya untuk satu kategori ('+C[ci][0]+').';}else{SEL.cat=ci;SEL.j.has(k)?SEL.j.delete(k):SEL.j.add(k);if(!SEL.j.size)SEL.cat=null;}drawB2();});}
SEL={cat:0,j:new Set(['0:0','0:1'])};drawB2();
</script></body></html>
