<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit target · kotak input halus</title><style>
*{box-sizing:border-box;font-family:Inter,"Segoe UI",system-ui,sans-serif}body{margin:0;background:#EEF2F6;color:#10394E;font-size:11px;padding:12px;max-width:900px;margin:auto}
.pick{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.pick button{border:1px solid #CBD5E0;background:#fff;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}.pick button.on{background:#0B5CAD;color:#fff;border-color:#0B5CAD}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(16,57,78,.1);padding:10px;overflow:auto}table{border-collapse:collapse}
th{background:#E6EBF1;padding:7px 10px;border-bottom:2px solid #15303F}td{padding:3px 8px;border-top:1px solid #E3E9F1;white-space:nowrap;text-align:center}td:first-child,th:first-child{text-align:left;min-width:190px}
.in{display:inline-block;width:46px;height:22px;text-align:right;padding:3px 6px;border-radius:6px;cursor:text}
.S .in{border:1px solid #CBD5E0;background:#fff}
.A .in{border:1px solid transparent;border-bottom:1px dashed #B8C4D3;border-radius:0;background:transparent}
.B .in{border:1px solid #E6ECF3;background:rgba(255,255,255,.55)}
.C .in{border:1px solid transparent;background:transparent}.C .in:hover,.C .in.f{border-color:#0B5CAD;background:#fff}
.C .in:empty:after,.A .in:empty:after{content:"–";color:#B8C4D3}
</style></head><body><b style="font-size:14px">Edit target · kotak input lebih halus (lebar 46)</b>
<div style="color:#64748B;margin:4px 0">Arahkan kursor ke kotak untuk lihat efek hover. Baris diwarnai seperti zigzag yang sudah disetujui.</div>
<div class="pick" id="p"><button data-c="S">SEKARANG</button><button data-c="A" class="on">A · GARIS PUTUS</button><button data-c="B">B · BORDER SAMAR</button><button data-c="C">C · POLOS, BORDER SAAT SOROT</button></div>
<div class="card A" id="c"><table><tr><th>SALES</th><th>ST ITEL</th><th>ST MOTOPAD</th><th>ST MOTOROLA</th><th>ST REALME</th><th>DA ITEL</th></tr>
<tr style="background:#F3F8FD"><td>KHARISMA CAHYA RAMADHAN</td><td><span class=in>727</span></td><td><span class=in>27</span></td><td><span class=in></span></td><td><span class=in>436</span></td><td><span class=in>39</span></td></tr>
<tr style="background:#F3F8FD"><td>PURNAMA RUDIARTO</td><td><span class=in>1524</span></td><td><span class=in>35</span></td><td><span class=in></span></td><td><span class=in>1033</span></td><td><span class=in>39</span></td></tr>
<tr style="background:#D6E4F5;font-weight:700"><td>ASM ACHMAD ROBBY</td><td>2.251</td><td>62</td><td></td><td>1.469</td><td>78</td></tr></table></div>
<script>p.onclick=e=>{const b=e.target.closest('button');if(!b)return;[...p.children].forEach(x=>x.classList.toggle('on',x===b));c.className='card '+b.dataset.c}</script></body></html>
