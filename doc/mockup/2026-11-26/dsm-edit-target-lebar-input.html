<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit target · lebar kotak input</title><style>
*{box-sizing:border-box;font-family:Inter,"Segoe UI",system-ui,sans-serif}body{margin:0;background:#EEF2F6;color:#10394E;font-size:11px;padding:12px;max-width:900px;margin:auto}
.pick{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.pick button{border:1px solid #CBD5E0;background:#fff;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}.pick button.on{background:#0B5CAD;color:#fff;border-color:#0B5CAD}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(16,57,78,.1);padding:10px;overflow:auto}table{border-collapse:collapse}
th{background:#E6EBF1;padding:7px 10px;border-bottom:2px solid #15303F;text-align:center}td{padding:3px 8px;border-top:1px solid #E3E9F1;white-space:nowrap;text-align:center}td:first-child,th:first-child{text-align:left;min-width:190px}
.in{display:inline-block;width:var(--w);height:22px;border:1px solid #CBD5E0;border-radius:6px;background:#fff;text-align:right;padding:3px 6px}
</style></head><body><b style="font-size:14px">Edit target · lebar kotak input</b>
<div style="color:#64748B;margin:4px 0">Sekarang kotak ±82px dan kolom ikut melebar mengikuti judul. Pilih ukuran.</div>
<div class="pick" id="p"><button data-w="82px">SEKARANG 82</button><button data-w="64px" class="on">A · 64</button><button data-w="54px">B · 54</button><button data-w="46px">C · 46</button></div>
<div class="card" id="c" style="--w:64px"><table><tr><th>SALES</th><th>ST ITEL</th><th>ST MOTOPAD</th><th>ST MOTOROLA</th><th>ST REALME</th><th>DA ITEL</th><th>DA MOTOPAD</th><th>NOO MOTOPAD</th></tr>
<tr><td>KHARISMA CAHYA RAMADHAN</td><td><span class=in>727</span></td><td><span class=in>27</span></td><td><span class=in></span></td><td><span class=in>436</span></td><td><span class=in>39</span></td><td><span class=in>5</span></td><td><span class=in>2</span></td></tr>
<tr><td>PURNAMA RUDIARTO</td><td><span class=in>1524</span></td><td><span class=in>35</span></td><td><span class=in></span></td><td><span class=in>1033</span></td><td><span class=in>39</span></td><td><span class=in></span></td><td><span class=in></span></td></tr></table></div>
<script>p.onclick=e=>{const b=e.target.closest('button');if(!b)return;[...p.children].forEach(x=>x.classList.toggle('on',x===b));c.style.setProperty('--w',b.dataset.w)}</script></body></html>
